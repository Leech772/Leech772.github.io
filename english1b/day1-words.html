  <div class="card" id="card">
    <div class="unit-tag" id="unit">U1</div>
    <div class="hint" id="hint">中英文对照 · 点朗读听发音</div>
    <div class="main" id="main">—</div>
    <div class="phon" id="phon"></div>
    <div class="zh" id="zh">—</div>
    <div class="extra" id="extra"></div>
  </div>

  <div class="speak-row">
    <button class="speak" id="speak" type="button">🔊 朗读</button>
    <button class="slow" id="speakSlow" type="button">🐢 慢速</button>
    <label class="auto"><input type="checkbox" id="autoSpeak" checked /> 自动朗读</label>
  </div>

  <div class="quiz-area" id="quiz">
    <div class="e1b-res" id="res" aria-live="polite"></div>
    <input id="answer" type="text" autocomplete="off" placeholder="输入英文单词…" />
    <div class="actions">
      <button class="primary" id="check" type="button">检查</button><button class="primary" id="go" type="button" style="display:none">✅ 确定，下一个 →</button>
    </div>
  </div>

  <div class="actions" id="rate">
    <button type="button" class="unknow" id="unknow">再看一遍</button>
    <button type="button" class="know" id="know">认识了</button>
  </div>
  <div class="nav">
    <button type="button" id="prev">上一个</button>
    <button type="button" id="shuffle">打乱</button>
    <button type="button" id="reset">重置进度</button>
  </div>

  <div class="done" id="done">
    <h2 style="margin:0 0 8px">本轮刷完啦 🎉</h2>
    <p class="sub" id="doneMsg"></p>
    <button type="button" class="primary" id="restart" style="margin-top:12px;border:none;border-radius:999px;padding:10px 18px;background:var(--accent);color:#fff;cursor:pointer">再刷一轮</button>
  </div>

<script>
const WORDS = [
  { unit:"U1", en:"name", phon:"/neɪm/", pos:"n.", zh:"名字" },
  { unit:"U1", en:"call", phon:"/kɔːl/", pos:"v.", zh:"称呼", tip:"Just call me Bill." },
  { unit:"U1", en:"spell", phon:"/spel/", pos:"v.", zh:"拼写", tip:"How do you spell…?" },
  { unit:"U1", en:"friend", phon:"/frend/", pos:"n.", zh:"朋友", tip:"friendly 友好的" },
  { unit:"U1", en:"from", phon:"/frɒm/", pos:"prep.", zh:"来自", tip:"I'm from Beijing." },
  { unit:"U1", en:"glad", phon:"/ɡlæd/", pos:"adj.", zh:"高兴的", tip:"Glad to meet you." },
  { unit:"U1", en:"child", phon:"/tʃaɪld/", pos:"n.", zh:"孩子", tip:"复数 children" },
  { unit:"U1", en:"classmate", phon:"/ˈklɑːsmeɪt/", pos:"n.", zh:"同班同学" },
  { unit:"U1", en:"lovely", phon:"/ˈlʌvli/", pos:"adj.", zh:"可爱的；美丽的" },
  { unit:"U1", en:"pet", phon:"/pet/", pos:"n.", zh:"宠物" },
  { unit:"U1", en:"family name", phon:"", pos:"", zh:"姓" },
  { unit:"U1", en:"full name", phon:"", pos:"", zh:"全名" },
  { unit:"U2", en:"hobby", phon:"/ˈhɒbi/", pos:"n.", zh:"兴趣爱好" },
  { unit:"U2", en:"doctor", phon:"/ˈdɒktə(r)/", pos:"n.", zh:"医生" },
  { unit:"U2", en:"cashier", phon:"/kæˈʃɪə(r)/", pos:"n.", zh:"收银员" },
  { unit:"U2", en:"cycle", phon:"/ˈsaɪkl/", pos:"v.", zh:"骑自行车" },
  { unit:"U2", en:"receptionist", phon:"/rɪˈsepʃənɪst/", pos:"n.", zh:"（宾馆前台）接待员" },
  { unit:"U2", en:"exciting", phon:"/ɪkˈsaɪtɪŋ/", pos:"adj.", zh:"令人激动的" },
  { unit:"U2", en:"boring", phon:"/ˈbɔːrɪŋ/", pos:"adj.", zh:"无聊的" },
  { unit:"U2", en:"stressful", phon:"/ˈstresfl/", pos:"adj.", zh:"压力大的" },
  { unit:"U2", en:"stress", phon:"/stres/", pos:"n.", zh:"精神压力" },
  { unit:"U2", en:"piano", phon:"/piˈænəʊ/", pos:"n.", zh:"钢琴" },
  { unit:"U2", en:"release", phon:"/rɪˈliːs/", pos:"v.", zh:"释放", tip:"release stress" },
  { unit:"U2", en:"interesting", phon:"/ˈɪntrəstɪŋ/", pos:"adj.", zh:"有趣的" },
  { unit:"U2", en:"collect", phon:"/kəˈlekt/", pos:"v.", zh:"收集" },
  { unit:"U2", en:"hate", phon:"/heɪt/", pos:"v.", zh:"厌恶" },
  { unit:"U2", en:"free time", phon:"", pos:"", zh:"业余（课余）时间" },
  { unit:"U2", en:"tour guide", phon:"", pos:"", zh:"导游" },
  { unit:"U2", en:"travel agency", phon:"", pos:"", zh:"旅行社" },
  { unit:"U2", en:"play basketball", phon:"", pos:"", zh:"打篮球" },
];

let mode = "both";
let order = WORDS.map((_, i) => i);
let i = 0;
let shown = false;
let known = new Set();
let again = new Set();
let enVoice = null;
let voiceMeta = { label: "检测中…", isUK: false, isFemale: false, tier: "none" };

const $ = (id) => document.getElementById(id);

function isFemaleName(name) {
  return /female|woman|girl|emma|serena|kate|karen|susan|zira|hazel|martha|moira|fiona|tessa|victoria|aria|jenny|salli|ivy|joanna|kendra|kimberly|amy|libby|sonia|anya|natalie|google uk english female/i.test(name)
    && !/male|david|daniel|thomas|fred|alex(?!a)|arthur|george|oliver|rishi|ryan|mark|james/i.test(name);
}
function isMaleName(name) {
  return /male|david|daniel|thomas|fred|arthur|george|oliver|rishi|ryan|mark|james|google uk english male/i.test(name);
}
function scoreVoice(v) {
  const lang = (v.lang || "").toLowerCase();
  const name = v.name || "";
  let score = 0;
  const isGB = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const isUS = /en(-|_)us/.test(lang);
  const isEN = /^en/.test(lang);
  const female = isFemaleName(name);
  const male = isMaleName(name);
  if (/google uk english female/i.test(name)) score += 1000;
  if (isGB && female) score += 800;
  if (isGB && !male) score += 500;
  if (isGB) score += 300;
  if (/emma|serena|kate|libby|sonia|hazel|martha|moira|fiona|tessa/i.test(name) && isGB) score += 120;
  if (!isGB && female && isUS) score += 180;
  if (!isGB && female && isEN) score += 120;
  if (isUS && !male) score += 60;
  if (isEN) score += 20;
  if (/samantha/i.test(name)) score -= 80;
  if (male) score -= 200;
  if (!isEN) score -= 500;
  return score;
}
function pickBestVoice(preferredName) {
  if (!window.speechSynthesis) {
    enVoice = null;
    voiceMeta = { label: "不支持朗读", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const voices = speechSynthesis.getVoices() || [];
  const enVoices = voices.filter(v => /^en/i.test(v.lang || ""));
  let chosen = null;
  if (preferredName) {
    chosen = enVoices.find(v => v.name === preferredName) || voices.find(v => v.name === preferredName) || null;
  }
  if (!chosen && enVoices.length) {
    chosen = enVoices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
  }
  enVoice = chosen;
  if (!chosen) {
    voiceMeta = { label: "未找到英语语音", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const lang = (chosen.lang || "").toLowerCase();
  const name = chosen.name || "";
  const isUK = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const female = isFemaleName(name) || (!isMaleName(name) && isUK);
  let tier = "fallback";
  if (isUK && female) tier = "uk-female";
  else if (isUK) tier = "uk";
  else if (female) tier = "us-female";
  voiceMeta = { label: name, isUK, isFemale: !!female, tier };
}
function refreshVoiceUI() {
  const nameEl = $("voiceName");
  const tagEl = $("voiceTag");
  const tipEl = $("voiceTip");
  const sel = $("voiceSelect");
  if (!nameEl) return;
  nameEl.textContent = voiceMeta.label || "未知";
  if (voiceMeta.tier === "uk-female") tagEl.textContent = "（英式女声）";
  else if (voiceMeta.tier === "uk") tagEl.textContent = "（英式）";
  else if (voiceMeta.tier === "us-female") tagEl.textContent = "（美式女声·后备）";
  else if (voiceMeta.tier === "fallback") tagEl.textContent = "（后备）";
  else tagEl.textContent = "";
  const needTip = voiceMeta.tier !== "uk-female";
  tipEl.classList.toggle("show", needTip);
  if (needTip && voiceMeta.tier === "none") {
    tipEl.textContent = "未检测到可用英语语音。请用 Chrome，或在系统设置中安装「英语（英国）」语音包。";
  } else if (needTip) {
    tipEl.textContent = "未检测到英式女声，已用后备音色。请用 Chrome，或在系统安装英式语音包以获得最佳效果。";
  }
  if (sel && !sel.dataset.filled) {
    const voices = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang || ""));
    voices.sort((a, b) => scoreVoice(b) - scoreVoice(a));
    sel.innerHTML = "";
    if (!voices.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "无可用英语语音";
      sel.appendChild(opt);
    } else {
      voices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        const uk = /en(-|_)gb/i.test(v.lang) || /uk english|british/i.test(v.name);
        const mark = uk ? "🇬🇧" : (/en(-|_)us/i.test(v.lang) ? "🇺🇸" : "🌐");
        opt.textContent = mark + " " + v.name + " (" + v.lang + ")";
        sel.appendChild(opt);
      });
    }
    sel.dataset.filled = "1";
  }
  if (sel && enVoice) sel.value = enVoice.name;
}
function initVoices() {
  pickBestVoice();
  const sel = $("voiceSelect");
  if (sel) sel.dataset.filled = "";
  refreshVoiceUI();
}
initVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = initVoices;
}
document.addEventListener("DOMContentLoaded", () => {
  const sel = $("voiceSelect");
  if (sel) sel.onchange = () => { pickBestVoice(sel.value); refreshVoiceUI(); };
});
// also bind immediately in case DOM already ready
(function bindVoiceSelect() {
  const sel = $("voiceSelect");
  if (sel) sel.onchange = () => { pickBestVoice(sel.value); refreshVoiceUI(); };
})();

function speakWord(text, rate) {
  if (!text || !window.speechSynthesis) {
    alert("当前浏览器不支持朗读，请用 Chrome / Edge 打开这个文件。");
    return;
  }
  if (!enVoice) initVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = rate || 0.93;
  u.pitch = 1.05;
  if (enVoice) u.voice = enVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function shuffle(a) {
  for (let j = a.length - 1; j > 0; j--) {
    const k = Math.floor(Math.random() * (j + 1));
    [a[j], a[k]] = [a[k], a[j]];
  }
}
function w() { return WORDS[order[i]]; }
function updateStats() {
  $("total").textContent = WORDS.length;
  $("total2").textContent = order.length;
  $("idx").textContent = order.length ? i + 1 : 0;
  $("known").textContent = known.size;
  $("again").textContent = again.size;
  $("bar").style.width = (order.length ? (i / order.length * 100) : 0) + "%";
}
function maybeAutoSpeak() {
  if (!$("autoSpeak").checked) return;
  if (i >= order.length) return;
  if (mode === "spell" && !shown) return;
  speakWord(w().en, 0.92);
}
function showBoth(word) {
  $("main").textContent = word.en;
  $("phon").textContent = word.phon || "";
  $("zh").textContent = word.zh;
  $("extra").textContent = [word.pos, word.tip].filter(Boolean).join(" · ");
  $("card").classList.remove("quiz-hide");
}
function render() {
  try { window.__wDone = false; $("check").style.display = ""; $("go").style.display = "none"; $("answer").readOnly = false; $("res").textContent = ""; } catch (e) {}
  if (i >= order.length) {
    $("card").style.display = "none";
    $("rate").style.display = "none";
    $("quiz").classList.remove("show");
    document.querySelector(".speak-row").style.display = "none";
    $("done").classList.add("show");
    $("doneMsg").textContent = `认识 ${known.size} · 再看 ${again.size} · 共 ${WORDS.length} 词。回聊天继续语法吧。`;
    updateStats();
    return;
  }
  document.querySelector(".speak-row").style.display = "flex";
  $("done").classList.remove("show");
  $("card").style.display = "flex";
  $("rate").style.display = "flex";
  const word = w();
  shown = false;
  $("card").classList.remove("flip");
  $("unit").textContent = word.unit;
  if (mode === "spell") {
    $("quiz").classList.add("show");
    $("rate").style.display = "none";
    $("hint").textContent = "听朗读或看中文，拼出英文";
    $("main").textContent = "";
    $("phon").textContent = "";
    $("zh").textContent = word.zh;
    $("extra").textContent = "";
    $("answer").value = "";
    $("answer").focus();
  } else {
    $("quiz").classList.remove("show");
    $("hint").textContent = "中英文对照 · 点朗读听发音";
    showBoth(word);
  }
  updateStats();
  setTimeout(maybeAutoSpeak, 200);
}
function reveal() {
  if (mode !== "spell" || shown || i >= order.length) return;
  shown = true;
  showBoth(w());
  $("hint").textContent = "已显示答案";
  speakWord(w().en, 0.92);
}
function next(markKnown) {
  const id = order[i];
  if (markKnown) { known.add(id); again.delete(id); }
  else { again.add(id); known.delete(id); }
  i++;
  render();
}
$("card").onclick = reveal;
document.querySelectorAll(".modes button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    i = 0; shown = false;
    render();
  };
});
$("speak").onclick = (e) => { e.stopPropagation(); if (i < order.length) speakWord(w().en, 0.92); };
$("speakSlow").onclick = (e) => { e.stopPropagation(); if (i < order.length) speakWord(w().en, 0.65); };
$("know").onclick = () => next(true);
$("unknow").onclick = () => next(false);
$("prev").onclick = () => { if (i > 0) { i--; render(); } };
$("shuffle").onclick = () => { shuffle(order); i = 0; render(); };
$("reset").onclick = () => { known.clear(); again.clear(); order = WORDS.map((_,x)=>x); i = 0; render(); };
$("restart").onclick = () => {
  order = again.size ? [...again] : WORDS.map((_,x)=>x);
  if (!again.size) shuffle(order);
  i = 0; known.clear(); render();
};
$("check").onclick = () => {
  if (window.__wDone) { $("go").click(); return; }
  const word = w();
  const val = $("answer").value.trim().toLowerCase();
  if (!val) { $("res").className = "e1b-res bad"; $("res").textContent = "先输入英文再点检查哦"; return; }
  const ok = val === word.en.toLowerCase();
  const id = order[i];
  showBoth(word);
  if (ok) { known.add(id); again.delete(id); $("res").className = "e1b-res ok"; $("res").textContent = "✅ 拼对了：" + word.en; }
  else { again.add(id); known.delete(id); $("res").className = "e1b-res bad"; $("res").textContent = "❌ 正确答案：" + word.en + "（你写的：" + val + "）"; }
  speakWord(word.en, ok ? 0.93 : 0.85);
  window.__wDone = true; $("check").style.display = "none"; $("go").style.display = ""; $("answer").readOnly = true; updateStats();
};
$("go").onclick = () => { window.__wDone = false; i++; render(); };
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") $("check").click(); });
shuffle(order);
render();
</script>
<script>window.E1B_PAGE_IDX=0;
/* E1B_OXUI_V1 · 东方 Q 版角色（与 oxford100 同一套素材）+ iOS 防点不动 */
(function(){
var BLANK="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
var SLUGS=["reimu","marisa","cirno","meiling","patchouli","sakuya","remilia","flandre","alice","youmu","yuyuko","yukari","reisen","aya","sanae","suwako","tenshi","suika","koishi","nitori","chen","rumia","tewi","kogasa"];
var PAIRS=[["reimu","marisa"],["cirno","flandre"],["sakuya","remilia"],["youmu","yuyuko"],["sanae","suwako"],["alice","patchouli"]];
function Q(){return window.__QCHARS||{};}
function icon(s){return Q()[s+"-icon"]||BLANK;}
function full(s){return Q()[s]||BLANK;}
var busy=false;
function fixTypes(){try{document.querySelectorAll("button:not([type])").forEach(function(b){b.setAttribute("type","button");});}catch(e){}}
function ensure(el,slug){
  if(!el||!slug)return;
  if(el.classList.contains("fs-fixed")||el.classList.contains("fs-btn"))return;
  if(!el.classList.contains("has-mascot"))el.classList.add("has-mascot","mascot-left");
  var img=null;for(var i=0;i<el.children.length;i++){if(el.children[i].classList.contains("btn-mascot")){img=el.children[i];break;}}
  if(!img){img=document.createElement("img");img.className="btn-mascot";img.alt="";img.setAttribute("aria-hidden","true");img.decoding="async";el.appendChild(img);}
  var src=icon(slug);
  if(img.dataset.slug!==slug||img.getAttribute("src")!==src){img.dataset.slug=slug;img.src=src;}
}
function sides(){
  var L=document.getElementById("charLeft"),R=document.getElementById("charRight");if(!L||!R)return;
  var n=0;try{var on=document.querySelector("#daynav button.on");if(on){n=[].indexOf.call(on.parentNode.children,on);}else{n=(window.E1B_PAGE_IDX||0);}}catch(e){}
  var p=PAIRS[((n%PAIRS.length)+PAIRS.length)%PAIRS.length];
  if(L.getAttribute("src")!==full(p[0]))L.src=full(p[0]);
  if(R.getAttribute("src")!==full(p[1]))R.src=full(p[1]);
}
function decorate(){
  if(busy)return;busy=true;
  try{
    fixTypes();
    var k=0;
    var sel="#daynav button, #tabs button, #navMain button, .tabs button, .nav-main button, .modes button, .hub-go, #bHome, #bIntro";
    var seen=[];
    document.querySelectorAll(sel).forEach(function(el){if(seen.indexOf(el)>=0)return;seen.push(el);ensure(el,SLUGS[k%SLUGS.length]);k++;});
    sides();
  }catch(e){window.__tfErr&&window.__tfErr("e1b-decorate",e);}
  busy=false;
}
var t=null;function later(){if(t)return;t=setTimeout(function(){t=null;decorate();},120);}
window.E1B_DECORATE=decorate;
function boot(){
  decorate();
  try{new MutationObserver(function(ms){if(busy)return;for(var i=0;i<ms.length;i++){var m=ms[i];if(m.type==="childList"){later();return;}}}).observe(document.body,{childList:true,subtree:true});}catch(e){}
  document.addEventListener("click",later,true);
  var packs=["/oxford100/assets/qchars-pack-0.js?v=20261102hd","/oxford100/assets/qchars-pack-1.js?v=20261102hd"];
  setTimeout(function(){packs.forEach(function(src){var s=document.createElement("script");s.src=src;s.async=true;s.onload=function(){decorate();};s.onerror=function(){};document.head.appendChild(s);});},300);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
