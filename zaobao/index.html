\n“这份合同苛刻得异乎寻常，”首尔的娱乐行业律师卢宗彦（音）说。他是为《纽约时报》审阅NewJeans合同的五名专家之一。“它对艺人自由的限制程度即使在近年来大厂牌的合同中也极为罕见。”\n\nNewJeans争议的核心是该组合与厂牌Ador的斗争。Ador是娱乐集团Hybe旗下的厂牌，Hybe是K-pop巨头，旗下拥有BTS和Katseye等组合。\n\nHybe安排四名发言人接受了一次长时间采访，并提供了一份书面声明，但要求采访和声明中的信息均以公司代表的名义发布。\n\nHybe表示，旗下厂牌的合同合法，谈判也秉持诚信原则，条款旨在保护艺人及公司的财务投资。韩国政府的合同范本不具有约束力，Hybe表示，合同中的修改得到了成员家长的认可。\n\n音乐行业的合同纠纷并不新鲜。男子组合’NSync成员兰斯·巴斯最近表示，在组合最红的时候，他每天只有35美元生活费。泰勒·斯威夫特也曾因失去对音乐母带的控制权而引起广泛关注。\n\n但曾代理布兰妮·斯皮尔斯和Cardi B等艺人的娱乐行业律师律师迪娜·拉波尔特表示，这类合同在美国基本已成为历史遗物，在K-pop业界则不然。韩国的娱乐公司同时扮演唱片公司、经纪人和代理人的角色，控制艺人生活的方方面面。\n\n“在K-pop，你要么按他们说的做，按他们说的穿，按他们说的做头发，要么就会被换掉，”拉波尔特说。\n\n在签署合同时，NewJeans的五名成员范玉昕、金玟池(Minji Kim)、李惠仁(Hyein Lee)、姜谐潾(Haerin Kang)和牟智慧(Danielle Marsh)已经接受了多年训练。她们从练习生宿舍开始自己的演艺之路，最小的一个入住时只有12岁，而且没有人能保证她们最终能够出道。\n\n据多名与该组合关系密切的人士透露，排练到凌晨两点是司空见惯的事情。由于担心遭到公司报复，他们要求匿名。\n\n训练区域安装了监控摄像头。三名与该组合关系密切的人士表示，训练期间，不鼓励她们休息。五名成员中有四人在训练期间辍学。\n\nHybe的代表表示，公司完全遵守儿童保护法律，并努力确保艺人在安全的环境中工作和训练。公司表示，从不施压要求艺人辍学，也不会因为艺人休息而惩罚他们。\n\n为保护艺人，韩国政府的模板保障身心健康、教育和睡眠权。它禁止唱片公司强迫未成年人超时工作。\n\n但NewJeans的合同删除了这些内容。专家表示，这使组合成员更难就工作条件提出异议。\n\n《纽约时报》获得的电子邮件显示，合同条款基本上没有协商余地。2022年1月，一名成员的母亲在签约前提出了几处修改要求。\n\nAdor副总裁回复说：“如果您无法接受目前的合同草案，包括上述几点，那么最好重新考虑是否签署这份合同。”\n\n世界各地的艺人都会调整自己的外在形象，但K-pop的娱乐公司经常为旗下艺人安排整容手术。这在韩国很少引起争议，因为韩国是全球整容手术比例最高的国家之一。\n\n据对前偶像的采访，K-pop厂牌敦促歌手做鼻整形或眼睑手术，哪怕有时对方只有十几岁。厂牌通常先垫付手术费用，之后再向艺人收费。\n\nNewJeans的合同规定，成员必须偿还公司在她们担任练习生期间为整容手术及其他美容项目支付的相当一部分费用\n\nNewJeans正式出道前，摄影师从多个角度为成员拍照，以便研究舞台灯光照在她们身上的效果。据两名与组合关系密切的人士透露，随后公司向其中几名成员建议接受美容整形。\n\nHybe代表在书面声明中表示，公司不要求艺人整容。“我们甚至不会违背个人意愿推荐整容手术或美容项目。”上述两名知情人士也表示，在整容十分普遍的韩国及其娱乐行业，这些建议并不被视为强迫。\n\n《纽约时报》不会披露NewJeans成员的医疗史。\n\n整容手术往往造成K-pop所谓的“练习生债务”。许多歌手职业生涯开始时，欠下训练和其他费用，然后通过演艺收入还债。\n\n在这方面，NewJeans是个例外。Hybe承担了组合早期的费用，因此成员从出道起便能获得收入，没有债务。公司代表表示，练习生费用如何处理由旗下各厂牌自行决定，NewJeans的情况由Ador决定。（Hybe目前正与Ador前首席执行官打官司。）\n\n专家表示，从财务角度看，NewJeans的合同在K-pop行业相当常见。扣除开支后，组合可以获得演唱会、广告和宣传活动约一半的利润，外加唱片销售和流媒体播放收入中的一小部分分成。\n\n拉波尔特说，这样的条款在美国会被认为“极其恶劣”，因为美国艺人可以自行聘请经纪人和代理，并保留大部分巡演收入。\n\n2024年10月，在NewJeans成为Spotify平台上最快达到10亿次播放量的K-pop艺人后，范玉欣在韩国国会作证时表示，她认为Ador憎恨她和其他成员。她指责公司员工在社交媒体上侮辱这个组合，在媒体报道中淡化她们的成就，有时甚至对她们不理不睬。\n\n但她的合同并不允许她公开发表这样的言论。合同禁止歌手传播可能损害公司声誉的“真实或虚假事实”，还禁止未成年人饮酒、吸毒，以及一些定义模糊的行为，例如“态度不真诚”“疏于自我管理”和“不适当的恋爱关系”。\n\n专家表示，这些条款给了唱片公司很大的解释空间，可以据此指控艺人违约。\n\n范玉欣作证几周后，NewJeans成员指责Ador向媒体泄露训练视频，并敦促公司改善对她们的待遇。\n\n双方协商无果后，NewJeans成员召开记者会，宣布退出该公司。这场反抗震动了整个行业。Ador随后提起诉讼，双方展开了长达数月的法律争斗。2025年3月，该组合宣布退出近一年后，法官作出有利于公司的裁决，认定NewJeans不能自行开展演艺活动。\n\n根据合同条款，这次试图反抗公司的举动使成员面临潜在诉讼和数百万美元赔偿的风险。\n\n根据提交韩国法院的一份会议记录，成员家属曾试图缓和矛盾，要求公司不要报复。\n\n公司没有给出这样的保证，称停摆已经让其损失了很多钱。\n\n2025年12月，公司终止了与NewJeans成员牟智慧的合同，并对当时20岁的她提起诉讼。公司称，她拒绝工作、未经授权独自开展项目和拍摄照片，还与第三方签订协议，违反了合同。\n\n牟智慧的律师表示，公司是在惩罚她参与此前的反抗行动。\n\n这起诉讼揭示了K-pop行业的一项特殊做法：合同通常允许公司要求支付解约金，即使是由公司而非歌手单方面终止合作关系也是如此。\n\n在牟智慧的案件中，公司向她索赔约2200万美元，其中大部分是解约赔偿金。公司声称，她的行为实际上已导致合同关系破裂。\n\n韩国政府的合同范本建议，根据艺人的平均月收入和合同剩余月数计算赔偿金额。NewJeans的合同采用了类似公式，但有所修改：计算平均收入时，不是把所有月份都计入，而是只计算组合有收入的月份。审阅合同的律师表示，这种修改可能抬高赔偿金额。\n\nHybe的代表表示，公司的解约赔偿条款符合行业标准。他们还称，实际操作中，这种计算方法不会增加赔偿金额，因为旗下艺人每个月都有收入。\n\n牟智慧的律师郑钟采（音）向韩国公平交易委员会提出投诉，指控Hybe和Ador试图终结她的演艺事业。\n\n郑钟采认为，牟智慧在公司以外开展的少量工作不过是借口，他表示，公司的真正目的是向整个行业发出警告。\n\n“如果你试图摆脱Hybe的控制，这就是你要付出的代价，”他说。\n\n根据韩国政府的合同范本，公司使用艺人姓名、肖像和声音的权利应随合同终止而结束。但NewJeans的合同并非如此。\n\n成员的合同将持续到2029年。此后，合同仍允许公司继续使用她们的身份形象，并将相关使用权授权给第三方。NewJeans成员仍有权获得报酬，但将无法控制自己的肖像和声音如何被使用，包括人工智能生成的NewJeans声音克隆和聊天机器人。\n\n法律专家表示，这些合同条款究竟能在多大程度上得到法院支持，目前尚不清楚。\n\nHybe还可以在合同结束后继续出售和重新包装NewJeans的音乐作品，同时大幅削减应支付给成员的报酬。法律专家称，这一条款并不寻常。\n\nNewJeans的未来仍充满不确定性。公司曾暗示可能推出新专辑，但组合已经一年多没有登台演出。", "body": "两年前，屡创纪录的韩国女子组合NewJeans的五名成员做出了一件近一代人以来从未有同等知名度的韩流明星做过的事：与公司解约。当时，部分成员还只有十几岁。\n\n“留在公司只会延长我们的精神痛苦，”成员之一范玉欣(Hanni Pham)对记者说。那是她们的专辑《Get Up》登顶美国排行榜约一年后。\n\n随后发生的是K-pop历史上最具爆炸性的争议之一：一场围绕艺术自由的、长达数年的法律与权力斗争。在这个行业里，娱乐公司从艺人十几岁起就对其严密控制。高管们警告说，如果NewJeans可以一走了之，价值数十亿美元的K-pop产业可能崩溃。\n\n这场争端的核心是五名成员在14岁至17岁时签署的秘密合同。当时，她们大多默默无闻，怀揣着明星梦。《纽约时报》获得了这些合同，得以罕见地窥见韩国的娱乐公司如何严密控制旗下艺人，即便是最红的明星也不例外。（合同中的姓名和家庭住址等信息已被隐去。《纽约时报》为保护个人隐私，又进一步遮盖了部分信息。）\n\n韩国政府有一套K-pop合同模板，保障受教育权以及身心健康权。NewJeans的合同删去了这些表述。合同禁止诸如“态度不真诚”、进入“不适当的恋爱关系”或批评厂牌等行为。协议包含高额退出条款，允许厂牌在合同结束后继续销售NewJeans的音乐，同时削减支付给组合的款项。它还赋予厂牌无限期使用人工智能生成的NewJeans声音的权利。\n\n长期以来，K-pop一直受到剥削艺人的指控。厂牌招募儿童，让他们接受多年高强度训练，之后往往还要求他们偿还培训费用。一些艺人表示，即使能够在座无虚席的体育场演出，他们仍被迫节食到近乎挨饿的程度，并背负长期债务。已有多名韩流“爱豆”自杀。\n\nNewJeans的合同表明，尽管多年来业界不断承诺改革，政府也出手干预，但实际情况并没有多少改变，即使对于当今最成功的组合之一也是如此。\n\n“这份合同苛刻得异乎寻常，”首尔的娱乐行业律师卢宗彦（音）说。他是为《纽约时报》审阅NewJeans合同的五名专家之一。“它对艺人自由的限制程度即使在近年来大厂牌的合同中也极为罕见。”\n\nNewJeans争议的核心是该组合与厂牌Ador的斗争。Ador是娱乐集团Hybe旗下的厂牌，Hybe是K-pop巨头，旗下拥有BTS和Katseye等组合。\n\nHybe安排四名发言人接受了一次长时间采访，并提供了一份书面声明，但要求采访和声明中的信息均以公司代表的名义发布。\n\nHybe表示，旗下厂牌的合同合法，谈判也秉持诚信原则，条款旨在保护艺人及公司的财务投资。韩国政府的合同范本不具有约束力，Hybe表示，合同中的修改得到了成员家长的认可。\n\n音乐行业的合同纠纷并不新鲜。男子组合’NSync成员兰斯·巴斯最近表示，在组合最红的时候，他每天只有35美元生活费。泰勒·斯威夫特也曾因失去对音乐母带的控制权而引起广泛关注。\n\n但曾代理布兰妮·斯皮尔斯和Cardi B等艺人的娱乐行业律师律师迪娜·拉波尔特表示，这类合同在美国基本已成为历史遗物，在K-pop业界则不然。韩国的娱乐公司同时扮演唱片公司、经纪人和代理人的角色，控制艺人生活的方方面面。\n\n“在K-pop，你要么按他们说的做，按他们说的穿，按他们说的做头发，要么就会被换掉，”拉波尔特说。\n\n在签署合同时，NewJeans的五名成员范玉昕、金玟池(Minji Kim)、李惠仁(Hyein Lee)、姜谐潾(Haerin Kang)和牟智慧(Danielle Marsh)已经接受了多年训练。她们从练习生宿舍开始自己的演艺之路，最小的一个入住时只有12岁，而且没有人能保证她们最终能够出道。\n\n据多名与该组合关系密切的人士透露，排练到凌晨两点是司空见惯的事情。由于担心遭到公司报复，他们要求匿名。\n\n训练区域安装了监控摄像头。三名与该组合关系密切的人士表示，训练期间，不鼓励她们休息。五名成员中有四人在训练期间辍学。\n\nHybe的代表表示，公司完全遵守儿童保护法律，并努力确保艺人在安全的环境中工作和训练。公司表示，从不施压要求艺人辍学，也不会因为艺人休息而惩罚他们。\n\n为保护艺人，韩国政府的模板保障身心健康、教育和睡眠权。它禁止唱片公司强迫未成年人超时工作。\n\n但NewJeans的合同删除了这些内容。专家表示，这使组合成员更难就工作条件提出异议。\n\n《纽约时报》获得的电子邮件显示，合同条款基本上没有协商余地。2022年1月，一名成员的母亲在签约前提出了几处修改要求。\n\nAdor副总裁回复说：“如果您无法接受目前的合同草案，包括上述几点，那么最好重新考虑是否签署这份合同。”\n\n世界各地的艺人都会调整自己的外在形象，但K-pop的娱乐公司经常为旗下艺人安排整容手术。这在韩国很少引起争议，因为韩国是全球整容手术比例最高的国家之一。\n\n据对前偶像的采访，K-pop厂牌敦促歌手做鼻整形或眼睑手术，哪怕有时对方只有十几岁。厂牌通常先垫付手术费用，之后再向艺人收费。\n\nNewJeans的合同规定，成员必须偿还公司在她们担任练习生期间为整容手术及其他美容项目支付的相当一部分费用\n\nNewJeans正式出道前，摄影师从多个角度为成员拍照，以便研究舞台灯光照在她们身上的效果。据两名与组合关系密切的人士透露，随后公司向其中几名成员建议接受美容整形。\n\nHybe代表在书面声明中表示，公司不要求艺人整容。“我们甚至不会违背个人意愿推荐整容手术或美容项目。”上述两名知情人士也表示，在整容十分普遍的韩国及其娱乐行业，这些建议并不被视为强迫。\n\n《纽约时报》不会披露NewJeans成员的医疗史。\n\n整容手术往往造成K-pop所谓的“练习生债务”。许多歌手职业生涯开始时，欠下训练和其他费用，然后通过演艺收入还债。\n\n在这方面，NewJeans是个例外。Hybe承担了组合早期的费用，因此成员从出道起便能获得收入，没有债务。公司代表表示，练习生费用如何处理由旗下各厂牌自行决定，NewJeans的情况由Ador决定。（Hybe目前正与Ador前首席执行官打官司。）\n\n专家表示，从财务角度看，NewJeans的合同在K-pop行业相当常见。扣除开支后，组合可以获得演唱会、广告和宣传活动约一半的利润，外加唱片销售和流媒体播放收入中的一小部分分成。\n\n拉波尔特说，这样的条款在美国会被认为“极其恶劣”，因为美国艺人可以自行聘请经纪人和代理，并保留大部分巡演收入。\n\n2024年10月，在NewJeans成为Spotify平台上最快达到10亿次播放量的K-pop艺人后，范玉欣在韩国国会作证时表示，她认为Ador憎恨她和其他成员。她指责公司员工在社交媒体上侮辱这个组合，在媒体报道中淡化她们的成就，有时甚至对她们不理不睬。\n\n但她的合同并不允许她公开发表这样的言论。合同禁止歌手传播可能损害公司声誉的“真实或虚假事实”，还禁止未成年人饮酒、吸毒，以及一些定义模糊的行为，例如“态度不真诚”“疏于自我管理”和“不适当的恋爱关系”。\n\n专家表示，这些条款给了唱片公司很大的解释空间，可以据此指控艺人违约。\n\n范玉欣作证几周后，NewJeans成员指责Ador向媒体泄露训练视频，并敦促公司改善对她们的待遇。\n\n双方协商无果后，NewJeans成员召开记者会，宣布退出该公司。这场反抗震动了整个行业。Ador随后提起诉讼，双方展开了长达数月的法律争斗。2025年3月，该组合宣布退出近一年后，法官作出有利于公司的裁决，认定NewJeans不能自行开展演艺活动。\n\n根据合同条款，这次试图反抗公司的举动使成员面临潜在诉讼和数百万美元赔偿的风险。\n\n根据提交韩国法院的一份会议记录，成员家属曾试图缓和矛盾，要求公司不要报复。\n\n公司没有给出这样的保证，称停摆已经让其损失了很多钱。\n\n2025年12月，公司终止了与NewJeans成员牟智慧的合同，并对当时20岁的她提起诉讼。公司称，她拒绝工作、未经授权独自开展项目和拍摄照片，还与第三方签订协议，违反了合同。\n\n牟智慧的律师表示，公司是在惩罚她参与此前的反抗行动。\n\n这起诉讼揭示了K-pop行业的一项特殊做法：合同通常允许公司要求支付解约金，即使是由公司而非歌手单方面终止合作关系也是如此。\n\n在牟智慧的案件中，公司向她索赔约2200万美元，其中大部分是解约赔偿金。公司声称，她的行为实际上已导致合同关系破裂。\n\n韩国政府的合同范本建议，根据艺人的平均月收入和合同剩余月数计算赔偿金额。NewJeans的合同采用了类似公式，但有所修改：计算平均收入时，不是把所有月份都计入，而是只计算组合有收入的月份。审阅合同的律师表示，这种修改可能抬高赔偿金额。\n\nHybe的代表表示，公司的解约赔偿条款符合行业标准。他们还称，实际操作中，这种计算方法不会增加赔偿金额，因为旗下艺人每个月都有收入。\n\n牟智慧的律师郑钟采（音）向韩国公平交易委员会提出投诉，指控Hybe和Ador试图终结她的演艺事业。\n\n郑钟采认为，牟智慧在公司以外开展的少量工作不过是借口，他表示，公司的真正目的是向整个行业发出警告。\n\n“如果你试图摆脱Hybe的控制，这就是你要付出的代价，”他说。\n\n根据韩国政府的合同范本，公司使用艺人姓名、肖像和声音的权利应随合同终止而结束。但NewJeans的合同并非如此。\n\n成员的合同将持续到2029年。此后，合同仍允许公司继续使用她们的身份形象，并将相关使用权授权给第三方。NewJeans成员仍有权获得报酬，但将无法控制自己的肖像和声音如何被使用，包括人工智能生成的NewJeans声音克隆和聊天机器人。\n\n法律专家表示，这些合同条款究竟能在多大程度上得到法院支持，目前尚不清楚。\n\nHybe还可以在合同结束后继续出售和重新包装NewJeans的音乐作品，同时大幅削减应支付给成员的报酬。法律专家称，这一条款并不寻常。\n\nNewJeans的未来仍充满不确定性。公司曾暗示可能推出新专辑，但组合已经一年多没有登台演出。", "link": "https://cn.nytimes.com/culture/20261106/kpop-newjeans-contract/?utm_source=RSS", "time": "11月06日 03:22", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "“敌人是我们自己”：揭秘特朗普团队的历史性溃败", "title_zh": "“敌人是我们自己”：揭秘特朗普团队的历史性溃败", "summary_orig": "特朗普在经济等诸多问题上失去了公众信任。时报采访了多名内部人士，详细解释了一位不受欢迎的总统和一场不受欢迎的战争如何为民主党的中期选举中全面胜利提供了机会。 Doug Mills/The New York Times 上个月，特朗普总统在蒙大拿州卡利斯佩尔市参加了一场竞选集会。", "summary_zh": "特朗普在经济等诸多问题上失去了公众信任。时报采访了多名内部人士，详细解释了一位不受欢迎的总统和一场不受欢迎的战争如何为民主党的中期选举中全面胜利提供了机会。 Doug Mills/The New York Times 上个月，特朗普总统在蒙大拿州卡利斯佩尔市参加了一场竞选集会。", "body_orig": "", "body_zh": "选举前六天，唐纳德·特朗普总统的二十多名高级策略师连入了一场私密的视频通话。\n\n“你们是想先吃白药丸，还是黑药丸？”总统的首席民调专家托尼·法布里齐奥问道。\n\n共和党顶级数据顾问之一蒂姆·萨勒给出了两种可能情形。第一个是拥有4亿美元经费的超级政治行动委员会“MAGA公司”(MAGA Inc.)有效动员了他们想动员且预计会投票的选民。“这是乐观的设想，”他说。\n\n据参与通话的四人透露，离开白宫转而负责监督总统的中期选举策略的詹姆斯·布莱尔在笑声中说：“我正在安排后事。我建议大家也早做准备。”\n\n在大约30分钟的时间里，通话内容充斥着黑色幽默：葬礼安排、监狱伙食、总统赦免，甚至还一度聊到流亡海外。\n\n“至少比比赢了。他会保护我们的，”在提及以色列总理本雅明·内塔尼亚胡时，布莱尔讽刺地说道，内塔尼亚胡的国家在前一天举行了投票。（内塔尼亚胡的阵营未能获得多数席位，其党派随后声称选举存在舞弊。）\n\n“也许我们能在以色列获得庇护，”法布里齐奥说。\n\n民主党人以压倒性优势夺得众议院多数席位，并赢得了参议院的控制权。这是一场了不起的胜利，得益于民主党人在堪萨斯州、南卡罗来纳州和得克萨斯州等共和党重镇的胜利。一年前几乎无人能够预料到这样的结果。\n\n本文记述的共和党崩溃基于对70多人的采访，受访者包括直接参与中期选举的议员、政治策略师、党派领袖、民调专家、白宫官员和国会助手。其中许多人获准匿名发言，以便披露不为外界所知的谈话内容和决策过程。\n\n共和党人拥有创纪录的筹款规模、世界首富的支持、最高法院一项有利于竞选资金的裁决，并且面对着一个士气低落且不受欢迎的反对党。\n\n在参议院，目前的竞选版图使得民主党人不得不在几十年未曾赢过的州展开竞争。\n\n而在众议院，特朗普团队打破了每十年重划一次国会选区的传统，试图通过划定新选区来帮助共和党巩固其微弱的多数席位。\n\n共和党人无法克服的难关在于，总统在经济及其他诸多问题上失去了公众信任。他们未曾料到的是，一场在中东发生的不受欢迎的战争——这场战争导致霍尔木兹海峡关闭，并将汽油价格推高至每加仑4美元以上——会一路蔓延，贯穿整个选举。\n\n而这一次，民主党人做好了准备，抓住了共和党人的失误。\n\n布莱尔今夏分发给白宫西翼官员的演示文稿展现出了严峻的形势。\n\n其中一张幻灯片将共和党的民调数据与伊朗战争的时间表联系在了一起。\n\n它展示了民主党的优势如何在激烈的敌对行动期间扩大，在“谅解备忘录”谈判期间缩小，随后在停火破裂时再度飙升。\n\n截至7月底，民主党人在国会选票上已经占据了10个百分点的优势。\n\n最终的“结论”显而易见。内容用荧光黄标出：如果民主党人只有4个百分点的优势，共和党人仍然有可能赢得众议院。“但这必须在停火延长、霍尔木兹海峡开放且汽油价格下降的情况下才会发生，”幻灯片警告称。\n\n“接近D+10的最终结果可能会让我们失去参议院。”\n\n周二的实际结果甚至更糟：根据《纽约时报》估计，特朗普的共和党在全国国会选举总票数上预计将以约13个百分点的劣势落败。这将是自​​水门事件之后，半个世纪以来最惨重的败局。\n\n甚至在投票站关闭之前，特朗普就已经开始反复回想原本可能发生的情况。\n\n“如果我们当初没有卷入伊朗，你认为中期选举会发生什么？”据一位与总统交谈过的人士透露，总统曾私下这样问道。\n\n这场战争之所以成为如此巨大的影响因素，是因为它向选民讲述了一个简单的故事。\n\n作为候选人，特朗普曾承诺不发动新战争，但他发动了一场新战争。\n\n他承诺降低物价，但汽油价格飙升，通货膨胀加剧。\n\n共和党中期选举崩盘的故事不仅是一个打破承诺的故事，也是一个激进越权的故事。在特朗普从2021年1月6日之后的政治弃儿状态中回归后，一些顾问认为他已经开始相信，政治规则唯独对他不再适用。那种错觉在周二晚上被彻底粉碎了。\n\n近两年里，傲慢已经成为特朗普第二任期的治理哲学。\n\n层出不穷的调查报道揭露，特朗普、他的家人及其亲密伙伴利用总统职位明目张胆地为自己敛财。这些报道开始引起选民的共鸣；福克斯新闻10月初的一项民调显示，腐败是选民最关心的问题。（白宫发言人安娜·凯利表示：“总统行事只考虑美国人民的最大利益。不存在利益冲突。”）\n\n2025年，特朗普对全世界发动了一场贸易战——一年多后，堪萨斯州、得克萨斯州和爱荷华州的农场依然能真切感受到由此导致的痛苦，这些州的竞选争夺也突然间激烈起来。\n\n他的团队的一些成员感到恼火，因为比起边境问题，特朗普似乎更多地在谈论他的新宴会厅；比起食品价格，他更关心高尔夫球场；比起通货膨胀，他更在意室内装饰。\n\n在中期选举前夕，他将最后的陈述重点放在他对国家广场倒影池的翻修上，并开玩笑说他正考虑用自己的名字取代亚伯拉罕·林肯的命名。\n\n与过去不同的是，民主党人很大程度上忽略了特朗普每天转移注意力的举动，而是试图将腐败与生活成本联系起来。他们还讲述了一个政府只关注精英、普通人却在苦苦挣扎的故事——这其中包括受保护的杰弗里·爱泼斯坦同伙，以及总统个人赚取的22亿美元。\n\n在众议院，民主党人迅速而意外地反击了特朗普的重划选区计划，并派遣强有力的候选人深入红色阵营以扩大版图。在参议院，他们找到了一批优质的候选人，让曾经不可撼动的州也变得充满悬念。在竞选最后那狂乱的几周里，共和党人不得不将资金从北卡罗来纳州和佐治亚州等传统的摇摆州转移出来，试图稳固南卡罗来纳州甚至密西西比州的传统基本盘。\n\n少数党领袖、如今已是候任议长的纽约州民主党众议员哈基姆·杰弗里斯表示，伊朗战争加剧了两党之间的对比。\n\n共和党人曾试图将中期选举定性为“常识与疯狂”之间的选择，并无情地攻击左翼中不断崛起的民主社会主义派。\n\n然而，特朗普自己的民调专家在选举前两周进行的最终调查显示，尽管MAGA共和党的品牌和民主社会主义者在选民中都不受欢迎，但MAGA背负了更多的包袱。当不打算投票的共和党人被问及需要什么才能赢回他们的选票时，他们排名前两位的回答是结束战争和解决通货膨胀。\n\n“MAGA公司”超级政治行动委员会发言人亚历克斯·法伊弗表示，该组织“对政治环境的清醒客观认识”促使他们将资金投入到了共和党在缅因州、佛罗里达州、田纳西州、纽约州和得克萨斯州处于领先的众议院竞选中。\n\n“那些兜售这些捏造的引语和虚假流言的人不仅贬低和轻视了总统为该党中期选举所作的历史性的、慷慨的投资，还诽谤了许多为这一努力做出贡献的人的辛勤工作，”他在一份声明中表示。“他们是懦夫和失败者。”\n\n一位拒绝具名的白宫官员在回应本文的报道时说：“特朗普总统不在选票上，而事实证明，当他在选票上时，他的选民就会出来投票。候选人的素质很重要，而特朗普总统在推介选票上的许多候选人方面做得比候选人自己还要出色。”\n\n事实证明，没有哪个候选人比丑闻缠身的得克萨斯州总检察长肯·帕克斯顿让共和党付出的代价更大。特朗普选择支持帕克斯顿而不是在任共和党参议员约翰·科宁，尽管一年来一直有人在警告，帕克斯顿会让这个席位陷入险境。共和党最终被迫在得州投入近3亿美元，这笔钱本可用于巩固其他州的候选人。帕克斯顿以12个百分点的差距落败。\n\n在最近的另一次通话中，特朗普团队嘲笑了他们试图助选的一些共和党人的倒霉相。\n\n“我看到了敌人，”布莱尔一周前对该团队说。“那正是我们自己。”\n\n法布里齐奥回答道：“在很多地方都是这样。”\n\n2025年5月，舒默来到位于纽约哈德逊河谷的高档度假村野花农场，与捐助者和党派官员进行了一次秘密闭门会议。他迫切需要扩大参议院的选举版图。\n\n为了夺取参议院控制权，民主党人需要保住他们现有的所有席位，并至少翻盘四个席位，其中包括特朗普在2024年轻松获胜的州。\n\n舒默花了数月时间争取北卡罗来纳州颇受欢迎的民主党前州长罗伊·库珀，并至少三次前往俄亥俄州，劝说前参议员谢罗德·布朗出山，布朗虽在2024年败选，但他的民粹主义风格恰好契合了当时全国的民情。\n\n“如果你退休了，而我们以一票之差失去多数席位，你将无法安享退休生活，”舒默回忆起他对73岁的布朗说的话。\n\n在众议院，民主党人在2024年以三席之差落败。这次招募人员前往特朗普曾以10个百分点或更大优势拿下的选区寻找候选人，他们早早押注这位气焰嚣张的总统将会越权行事。\n\n他们开始招募具有独特背景的候选人：退伍军人、医生、农民、空降消防员、特哈诺音乐明星——几乎涵盖了任何不具有典型职业政治人士特征的人。\n\n与此同时，特朗普正试图重绘众议院选区版图本身。\n\n2025年春，时任副幕僚长布莱尔向总统提交了一项在十年中期重新划定国会选区版图的计划，以确保共和党人的席位更加稳固。这场选区划分操纵行动始于得克萨斯州，很快蔓延至其他由共和党主导的州。\n\n从一开始，布莱尔对他的重划选区计划就非常自信，他和总统都无视了那些担心此举会适得其反的共和党人的担忧。\n\n但到了2026年4月，民主党人有充分理由相信，他们通过在几个蓝州重划选区已经化解了这一威胁。杰弗里斯举行了一场庆祝新闻发布会，展示了一张印有特朗普和布莱尔面孔的海报，上面还印着《纽约时报》一篇关于重划选区文章中的匿名引语：“随时随地进行最高级别的战争。”\n\n当布莱尔看到这张海报时，他给杰弗里斯的一位高级助手吉迪恩·布拉金发短信说：“你能把这海报复印一份送到我办公室吗？”\n\n他未能如愿，这张海报一直留在众议院民主党总部，直到选举日那天，一股蓝色的浪潮甚至席卷了许多原本被划定为有利于共和党的选区。\n\n2026年伊始，政府加强移民执法的行动在明尼阿波利斯演变成了暴力事件，两名抗议者被联邦特工开枪打死。这两起枪杀事件都被视频记录了下来。\n\n明尼阿波利斯事件发生后不久，民主党内部的民调显示，该党首次在移民问题上占据了优势。据总统的一位高级策略师表示，曾是特朗普长期优势之一的议题在一段时间内成了他最大的包袱。\n\n随后，在第二起枪击事件发生大约五周后，特朗普带领国家在伊朗卷入了战争。\n\n布莱尔起初认同他老板的乐观情绪，认为战争会迅速取得胜利。他向持怀疑态度的同事保证，冲突不会像某些人担心的那样成为一场政治灾难，因为一些国防部官员曾向白宫保证，冲突会迅速得到解决。", "body": "选举前六天，唐纳德·特朗普总统的二十多名高级策略师连入了一场私密的视频通话。\n\n“你们是想先吃白药丸，还是黑药丸？”总统的首席民调专家托尼·法布里齐奥问道。\n\n共和党顶级数据顾问之一蒂姆·萨勒给出了两种可能情形。第一个是拥有4亿美元经费的超级政治行动委员会“MAGA公司”(MAGA Inc.)有效动员了他们想动员且预计会投票的选民。“这是乐观的设想，”他说。\n\n据参与通话的四人透露，离开白宫转而负责监督总统的中期选举策略的詹姆斯·布莱尔在笑声中说：“我正在安排后事。我建议大家也早做准备。”\n\n在大约30分钟的时间里，通话内容充斥着黑色幽默：葬礼安排、监狱伙食、总统赦免，甚至还一度聊到流亡海外。\n\n“至少比比赢了。他会保护我们的，”在提及以色列总理本雅明·内塔尼亚胡时，布莱尔讽刺地说道，内塔尼亚胡的国家在前一天举行了投票。（内塔尼亚胡的阵营未能获得多数席位，其党派随后声称选举存在舞弊。）\n\n“也许我们能在以色列获得庇护，”法布里齐奥说。\n\n民主党人以压倒性优势夺得众议院多数席位，并赢得了参议院的控制权。这是一场了不起的胜利，得益于民主党人在堪萨斯州、南卡罗来纳州和得克萨斯州等共和党重镇的胜利。一年前几乎无人能够预料到这样的结果。\n\n本文记述的共和党崩溃基于对70多人的采访，受访者包括直接参与中期选举的议员、政治策略师、党派领袖、民调专家、白宫官员和国会助手。其中许多人获准匿名发言，以便披露不为外界所知的谈话内容和决策过程。\n\n共和党人拥有创纪录的筹款规模、世界首富的支持、最高法院一项有利于竞选资金的裁决，并且面对着一个士气低落且不受欢迎的反对党。\n\n在参议院，目前的竞选版图使得民主党人不得不在几十年未曾赢过的州展开竞争。\n\n而在众议院，特朗普团队打破了每十年重划一次国会选区的传统，试图通过划定新选区来帮助共和党巩固其微弱的多数席位。\n\n共和党人无法克服的难关在于，总统在经济及其他诸多问题上失去了公众信任。他们未曾料到的是，一场在中东发生的不受欢迎的战争——这场战争导致霍尔木兹海峡关闭，并将汽油价格推高至每加仑4美元以上——会一路蔓延，贯穿整个选举。\n\n而这一次，民主党人做好了准备，抓住了共和党人的失误。\n\n布莱尔今夏分发给白宫西翼官员的演示文稿展现出了严峻的形势。\n\n其中一张幻灯片将共和党的民调数据与伊朗战争的时间表联系在了一起。\n\n它展示了民主党的优势如何在激烈的敌对行动期间扩大，在“谅解备忘录”谈判期间缩小，随后在停火破裂时再度飙升。\n\n截至7月底，民主党人在国会选票上已经占据了10个百分点的优势。\n\n最终的“结论”显而易见。内容用荧光黄标出：如果民主党人只有4个百分点的优势，共和党人仍然有可能赢得众议院。“但这必须在停火延长、霍尔木兹海峡开放且汽油价格下降的情况下才会发生，”幻灯片警告称。\n\n“接近D+10的最终结果可能会让我们失去参议院。”\n\n周二的实际结果甚至更糟：根据《纽约时报》估计，特朗普的共和党在全国国会选举总票数上预计将以约13个百分点的劣势落败。这将是自​​水门事件之后，半个世纪以来最惨重的败局。\n\n甚至在投票站关闭之前，特朗普就已经开始反复回想原本可能发生的情况。\n\n“如果我们当初没有卷入伊朗，你认为中期选举会发生什么？”据一位与总统交谈过的人士透露，总统曾私下这样问道。\n\n这场战争之所以成为如此巨大的影响因素，是因为它向选民讲述了一个简单的故事。\n\n作为候选人，特朗普曾承诺不发动新战争，但他发动了一场新战争。\n\n他承诺降低物价，但汽油价格飙升，通货膨胀加剧。\n\n共和党中期选举崩盘的故事不仅是一个打破承诺的故事，也是一个激进越权的故事。在特朗普从2021年1月6日之后的政治弃儿状态中回归后，一些顾问认为他已经开始相信，政治规则唯独对他不再适用。那种错觉在周二晚上被彻底粉碎了。\n\n近两年里，傲慢已经成为特朗普第二任期的治理哲学。\n\n层出不穷的调查报道揭露，特朗普、他的家人及其亲密伙伴利用总统职位明目张胆地为自己敛财。这些报道开始引起选民的共鸣；福克斯新闻10月初的一项民调显示，腐败是选民最关心的问题。（白宫发言人安娜·凯利表示：“总统行事只考虑美国人民的最大利益。不存在利益冲突。”）\n\n2025年，特朗普对全世界发动了一场贸易战——一年多后，堪萨斯州、得克萨斯州和爱荷华州的农场依然能真切感受到由此导致的痛苦，这些州的竞选争夺也突然间激烈起来。\n\n他的团队的一些成员感到恼火，因为比起边境问题，特朗普似乎更多地在谈论他的新宴会厅；比起食品价格，他更关心高尔夫球场；比起通货膨胀，他更在意室内装饰。\n\n在中期选举前夕，他将最后的陈述重点放在他对国家广场倒影池的翻修上，并开玩笑说他正考虑用自己的名字取代亚伯拉罕·林肯的命名。\n\n与过去不同的是，民主党人很大程度上忽略了特朗普每天转移注意力的举动，而是试图将腐败与生活成本联系起来。他们还讲述了一个政府只关注精英、普通人却在苦苦挣扎的故事——这其中包括受保护的杰弗里·爱泼斯坦同伙，以及总统个人赚取的22亿美元。\n\n在众议院，民主党人迅速而意外地反击了特朗普的重划选区计划，并派遣强有力的候选人深入红色阵营以扩大版图。在参议院，他们找到了一批优质的候选人，让曾经不可撼动的州也变得充满悬念。在竞选最后那狂乱的几周里，共和党人不得不将资金从北卡罗来纳州和佐治亚州等传统的摇摆州转移出来，试图稳固南卡罗来纳州甚至密西西比州的传统基本盘。\n\n少数党领袖、如今已是候任议长的纽约州民主党众议员哈基姆·杰弗里斯表示，伊朗战争加剧了两党之间的对比。\n\n共和党人曾试图将中期选举定性为“常识与疯狂”之间的选择，并无情地攻击左翼中不断崛起的民主社会主义派。\n\n然而，特朗普自己的民调专家在选举前两周进行的最终调查显示，尽管MAGA共和党的品牌和民主社会主义者在选民中都不受欢迎，但MAGA背负了更多的包袱。当不打算投票的共和党人被问及需要什么才能赢回他们的选票时，他们排名前两位的回答是结束战争和解决通货膨胀。\n\n“MAGA公司”超级政治行动委员会发言人亚历克斯·法伊弗表示，该组织“对政治环境的清醒客观认识”促使他们将资金投入到了共和党在缅因州、佛罗里达州、田纳西州、纽约州和得克萨斯州处于领先的众议院竞选中。\n\n“那些兜售这些捏造的引语和虚假流言的人不仅贬低和轻视了总统为该党中期选举所作的历史性的、慷慨的投资，还诽谤了许多为这一努力做出贡献的人的辛勤工作，”他在一份声明中表示。“他们是懦夫和失败者。”\n\n一位拒绝具名的白宫官员在回应本文的报道时说：“特朗普总统不在选票上，而事实证明，当他在选票上时，他的选民就会出来投票。候选人的素质很重要，而特朗普总统在推介选票上的许多候选人方面做得比候选人自己还要出色。”\n\n事实证明，没有哪个候选人比丑闻缠身的得克萨斯州总检察长肯·帕克斯顿让共和党付出的代价更大。特朗普选择支持帕克斯顿而不是在任共和党参议员约翰·科宁，尽管一年来一直有人在警告，帕克斯顿会让这个席位陷入险境。共和党最终被迫在得州投入近3亿美元，这笔钱本可用于巩固其他州的候选人。帕克斯顿以12个百分点的差距落败。\n\n在最近的另一次通话中，特朗普团队嘲笑了他们试图助选的一些共和党人的倒霉相。\n\n“我看到了敌人，”布莱尔一周前对该团队说。“那正是我们自己。”\n\n法布里齐奥回答道：“在很多地方都是这样。”\n\n2025年5月，舒默来到位于纽约哈德逊河谷的高档度假村野花农场，与捐助者和党派官员进行了一次秘密闭门会议。他迫切需要扩大参议院的选举版图。\n\n为了夺取参议院控制权，民主党人需要保住他们现有的所有席位，并至少翻盘四个席位，其中包括特朗普在2024年轻松获胜的州。\n\n舒默花了数月时间争取北卡罗来纳州颇受欢迎的民主党前州长罗伊·库珀，并至少三次前往俄亥俄州，劝说前参议员谢罗德·布朗出山，布朗虽在2024年败选，但他的民粹主义风格恰好契合了当时全国的民情。\n\n“如果你退休了，而我们以一票之差失去多数席位，你将无法安享退休生活，”舒默回忆起他对73岁的布朗说的话。\n\n在众议院，民主党人在2024年以三席之差落败。这次招募人员前往特朗普曾以10个百分点或更大优势拿下的选区寻找候选人，他们早早押注这位气焰嚣张的总统将会越权行事。\n\n他们开始招募具有独特背景的候选人：退伍军人、医生、农民、空降消防员、特哈诺音乐明星——几乎涵盖了任何不具有典型职业政治人士特征的人。\n\n与此同时，特朗普正试图重绘众议院选区版图本身。\n\n2025年春，时任副幕僚长布莱尔向总统提交了一项在十年中期重新划定国会选区版图的计划，以确保共和党人的席位更加稳固。这场选区划分操纵行动始于得克萨斯州，很快蔓延至其他由共和党主导的州。\n\n从一开始，布莱尔对他的重划选区计划就非常自信，他和总统都无视了那些担心此举会适得其反的共和党人的担忧。\n\n但到了2026年4月，民主党人有充分理由相信，他们通过在几个蓝州重划选区已经化解了这一威胁。杰弗里斯举行了一场庆祝新闻发布会，展示了一张印有特朗普和布莱尔面孔的海报，上面还印着《纽约时报》一篇关于重划选区文章中的匿名引语：“随时随地进行最高级别的战争。”\n\n当布莱尔看到这张海报时，他给杰弗里斯的一位高级助手吉迪恩·布拉金发短信说：“你能把这海报复印一份送到我办公室吗？”\n\n他未能如愿，这张海报一直留在众议院民主党总部，直到选举日那天，一股蓝色的浪潮甚至席卷了许多原本被划定为有利于共和党的选区。\n\n2026年伊始，政府加强移民执法的行动在明尼阿波利斯演变成了暴力事件，两名抗议者被联邦特工开枪打死。这两起枪杀事件都被视频记录了下来。\n\n明尼阿波利斯事件发生后不久，民主党内部的民调显示，该党首次在移民问题上占据了优势。据总统的一位高级策略师表示，曾是特朗普长期优势之一的议题在一段时间内成了他最大的包袱。\n\n随后，在第二起枪击事件发生大约五周后，特朗普带领国家在伊朗卷入了战争。\n\n布莱尔起初认同他老板的乐观情绪，认为战争会迅速取得胜利。他向持怀疑态度的同事保证，冲突不会像某些人担心的那样成为一场政治灾难，因为一些国防部官员曾向白宫保证，冲突会迅速得到解决。", "link": "https://cn.nytimes.com/usa/20261106/trump-midterms-losses-republicans/?utm_source=RSS", "time": "11月06日 03:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}]}, {"key": "bbc_cn", "name": "英国广播公司中文", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "黄仁勋与疑似中国间谍婚外情：目前我们知道什么？", "title_zh": "黄仁勋与疑似中国间谍婚外情：目前我们知道什么？", "summary_orig": "这名科技业亿万富豪高层陷入一场涉及私人生活与国家安全的丑闻。", "summary_zh": "这名科技业亿万富豪高层陷入一场涉及私人生活与国家安全的丑闻。", "body_orig": "", "body_zh": "人工智能（AI）产业其中一位最重要的人物，被指与一名疑似中国间谍的女子发生婚外情，事件引发调查。\n\n据《纽约时报》报道，美国情报官员认为，与英伟达（Nvidia，辉达）行政总裁兼联合创办人黄仁勋（Jensen Huang）关系密切的中国商界女子黄乐（Alice Huang，拼音姓名Huang Le），是为北京从事间谍活动的人员。\n\n全球市值最高的企业之一、美国科技巨头英伟达，已就相关报道展开独立调查。公司表示，不认为美国国家安全受到损害，并补充说，黄仁勋致力继续领导公司。\n\n《纽约时报》报道，美国官员认为，黄乐已被中国最高情报机构招募从事间谍活动。目前不清楚她身在何处。\n\n黄乐与黄仁勋没有亲属关系。她曾于2023年3月至11月担任总部位于新加坡的数据中心公司Megaspeed高级管理人员。该公司曾被怀疑协助将英伟达晶片转运至中国，但英伟达坚称，相关疑虑经调查后已被证实并无根据。\n\n不过，BBC了解到，新加坡政府正就Megaspeed过去涉嫌规避美国对英伟达高端晶片出口制裁的指控，对该公司展开调查。BBC已联络Megaspeed寻求回应。\n\n该公司上月向《纽约时报》表示，现任管理层严肃看待相关指控，并已委任外部法律顾问进行内部调查。\n\n据报，情报监控行动发现黄乐与一名美国公民有通讯往来。其后，当局透过一项称为「揭露身份」的程序，确认该名美国公民是黄仁勋。\n\n目前仍不清楚黄乐究竟有否收集情报并交予北京，以及如果有的话，涉及哪些情报。她没有回应《纽约时报》的置评请求。\n\n英伟达发言人向BBC表示：「我们相信，如果我们真的成为威胁目标，美国政府会通知我们。」\n\n中国外交部发言人郭嘉昆周一在例行记者会上表示：「我们此前已就此作出回应。所谓『中国间谍』的论调纯属捕风捉影，污蔑抺黑。」\n\n《纽约时报》10月底报道，特朗普去年曾听取情报简报，内容涉及黄乐涉嫌为中国从事间谍活动。」\n\n周日有记者问特朗普，是否后悔当时没有「根据情报采取行动」，他回答说：「不，我不这么认为。我认为他是一个正直的人。」\n\n与此同时，美国国务卿鲁比奥（Marco Rubio）被问及黄仁勋时拒绝置评。据《纽约时报》报道，鲁比奥今年春季曾监督草拟一份备忘录，警告特朗普政府注意黄仁勋与该名中国商界女子的关系。\n\n英伟达处于美中人工智能竞争的核心位置，因此，这名亿万富豪的婚外情引发美国国会议员对国家安全的忧虑。\n\n特朗普曾说过，「谁赢得人工智能竞赛，谁就赢得一切」。美国方面担心，如果中国在人工智能领域取得优势，将大幅提升中国的军事和监控能力。\n\n美国的优势很大程度上来自英伟达等美国企业，以及它们与台湾积体电路制造公司（台积电，TSMC）等生产商的合作。台积电制造全球超过九成最先进的晶片。\n\n自2022年以来，美国实施了多项出口管制措施，阻止最尖端技术流入中国。美国政府表示，这有助维持美国的竞争优势，并保障国家安全。\n\n这意味著英伟达等企业基本上被排除在全球利润最丰厚的市场之外。黄仁勋曾表示，英伟达在中国市场的占有率，已从约95%跌至几乎零。\n\n黄仁勋一直穿梭华盛顿和北京之间，展开外交斡旋，希望找到获美国政府批准、重返中国市场的途径。在此过程中，他也一直影响美国对中国的政策。\n\n周日披露的消息，或许可以解释为何黄仁勋至今仍未能替英伟达争取到最重要的成果：获得特朗普政府批准，向中国出售除最先进型号以外的所有晶片。\n\n黄仁勋1963年出生于台湾，九岁时随家人移居美国西岸。他在俄勒冈州立大学取得电机工程学位，之后在史丹福大学取得同一领域的硕士学位。\n\n黄仁勋其后在美国晶片公司超微半导体（AMD）工作，再与他人共同创办英伟达。在台湾，他被称为「黄爸爸」，也曾被誉为「科技界的泰勒丝（Taylor Swift）」。他以工作狂和完美主义者著称，对员工要求极高。\n\n黄仁勋传记《黄仁勋传：辉达创办人如何打造全球最抢手的晶片》（The Thinking Machine）作者史帝芬·维特（Stephen Witt）向BBC表示：「黄仁勋是一位堪比史蒂夫·乔布斯（Steve Jobs）的科技远见者。」他补充说，黄仁勋塑造了我们今天所认识的人工智能硬件。\n\n黄仁勋与特朗普的关系出了名密切。在白宫最近举行的一场人工智能峰会上，共有42名科技企业高层出席，特朗普身旁分别坐著马斯克（Elon Musk）和黄仁勋。\n\n特朗普向记者表示：「我只知道他是个很好的人，但你永远不知道背后发生了什么事。」他又说，黄仁勋「为我们国家作出了惊人的贡献」。\n\n英伟达于1993年由黄仁勋与另外两名电机工程师克里斯·马拉科夫斯基（Chris Malachowsky）及柯蒂斯·普里姆（Curtis Priem）共同创办。公司最初以图像处理晶片闻名，尤其是用于电脑游戏的晶片。\n\n黄仁勋曾不止一次将英伟达从破产边缘拯救回来。他早在世界其他企业投入人工智能之前，便已大胆押注这项技术，几乎从零开始建立相关基础设施。\n\n维特向BBC表示：「今天我们谈到这些基础设施，会想到那些巨型数据中心，但当时根本没有这些东西。当时，他正在开发的产品没有任何客户。事实上，他的第一个客户是当时只有30名员工的OpenAI。他甚至是把产品免费送给他们的。」\n\n如今，几乎所有开发人工智能工具和基础设施的主要科技企业，包括亚马逊、Meta、Google和微软，都使用英伟达晶片。\n\n目前看来，英伟达董事会似乎没有太大意愿撤换黄仁勋。董事会周日发表声明，表示对「黄仁勋及其领导团队有信心」。\n\n现年63岁的黄仁勋，没有公开的接班计划。他曾多次表示，希望未来数十年继续担任现职。彭博社报道，他在自己周围建立了一套非正式的领导架构，与传统企业的管理层级制度不同。\n\n他的子女黄胜斌和黄敏珊，以及女婿尼科·卡普雷（Nico Caprez），都在英伟达担任高级职位。\n\n黄仁勋于1980年代初在俄勒冈州立大学修读电机工程期间，认识了日后成为他妻子的洛莉·米尔斯（Lori Mills）。两人当时是实验课的搭档。\n\n他们于1985年结婚，当时距离黄仁勋共同创办英伟达还有约八年。两人育有一子一女，分别是黄胜斌和黄敏珊。\n\n2007年，夫妇二人成立了「黄仁勋与洛莉基金会」（Jen-Hsun and Lori Huang Foundation）。随着英伟达股价飙升，该慈善基金的资产近年急剧增加，估计价值超过90亿美元。\n\n维特向BBC表示，黄仁勋一直花费大量心力，塑造自己重视家庭的形象，并补充说：「这对他非常重要。」\n\n「这件事的后果对任何家庭来说都不好。但对于一个如此努力塑造顾家男人形象、又与子女保持非常密切关系的人来说，情况尤其糟糕。」\n\nBBC伦敦记者汤姆·麦克阿瑟（Tom McArthur）、新加坡记者阿伊莎·佩雷拉（Ayeshea Perera）及黄晓恩（Tessa Wong），以及悉尼记者海伦·戴维森（Helen Davidson）补充报道。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "人工智能（AI）产业其中一位最重要的人物，被指与一名疑似中国间谍的女子发生婚外情，事件引发调查。\n\n据《纽约时报》报道，美国情报官员认为，与英伟达（Nvidia，辉达）行政总裁兼联合创办人黄仁勋（Jensen Huang）关系密切的中国商界女子黄乐（Alice Huang，拼音姓名Huang Le），是为北京从事间谍活动的人员。\n\n全球市值最高的企业之一、美国科技巨头英伟达，已就相关报道展开独立调查。公司表示，不认为美国国家安全受到损害，并补充说，黄仁勋致力继续领导公司。\n\n《纽约时报》报道，美国官员认为，黄乐已被中国最高情报机构招募从事间谍活动。目前不清楚她身在何处。\n\n黄乐与黄仁勋没有亲属关系。她曾于2023年3月至11月担任总部位于新加坡的数据中心公司Megaspeed高级管理人员。该公司曾被怀疑协助将英伟达晶片转运至中国，但英伟达坚称，相关疑虑经调查后已被证实并无根据。\n\n不过，BBC了解到，新加坡政府正就Megaspeed过去涉嫌规避美国对英伟达高端晶片出口制裁的指控，对该公司展开调查。BBC已联络Megaspeed寻求回应。\n\n该公司上月向《纽约时报》表示，现任管理层严肃看待相关指控，并已委任外部法律顾问进行内部调查。\n\n据报，情报监控行动发现黄乐与一名美国公民有通讯往来。其后，当局透过一项称为「揭露身份」的程序，确认该名美国公民是黄仁勋。\n\n目前仍不清楚黄乐究竟有否收集情报并交予北京，以及如果有的话，涉及哪些情报。她没有回应《纽约时报》的置评请求。\n\n英伟达发言人向BBC表示：「我们相信，如果我们真的成为威胁目标，美国政府会通知我们。」\n\n中国外交部发言人郭嘉昆周一在例行记者会上表示：「我们此前已就此作出回应。所谓『中国间谍』的论调纯属捕风捉影，污蔑抺黑。」\n\n《纽约时报》10月底报道，特朗普去年曾听取情报简报，内容涉及黄乐涉嫌为中国从事间谍活动。」\n\n周日有记者问特朗普，是否后悔当时没有「根据情报采取行动」，他回答说：「不，我不这么认为。我认为他是一个正直的人。」\n\n与此同时，美国国务卿鲁比奥（Marco Rubio）被问及黄仁勋时拒绝置评。据《纽约时报》报道，鲁比奥今年春季曾监督草拟一份备忘录，警告特朗普政府注意黄仁勋与该名中国商界女子的关系。\n\n英伟达处于美中人工智能竞争的核心位置，因此，这名亿万富豪的婚外情引发美国国会议员对国家安全的忧虑。\n\n特朗普曾说过，「谁赢得人工智能竞赛，谁就赢得一切」。美国方面担心，如果中国在人工智能领域取得优势，将大幅提升中国的军事和监控能力。\n\n美国的优势很大程度上来自英伟达等美国企业，以及它们与台湾积体电路制造公司（台积电，TSMC）等生产商的合作。台积电制造全球超过九成最先进的晶片。\n\n自2022年以来，美国实施了多项出口管制措施，阻止最尖端技术流入中国。美国政府表示，这有助维持美国的竞争优势，并保障国家安全。\n\n这意味著英伟达等企业基本上被排除在全球利润最丰厚的市场之外。黄仁勋曾表示，英伟达在中国市场的占有率，已从约95%跌至几乎零。\n\n黄仁勋一直穿梭华盛顿和北京之间，展开外交斡旋，希望找到获美国政府批准、重返中国市场的途径。在此过程中，他也一直影响美国对中国的政策。\n\n周日披露的消息，或许可以解释为何黄仁勋至今仍未能替英伟达争取到最重要的成果：获得特朗普政府批准，向中国出售除最先进型号以外的所有晶片。\n\n黄仁勋1963年出生于台湾，九岁时随家人移居美国西岸。他在俄勒冈州立大学取得电机工程学位，之后在史丹福大学取得同一领域的硕士学位。\n\n黄仁勋其后在美国晶片公司超微半导体（AMD）工作，再与他人共同创办英伟达。在台湾，他被称为「黄爸爸」，也曾被誉为「科技界的泰勒丝（Taylor Swift）」。他以工作狂和完美主义者著称，对员工要求极高。\n\n黄仁勋传记《黄仁勋传：辉达创办人如何打造全球最抢手的晶片》（The Thinking Machine）作者史帝芬·维特（Stephen Witt）向BBC表示：「黄仁勋是一位堪比史蒂夫·乔布斯（Steve Jobs）的科技远见者。」他补充说，黄仁勋塑造了我们今天所认识的人工智能硬件。\n\n黄仁勋与特朗普的关系出了名密切。在白宫最近举行的一场人工智能峰会上，共有42名科技企业高层出席，特朗普身旁分别坐著马斯克（Elon Musk）和黄仁勋。\n\n特朗普向记者表示：「我只知道他是个很好的人，但你永远不知道背后发生了什么事。」他又说，黄仁勋「为我们国家作出了惊人的贡献」。\n\n英伟达于1993年由黄仁勋与另外两名电机工程师克里斯·马拉科夫斯基（Chris Malachowsky）及柯蒂斯·普里姆（Curtis Priem）共同创办。公司最初以图像处理晶片闻名，尤其是用于电脑游戏的晶片。\n\n黄仁勋曾不止一次将英伟达从破产边缘拯救回来。他早在世界其他企业投入人工智能之前，便已大胆押注这项技术，几乎从零开始建立相关基础设施。\n\n维特向BBC表示：「今天我们谈到这些基础设施，会想到那些巨型数据中心，但当时根本没有这些东西。当时，他正在开发的产品没有任何客户。事实上，他的第一个客户是当时只有30名员工的OpenAI。他甚至是把产品免费送给他们的。」\n\n如今，几乎所有开发人工智能工具和基础设施的主要科技企业，包括亚马逊、Meta、Google和微软，都使用英伟达晶片。\n\n目前看来，英伟达董事会似乎没有太大意愿撤换黄仁勋。董事会周日发表声明，表示对「黄仁勋及其领导团队有信心」。\n\n现年63岁的黄仁勋，没有公开的接班计划。他曾多次表示，希望未来数十年继续担任现职。彭博社报道，他在自己周围建立了一套非正式的领导架构，与传统企业的管理层级制度不同。\n\n他的子女黄胜斌和黄敏珊，以及女婿尼科·卡普雷（Nico Caprez），都在英伟达担任高级职位。\n\n黄仁勋于1980年代初在俄勒冈州立大学修读电机工程期间，认识了日后成为他妻子的洛莉·米尔斯（Lori Mills）。两人当时是实验课的搭档。\n\n他们于1985年结婚，当时距离黄仁勋共同创办英伟达还有约八年。两人育有一子一女，分别是黄胜斌和黄敏珊。\n\n2007年，夫妇二人成立了「黄仁勋与洛莉基金会」（Jen-Hsun and Lori Huang Foundation）。随着英伟达股价飙升，该慈善基金的资产近年急剧增加，估计价值超过90亿美元。\n\n维特向BBC表示，黄仁勋一直花费大量心力，塑造自己重视家庭的形象，并补充说：「这对他非常重要。」\n\n「这件事的后果对任何家庭来说都不好。但对于一个如此努力塑造顾家男人形象、又与子女保持非常密切关系的人来说，情况尤其糟糕。」\n\nBBC伦敦记者汤姆·麦克阿瑟（Tom McArthur）、新加坡记者阿伊莎·佩雷拉（Ayeshea Perera）及黄晓恩（Tessa Wong），以及悉尼记者海伦·戴维森（Helen Davidson）补充报道。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/cw8dzd17n70no/trad?at_medium=RSS&at_campaign=rss", "time": "11月10日 01:25", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "黄仁勋婚外情掀起国安风暴：拆解五大看点", "title_zh": "黄仁勋婚外情掀起国安风暴：拆解五大看点", "summary_orig": "辉达（英伟达）总裁黄仁勋承认婚外情并向公众致歉，为何引发国安及舆论风暴？新加坡的角色又是如何？会影响台湾的产业链吗？中国为何严厉否认相关指控。", "summary_zh": "辉达（英伟达）总裁黄仁勋承认婚外情并向公众致歉，为何引发国安及舆论风暴？新加坡的角色又是如何？会影响台湾的产业链吗？中国为何严厉否认相关指控。", "body_orig": "", "body_zh": "本周日（11月8日），全球市值最高的公司之一辉达（Nvidia，英伟达）执行长黄仁勋（Jensen Huang）公开承认对妻子不忠，并向员工、董事会与股东致歉。\n\n这起私人丑闻之所以迅速升级为国际新闻头条，关键不在婚外情本身，而在于外遇对象的身分。据报，美国情报机构认定黄乐（Alice Huang）是中国国家安全部（MSS）招募的情报人员，她曾任新加坡数据中心公司Megaspeed的高管。\n\n《纽约时报》10月底率先披露美方的监控细节，《金融时报》上周末进一步指出，一份呈交政府高层的备忘录以「浪漫关系」（romantic relationship）形容两人的往来。随后，辉达董事会宣布启动独立调查，美国国会多个委员会要求黄仁勋出席闭门简报。\n\n美国总统特朗普（Donald Trump，川普）周日回应记者提问时表示，自己「没听过黄仁勋做了什么错事」，称他是「好人」「有荣誉感的人」，此事黄仁勋「大概有他的理由」，并表示愿意带他一起出访亚洲。然而，刚凭加强监管人工智能（AI）产业的诉求在期中选举大胜、拿下参众两院多数席位的民主党，可能对该事件进行质询。\n\n从国安风险、北京回应、新加坡的角色，再到台湾产业界，BBC中文整理此事的五大看点。\n\n根据报导，黄仁勋在给辉达员工的内部信中坦承：「我对妻子不忠。我的行为伤害了她和我们的孩子。没有任何借口。我深感抱歉。」他同时表示会全力配合董事会调查，并承诺继续领导辉达，不会中断。\n\n综合《纽约时报》与《金融时报》的调查报导，美国情报界根据长达约一年的电子监控，认定黄乐向北京传递情报。监控过程中，调查人员发现她与一名美国公民频繁联系，经「揭示身分」（unmasking）程序确认，该名公民正是黄仁勋。BBC目前尚无法独立核实相关指控。\n\n据报导，黄乐是中国公民，与黄仁勋并无亲属关系，曾与新加坡Megaspeed有关联。该公司是辉达在东南亚的重要云端客户，据报近两年进口了价值数十亿美元的辉达设备。美方相信黄乐受中国国家安全部招募，任务包括搜集AI晶片情报，并可能试图影响黄仁勋游说白宫，放宽对中国出口先进晶片的限制。\n\n两人曾多次在台湾同框，包括2024年6月现身台北一家酒吧、2025年在台北的餐厅聚会，当时已引起台湾媒体注意。丑闻正式曝光后，两人当年在台亲暱互动的影片与照片在台湾媒体及社交平台大量流传。这与台湾媒体过往对黄仁勋夫妇「鹣鲽情深」的报导形成强烈对比：黄仁勋的妻子与他自求学时期相恋，陪他度过数十年的创业难关。\n\n事件之所以触及美国国家安全的核心，是因为黄仁勋不仅执掌全球AI晶片龙头，也是特朗普在AI议题上的重要顾问。若情报真的透过私人关系外流，可能影响出口管制决策、特朗普对中国政策的判断，甚至晶片供应链的完整性。\n\n华盛顿并非近日才察觉此事。《金融时报》引述知情人士称，今年稍早一份备忘录已明确写下两人存在「浪漫关系」，据报由国务卿鲁比奥（Marco Rubio）监督起草，并在特朗普5月访问北京之前分发给政府高层。备忘录内容基于对黄乐的监控，警告黄仁勋与一名疑似中国间谍关系密切，可能涉及晶片情报与政策影响。\n\n近日，美国联邦众议院多个委员会已采取实质行动。相关国安与科技委员会主席要求黄仁勋出席闭门简报，强调国会必须彻底厘清，美国国家安全与关键技术究竟暴露于多大程度的风险之中。\n\n辉达董事会也宣布启动独立调查，由独立董事组成的委员会监督，并有外部独立律师协助审查所有资讯。董事会在声明中表示，目前「没有理由相信国家安全或辉达机密已遭妥协」，但仍会全面检视。\n\n一位不愿具名的台湾半导体业者，曾担任总经理级别的管理职务，向BBC中文表示，此事2024年已见诸台湾媒体，业界早有耳闻，「以黄仁勋的名气，很难在媒体与公众视野中隐身」。他认为，黄乐的主要任务并非窃取辉达机密，而是利用与黄仁勋的关系，促请他施加影响力，放宽辉达晶片对中国的出口。\n\n这位业者认为，黄仁勋的道德瑕疵对辉达影响甚大。黄仁勋过去在公司重大决策上几乎一人定夺，管理层级扁平，决策直接、效率极高，绩效亮眼。但在此次事件后，他的领导信用受损，恐怕难再像以往一言九鼎，公司内部的推动力可能下降。\n\n此文包含Instagram提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Instagram曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国外交部10月30日首次回应《纽约时报》的报导。发言人郭嘉昆称，报导「基于毫无根据的猜测」，目的是抹黑中国。\n\n11月9日，黄仁勋公开承认婚外情、辉达宣布展开调查后，郭嘉昆在例行记者会上再被问及此事。他说：「我们此前已就此作出回应，所谓中国间谍的论调纯属捕风捉影，污蔑抹黑。」\n\n当天有记者追问，这是否意味著中方否认该女子为中国情报机构工作。郭嘉昆没有正面回答，只是重复了上述说法。法新社记者还问及事件会否影响下周中美两国元首在深圳的APEC会晤，但未获进一步回应。\n\n中国媒体《环球时报》则在网站发表评论，称《纽约时报》的报导属「捕风捉影」。评论形容，富商、出轨、中国女间谍的组合「让美国媒体为之疯狂」，并质疑这则消息为何出现在「当下中美出现来之不易的缓和势头」之际，追问是否有有人在「推动议程、搅动对立」。\n\n评论还警告，如果任由「有罪推定」的逻辑蔓延，中美两国以及全球供应链都将受到拖累，并敦促一些美国媒体坚守基本的新闻准则，称炒作「中国间谍」叙事只会损害自身公信力。\n\n自2022年美国限制高阶AI晶片出口中国后，东南亚成为主要规避路径。除彭博社报导的Megaspeed案外，相关案件层出不穷：新加坡警方2026年查扣一栋约4200万美元的豪宅，涉嫌与走私辉达晶片所得有关；马来西亚海关多次在吉隆坡机场查获价值逾千万美元的AI伺服器，并指同一集团至少涉及五起案件；美国起诉美超微（Super Micro）相关案件，指控业者经马来西亚、新加坡、泰国转运数亿至数十亿美元受管制晶片；台湾亦起诉了经印尼等地转运的案件。\n\n专家与外媒指出，贸易数据显示马来西亚与中国的伺服器进出口数字严重不符，非政府组织C4ADS等机构的报告记录了多批经越南、马来西亚转运的辉达GPU。但也有专家警告，加强执法成本高昂，并可能迫使东南亚国家选边站。\n\n新加坡国立大学政治学系副教授庄嘉颖向BBC中文解释，新加坡长期以国际经贸、财经与服务枢纽的定位推动经济，只要不触犯本地法律或损害在地利益，官方通常不会特别介入，这种中立态度让新加坡获益良多。「但这种模式的前提是，主要贸易伙伴允许、甚至鼓励经由新加坡进行合作。在大国角力加剧之下，担任中间人或买办角色的风险正在上升。」\n\n「这已非单纯的『选边』问题，因为选择空间正在缩小。」他表示，「新加坡及其他惯于担任中间人的经济体，若仍想左右逢源，将面临更多阻力，甚至可能变成各方都不讨好。」\n\n庄嘉颖强调，虽然许多国家不愿在美中之间做取舍，但最终可能由不得自己。因为，历史显示，多极或多强并立的格局，往往会压缩中小国家的活动空间与自主性，譬如二战后被牺牲的波兰或捷克。\n\n不过，新加坡内政部（MHA）明确澄清，政府与官员从未对黄乐个人与中国情报或与黄仁勋关系展开调查，也未表达相关担忧；相关调查仅针对Megaspeed公司本身，且仍在进行中。\n\n事实上，黄仁勋与新加坡业务关系紧密，其亚太媒体联系团队主理为新加坡人士，在台北参与科技大展时，唯一专访也给了新加坡媒体新加坡亚洲新闻台（CNA）。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n民主党方面早已对黄仁勋游说放宽对中出口持批评态度。重量级的民主党参议员华伦（Elizabeth Warren）等人多次要求黄仁勋到国会说明，并推动将更严格的AI晶片出口管制、位置验证与国会审查机制纳入国防授权法案。\n\n此次间谍疑云正好给刚拿下参众两院，势头正旺的民主党更多弹药，即使特朗普政府过去在黄仁勋影响下有条件放行部分H200等晶片，民主党据信势必更严格审查辉达的中国业务与供应链合规。\n\n对台湾而言，短期可能带来双重影响。一方面，若美国进一步收紧对华出口，辉达对先进制程的需求会更集中在台积电（TSMC），台湾作为全球最先进AI晶片制造中心，订单与战略地位可能更稳固。\n\n另一方面，台湾本身也在加强对华出口管制，包括考虑将AI加速器纳入更严格管制，并加重走私刑罚，以配合美国并堵住从台湾转运的漏洞。这可能增加伺服器组装厂的合规成本，并影响部分中国客户订单。\n\n上述不愿具名的台湾科技业者向BBC中文说，对台湾而言，会受到一点影响，但出货限制程度应仍可控。辉达若受挫，台湾业者仍可转向其他供应商（如AMD）取得所需晶片。\n\n受访者又告诉BBC，美国现行出口管制法令已相当完整，未来只会更严格，许多设备本来就禁止输往中国。他说，黄仁勋好不容易说服特朗普同意出售H200，但中国不给面子。中国真正目标是国产自制高阶AI晶片（如华为），因此此事对中国影响有限，对辉达公司内部冲击反而较大。", "body": "本周日（11月8日），全球市值最高的公司之一辉达（Nvidia，英伟达）执行长黄仁勋（Jensen Huang）公开承认对妻子不忠，并向员工、董事会与股东致歉。\n\n这起私人丑闻之所以迅速升级为国际新闻头条，关键不在婚外情本身，而在于外遇对象的身分。据报，美国情报机构认定黄乐（Alice Huang）是中国国家安全部（MSS）招募的情报人员，她曾任新加坡数据中心公司Megaspeed的高管。\n\n《纽约时报》10月底率先披露美方的监控细节，《金融时报》上周末进一步指出，一份呈交政府高层的备忘录以「浪漫关系」（romantic relationship）形容两人的往来。随后，辉达董事会宣布启动独立调查，美国国会多个委员会要求黄仁勋出席闭门简报。\n\n美国总统特朗普（Donald Trump，川普）周日回应记者提问时表示，自己「没听过黄仁勋做了什么错事」，称他是「好人」「有荣誉感的人」，此事黄仁勋「大概有他的理由」，并表示愿意带他一起出访亚洲。然而，刚凭加强监管人工智能（AI）产业的诉求在期中选举大胜、拿下参众两院多数席位的民主党，可能对该事件进行质询。\n\n从国安风险、北京回应、新加坡的角色，再到台湾产业界，BBC中文整理此事的五大看点。\n\n根据报导，黄仁勋在给辉达员工的内部信中坦承：「我对妻子不忠。我的行为伤害了她和我们的孩子。没有任何借口。我深感抱歉。」他同时表示会全力配合董事会调查，并承诺继续领导辉达，不会中断。\n\n综合《纽约时报》与《金融时报》的调查报导，美国情报界根据长达约一年的电子监控，认定黄乐向北京传递情报。监控过程中，调查人员发现她与一名美国公民频繁联系，经「揭示身分」（unmasking）程序确认，该名公民正是黄仁勋。BBC目前尚无法独立核实相关指控。\n\n据报导，黄乐是中国公民，与黄仁勋并无亲属关系，曾与新加坡Megaspeed有关联。该公司是辉达在东南亚的重要云端客户，据报近两年进口了价值数十亿美元的辉达设备。美方相信黄乐受中国国家安全部招募，任务包括搜集AI晶片情报，并可能试图影响黄仁勋游说白宫，放宽对中国出口先进晶片的限制。\n\n两人曾多次在台湾同框，包括2024年6月现身台北一家酒吧、2025年在台北的餐厅聚会，当时已引起台湾媒体注意。丑闻正式曝光后，两人当年在台亲暱互动的影片与照片在台湾媒体及社交平台大量流传。这与台湾媒体过往对黄仁勋夫妇「鹣鲽情深」的报导形成强烈对比：黄仁勋的妻子与他自求学时期相恋，陪他度过数十年的创业难关。\n\n事件之所以触及美国国家安全的核心，是因为黄仁勋不仅执掌全球AI晶片龙头，也是特朗普在AI议题上的重要顾问。若情报真的透过私人关系外流，可能影响出口管制决策、特朗普对中国政策的判断，甚至晶片供应链的完整性。\n\n华盛顿并非近日才察觉此事。《金融时报》引述知情人士称，今年稍早一份备忘录已明确写下两人存在「浪漫关系」，据报由国务卿鲁比奥（Marco Rubio）监督起草，并在特朗普5月访问北京之前分发给政府高层。备忘录内容基于对黄乐的监控，警告黄仁勋与一名疑似中国间谍关系密切，可能涉及晶片情报与政策影响。\n\n近日，美国联邦众议院多个委员会已采取实质行动。相关国安与科技委员会主席要求黄仁勋出席闭门简报，强调国会必须彻底厘清，美国国家安全与关键技术究竟暴露于多大程度的风险之中。\n\n辉达董事会也宣布启动独立调查，由独立董事组成的委员会监督，并有外部独立律师协助审查所有资讯。董事会在声明中表示，目前「没有理由相信国家安全或辉达机密已遭妥协」，但仍会全面检视。\n\n一位不愿具名的台湾半导体业者，曾担任总经理级别的管理职务，向BBC中文表示，此事2024年已见诸台湾媒体，业界早有耳闻，「以黄仁勋的名气，很难在媒体与公众视野中隐身」。他认为，黄乐的主要任务并非窃取辉达机密，而是利用与黄仁勋的关系，促请他施加影响力，放宽辉达晶片对中国的出口。\n\n这位业者认为，黄仁勋的道德瑕疵对辉达影响甚大。黄仁勋过去在公司重大决策上几乎一人定夺，管理层级扁平，决策直接、效率极高，绩效亮眼。但在此次事件后，他的领导信用受损，恐怕难再像以往一言九鼎，公司内部的推动力可能下降。\n\n此文包含Instagram提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Instagram曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国外交部10月30日首次回应《纽约时报》的报导。发言人郭嘉昆称，报导「基于毫无根据的猜测」，目的是抹黑中国。\n\n11月9日，黄仁勋公开承认婚外情、辉达宣布展开调查后，郭嘉昆在例行记者会上再被问及此事。他说：「我们此前已就此作出回应，所谓中国间谍的论调纯属捕风捉影，污蔑抹黑。」\n\n当天有记者追问，这是否意味著中方否认该女子为中国情报机构工作。郭嘉昆没有正面回答，只是重复了上述说法。法新社记者还问及事件会否影响下周中美两国元首在深圳的APEC会晤，但未获进一步回应。\n\n中国媒体《环球时报》则在网站发表评论，称《纽约时报》的报导属「捕风捉影」。评论形容，富商、出轨、中国女间谍的组合「让美国媒体为之疯狂」，并质疑这则消息为何出现在「当下中美出现来之不易的缓和势头」之际，追问是否有有人在「推动议程、搅动对立」。\n\n评论还警告，如果任由「有罪推定」的逻辑蔓延，中美两国以及全球供应链都将受到拖累，并敦促一些美国媒体坚守基本的新闻准则，称炒作「中国间谍」叙事只会损害自身公信力。\n\n自2022年美国限制高阶AI晶片出口中国后，东南亚成为主要规避路径。除彭博社报导的Megaspeed案外，相关案件层出不穷：新加坡警方2026年查扣一栋约4200万美元的豪宅，涉嫌与走私辉达晶片所得有关；马来西亚海关多次在吉隆坡机场查获价值逾千万美元的AI伺服器，并指同一集团至少涉及五起案件；美国起诉美超微（Super Micro）相关案件，指控业者经马来西亚、新加坡、泰国转运数亿至数十亿美元受管制晶片；台湾亦起诉了经印尼等地转运的案件。\n\n专家与外媒指出，贸易数据显示马来西亚与中国的伺服器进出口数字严重不符，非政府组织C4ADS等机构的报告记录了多批经越南、马来西亚转运的辉达GPU。但也有专家警告，加强执法成本高昂，并可能迫使东南亚国家选边站。\n\n新加坡国立大学政治学系副教授庄嘉颖向BBC中文解释，新加坡长期以国际经贸、财经与服务枢纽的定位推动经济，只要不触犯本地法律或损害在地利益，官方通常不会特别介入，这种中立态度让新加坡获益良多。「但这种模式的前提是，主要贸易伙伴允许、甚至鼓励经由新加坡进行合作。在大国角力加剧之下，担任中间人或买办角色的风险正在上升。」\n\n「这已非单纯的『选边』问题，因为选择空间正在缩小。」他表示，「新加坡及其他惯于担任中间人的经济体，若仍想左右逢源，将面临更多阻力，甚至可能变成各方都不讨好。」\n\n庄嘉颖强调，虽然许多国家不愿在美中之间做取舍，但最终可能由不得自己。因为，历史显示，多极或多强并立的格局，往往会压缩中小国家的活动空间与自主性，譬如二战后被牺牲的波兰或捷克。\n\n不过，新加坡内政部（MHA）明确澄清，政府与官员从未对黄乐个人与中国情报或与黄仁勋关系展开调查，也未表达相关担忧；相关调查仅针对Megaspeed公司本身，且仍在进行中。\n\n事实上，黄仁勋与新加坡业务关系紧密，其亚太媒体联系团队主理为新加坡人士，在台北参与科技大展时，唯一专访也给了新加坡媒体新加坡亚洲新闻台（CNA）。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n民主党方面早已对黄仁勋游说放宽对中出口持批评态度。重量级的民主党参议员华伦（Elizabeth Warren）等人多次要求黄仁勋到国会说明，并推动将更严格的AI晶片出口管制、位置验证与国会审查机制纳入国防授权法案。\n\n此次间谍疑云正好给刚拿下参众两院，势头正旺的民主党更多弹药，即使特朗普政府过去在黄仁勋影响下有条件放行部分H200等晶片，民主党据信势必更严格审查辉达的中国业务与供应链合规。\n\n对台湾而言，短期可能带来双重影响。一方面，若美国进一步收紧对华出口，辉达对先进制程的需求会更集中在台积电（TSMC），台湾作为全球最先进AI晶片制造中心，订单与战略地位可能更稳固。\n\n另一方面，台湾本身也在加强对华出口管制，包括考虑将AI加速器纳入更严格管制，并加重走私刑罚，以配合美国并堵住从台湾转运的漏洞。这可能增加伺服器组装厂的合规成本，并影响部分中国客户订单。\n\n上述不愿具名的台湾科技业者向BBC中文说，对台湾而言，会受到一点影响，但出货限制程度应仍可控。辉达若受挫，台湾业者仍可转向其他供应商（如AMD）取得所需晶片。\n\n受访者又告诉BBC，美国现行出口管制法令已相当完整，未来只会更严格，许多设备本来就禁止输往中国。他说，黄仁勋好不容易说服特朗普同意出售H200，但中国不给面子。中国真正目标是国产自制高阶AI晶片（如华为），因此此事对中国影响有限，对辉达公司内部冲击反而较大。", "link": "https://www.bbc.com/zhongwen/articles/c6rmym2gg9z1o/trad?at_medium=RSS&at_campaign=rss", "time": "11月09日 21:10", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "《巴黎协定》：为什么将全球升温控制在1.5摄氏度内如此重要？", "title_zh": "《巴黎协定》：为什么将全球升温控制在1.5摄氏度内如此重要？", "summary_orig": "2015 年的这项协议是国际社会应对全球气温上升承诺的核心。", "summary_zh": "2015 年的这项协议是国际社会应对全球气温上升承诺的核心。", "body_orig": "", "body_zh": "2015年在法国巴黎，近200个国家签署了一项具有里程碑意义的协议，旨在将全球暖化限制在摄氏1.5度以内，并避免其最严重的后果。\n\n联合国最近的一份报告称，未来几年内，全球升温幅度很可能超过摄氏1.5度，需要采取「紧急而严厉的」行动才能使全球升温幅度回到1.5摄氏度以内。\n\n该协定于2016年11月4日生效，几乎所有国家都同意减少导致全球变暖的温室气体排放。\n\n然而，作为全球第二大温室气体排放国的美国，于2026年1月在唐纳·特朗普（Donald Trump）总统任内退出了该协定。\n\n美国在特朗普的第一个总统任期内也曾退出，但其继任者乔·拜登（Joe Biden）总统执政后，于2021年重新加入。\n\n因此，虽然2024年的气温比工业化前时期高出1.5摄氏度以上，但这并不意味著《巴黎协定》的门槛已被突破。\n\n气候科学家表示，气温每升高 0.1 摄氏度，地球就会面临更大的风险，例如更长的热浪、更强烈的风暴和野火。\n\n但联合国科学家表示，大量科学证据表明，升温 2 摄氏度或以上将带来更大的影响，远超升温 1.5 摄氏度所带来的影响。\n\n《巴黎协定》重申了2009年的承诺，到2020年，较富裕的国家应每年提供1000亿美元（6,674亿元人民币；3.28兆元新台币），以帮助发展中国家应对气候变迁的影响并建立更绿色的经济。\n\n尽管2020年只筹集了833亿美元，但经合组织的数据显示，2022年后的三年里，每年都达到了目标。\n\n近年来，近三分之二的资金用于限制全球暖化的努力，而约四分之一的资金用于帮助各国适应气候变迁。\n\n2023年，各国首次达成共识，成立一项专门用于因应损失和损害的基金。这笔资金将用于帮助各国从气候变迁的影响中恢复过来。\n\n2026年8月，尼泊尔发生山洪暴发，造成1,400多人死亡，之后尼泊尔成为第一个获准从该基金获得资金的国家。\n\n在2024年的第29届《联合国气候变化纲要公约》缔约方大会（COP29）上，较富裕的国家承诺到2035年每年向发展中国家提供3,000亿美元（2.22万亿元人民币；9.84兆元新台币）。发展中国家原本希望获得更多援助，因此批评这笔金额「微不足道」。\n\n世界领导人每年都会齐聚一堂，在被称为「缔约方大会」（COP）的国际高峰会上讨论各自的气候承诺。\n\n在2023年的 COP28 上，各国首次同意为「转型脱离化石燃料」作出「贡献」，尽管各国并未被要求采取任何具体行动。\n\n但2025年 COP30 的最终协议并未直接提及化石燃料。相反，会议东道国巴西发布了一份自愿性逐步摆脱化石燃料的路线图，该路线图将在第31届缔约方大会（COP31）上进行讨论。\n\n2026年11月9日至20日，COP31将在土耳其安塔利亚（COP31）举行，澳洲是联合主办国。\n\n由57个国家组成的「志愿联盟」也组织了自己的会议，与缔约方大会进程分开，讨论逐步摆脱化石燃料的问题。第一次会议于2026年4月在哥伦比亚圣玛尔塔（Santa Marta）举行，另一次会议定于2027年7月在图瓦卢举行。\n\n但最新的联合国《排放差距报告》（Emissions Gap Report）称，在「数十年气候行动不足」之后，这一限值很可能在未来几年内被超过。\n\n报告称，即使在「最低可能」的情况下，到本世纪中叶，全球暖化仍将达到1.7至1.8摄氏度。\n\n联合国补充说，到2100年将升温幅度控制在摄氏1.5度以内是可能的，但这需要「紧急而严格地削减温室气体排放」。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "2015年在法国巴黎，近200个国家签署了一项具有里程碑意义的协议，旨在将全球暖化限制在摄氏1.5度以内，并避免其最严重的后果。\n\n联合国最近的一份报告称，未来几年内，全球升温幅度很可能超过摄氏1.5度，需要采取「紧急而严厉的」行动才能使全球升温幅度回到1.5摄氏度以内。\n\n该协定于2016年11月4日生效，几乎所有国家都同意减少导致全球变暖的温室气体排放。\n\n然而，作为全球第二大温室气体排放国的美国，于2026年1月在唐纳·特朗普（Donald Trump）总统任内退出了该协定。\n\n美国在特朗普的第一个总统任期内也曾退出，但其继任者乔·拜登（Joe Biden）总统执政后，于2021年重新加入。\n\n因此，虽然2024年的气温比工业化前时期高出1.5摄氏度以上，但这并不意味著《巴黎协定》的门槛已被突破。\n\n气候科学家表示，气温每升高 0.1 摄氏度，地球就会面临更大的风险，例如更长的热浪、更强烈的风暴和野火。\n\n但联合国科学家表示，大量科学证据表明，升温 2 摄氏度或以上将带来更大的影响，远超升温 1.5 摄氏度所带来的影响。\n\n《巴黎协定》重申了2009年的承诺，到2020年，较富裕的国家应每年提供1000亿美元（6,674亿元人民币；3.28兆元新台币），以帮助发展中国家应对气候变迁的影响并建立更绿色的经济。\n\n尽管2020年只筹集了833亿美元，但经合组织的数据显示，2022年后的三年里，每年都达到了目标。\n\n近年来，近三分之二的资金用于限制全球暖化的努力，而约四分之一的资金用于帮助各国适应气候变迁。\n\n2023年，各国首次达成共识，成立一项专门用于因应损失和损害的基金。这笔资金将用于帮助各国从气候变迁的影响中恢复过来。\n\n2026年8月，尼泊尔发生山洪暴发，造成1,400多人死亡，之后尼泊尔成为第一个获准从该基金获得资金的国家。\n\n在2024年的第29届《联合国气候变化纲要公约》缔约方大会（COP29）上，较富裕的国家承诺到2035年每年向发展中国家提供3,000亿美元（2.22万亿元人民币；9.84兆元新台币）。发展中国家原本希望获得更多援助，因此批评这笔金额「微不足道」。\n\n世界领导人每年都会齐聚一堂，在被称为「缔约方大会」（COP）的国际高峰会上讨论各自的气候承诺。\n\n在2023年的 COP28 上，各国首次同意为「转型脱离化石燃料」作出「贡献」，尽管各国并未被要求采取任何具体行动。\n\n但2025年 COP30 的最终协议并未直接提及化石燃料。相反，会议东道国巴西发布了一份自愿性逐步摆脱化石燃料的路线图，该路线图将在第31届缔约方大会（COP31）上进行讨论。\n\n2026年11月9日至20日，COP31将在土耳其安塔利亚（COP31）举行，澳洲是联合主办国。\n\n由57个国家组成的「志愿联盟」也组织了自己的会议，与缔约方大会进程分开，讨论逐步摆脱化石燃料的问题。第一次会议于2026年4月在哥伦比亚圣玛尔塔（Santa Marta）举行，另一次会议定于2027年7月在图瓦卢举行。\n\n但最新的联合国《排放差距报告》（Emissions Gap Report）称，在「数十年气候行动不足」之后，这一限值很可能在未来几年内被超过。\n\n报告称，即使在「最低可能」的情况下，到本世纪中叶，全球暖化仍将达到1.7至1.8摄氏度。\n\n联合国补充说，到2100年将升温幅度控制在摄氏1.5度以内是可能的，但这需要「紧急而严格地削减温室气体排放」。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/cmde8ende1exo/trad?at_medium=RSS&at_campaign=rss", "time": "11月09日 16:54", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "白金汉宫幕僚：英王查尔斯「会考虑访华」", "title_zh": "白金汉宫幕僚：英王查尔斯「会考虑访华」", "summary_orig": "白金汉宫一名幕僚表示，若贝安德首相向王室提议查尔斯三世访华，国王将「小心考虑」。", "summary_zh": "白金汉宫一名幕僚表示，若贝安德首相向王室提议查尔斯三世访华，国王将「小心考虑」。", "body_orig": "", "body_zh": "白金汉宫一名幕僚表示，若英国政府提议英王查尔斯三世（King Charles III；查理斯国王）访问中国，国王将「小心考虑」。\n\n这位幕僚是在查尔斯国王周末结束加勒比海多国巡访和出席英联邦政府首脑会议（CHOGM）之际，向一群媒体记者表达此说。\n\n有关言论发表前不久，是已故英女王伊丽莎白二世（Queen Elizabeth II；伊利沙伯二世）1986年访华40周年。她是迄今唯一一位曾经访问中国的英国君主。\n\n英国政府目前并未对此说法置评。国会下议院一个委员会上周发表报告，批评现政府在对华政策上「见步行步」。贝安德（Andy Burnham）就任首相至今尚未阐明其对英中关系的立场。\n\n在刚结束的对加勒比海行程中，查尔斯国王先后访问了圭亚那（Guyana）和巡访了巴哈马（The Bahamas）、安提瓜和巴布达（Antigua and Barbuda）两国。三国均为英联邦（Commonwealth of Nations；大英国协）成员国，其中巴哈马与安提瓜和巴布达亦是英联邦王国（Commonwealth realm），奉查尔斯国王为国家元首。\n\n英国报联社（Press Association, PA）报导，这位白金汉宫幕僚是在评论国王是次行程时谈及中国。\n\n这位「高级幕僚」对随行采访的记者说：「要是政府说：『国王能去中国吗？』我想我们会很小心地考虑这事情。」\n\n现年78岁的查尔斯国王目前仍在接受癌症治疗——王室官僚并未透露其具体诊断。他在今年4月官式访美，期间如何与美国总统特朗普（Donald Trump；川普）互动，受到外界赞赏。\n\n受香港局势、英国批评中国人权纪录、连串间谍指控，以及中国驻英国大使馆新馆建设争议等所影响，伦敦与北京关系近年持续处于低潮。\n\n法新社向唐宁街10号首相府查询贝安德政府会否请求国王出访中国，其发言人答复称，君主要出访何处「由白金汉宫定夺」。\n\n然而，国王接见访英外国首脑与否，实际上是「按外交部建议」决定。同理，邀请国王出访何国，同样是经由英国外交部操办。英国王室官网对此惯例有明文介绍，内阁办公室王室访问委员会（Royal Visits Committee, Cabinet Office）为相关决策实体。\n\n国王此行在安提瓜和巴布达出席英联邦政府首脑会议（CHOGM）时，在开幕致词中形容跨大西洋奴隶贸易是「历史上可耻的一章」，令他感到「极为悲痛」。贝安德首相同步透露，他愿意考虑由英国作出正式道歉。\n\n法新社引述这位幕僚说：「我认为，我们正目睹一种非常清晰的模式显现出来：政府要求国王介入一些政治色彩浓厚、且颇具挑战性的局面。」\n\n英国报联社引述该名白金汉宫高级幕僚说：「中国是个何其重要的国家，是个很复杂的国家，在制定访问计划时得应付诸多复杂因素。」\n\n已故英女王伊丽莎白二世1986年的访问，是英国在位君主迄今唯一一次官式对华访问。女王当年10月12日抵达北京，先后会晤中国国家主席李先念、中共中央总书记赵紫阳和中共中央顾问委员会主任邓小平。行程从北京延伸至上海和广州，历时七天。女王结束访华后，紧接巡访当时的英属香港两天。\n\n该次国事访问是在1984年《中英联合声明》签署10个月后进行，《声明》敲定了1997年香港主权自英国移交中国。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n查尔斯国王从未访问中国。在1999年时任中国国家主席江泽民访英，和现任中国国家主席习近平2015年访英时，当时的王储威尔士亲王查尔斯王子（Charles, Prince of Wales）并未出席欢迎国宴。\n\n白金汉宫前幕僚马克·博兰德（Mark Bolland）曾形容，1999年的一次，查尔斯王子是「蓄意冷落」中方，因其并不认可中共政权。\n\n博兰德解释，这是因为查尔斯王子是西藏流亡精神领袖达赖喇嘛的忠实支持者，认为对方遭受中共打压。中国长期指控达赖喇嘛长期阴谋将西藏从中国分裂出去。\n\n博兰德的描述源于2006年查尔斯王子起诉《星期日邮报》（The Mail on Sunday）母公司将其私人日记曝光的侵犯隐私诉讼。时任王储法律代表后来公开了这3000字日记，而《星期日邮报》母公司最终败诉。\n\n这篇日记记载1997年6月30日至7月1日凌晨间，王储作为女王代表出席香港移交大典的经历。王储形容香港移交是「中国大外卖」，出席大典的中方官员是「糟透的陈旧蜡像」——当时出席的中方代表包括江泽民和总理李鹏，大典其中一项仪式是「糟糕的苏联风格」表演。\n\n不过，向媒体记者放话的白金汉宫高级幕僚形容，按宪制惯例保持政治中立的查尔斯国王「乐于面对」其职责中「艰难的部分」，并且可以成为政府的「绝佳秘密武器」。\n\n这位幕僚说：「无论是在环境议题上发挥领导作用，还是在一些涉及复杂政治问题的国家之间，更新、重建并重新注入活力于彼此关系方面，这正是他全心投入、热衷不已的事情。」", "body": "白金汉宫一名幕僚表示，若英国政府提议英王查尔斯三世（King Charles III；查理斯国王）访问中国，国王将「小心考虑」。\n\n这位幕僚是在查尔斯国王周末结束加勒比海多国巡访和出席英联邦政府首脑会议（CHOGM）之际，向一群媒体记者表达此说。\n\n有关言论发表前不久，是已故英女王伊丽莎白二世（Queen Elizabeth II；伊利沙伯二世）1986年访华40周年。她是迄今唯一一位曾经访问中国的英国君主。\n\n英国政府目前并未对此说法置评。国会下议院一个委员会上周发表报告，批评现政府在对华政策上「见步行步」。贝安德（Andy Burnham）就任首相至今尚未阐明其对英中关系的立场。\n\n在刚结束的对加勒比海行程中，查尔斯国王先后访问了圭亚那（Guyana）和巡访了巴哈马（The Bahamas）、安提瓜和巴布达（Antigua and Barbuda）两国。三国均为英联邦（Commonwealth of Nations；大英国协）成员国，其中巴哈马与安提瓜和巴布达亦是英联邦王国（Commonwealth realm），奉查尔斯国王为国家元首。\n\n英国报联社（Press Association, PA）报导，这位白金汉宫幕僚是在评论国王是次行程时谈及中国。\n\n这位「高级幕僚」对随行采访的记者说：「要是政府说：『国王能去中国吗？』我想我们会很小心地考虑这事情。」\n\n现年78岁的查尔斯国王目前仍在接受癌症治疗——王室官僚并未透露其具体诊断。他在今年4月官式访美，期间如何与美国总统特朗普（Donald Trump；川普）互动，受到外界赞赏。\n\n受香港局势、英国批评中国人权纪录、连串间谍指控，以及中国驻英国大使馆新馆建设争议等所影响，伦敦与北京关系近年持续处于低潮。\n\n法新社向唐宁街10号首相府查询贝安德政府会否请求国王出访中国，其发言人答复称，君主要出访何处「由白金汉宫定夺」。\n\n然而，国王接见访英外国首脑与否，实际上是「按外交部建议」决定。同理，邀请国王出访何国，同样是经由英国外交部操办。英国王室官网对此惯例有明文介绍，内阁办公室王室访问委员会（Royal Visits Committee, Cabinet Office）为相关决策实体。\n\n国王此行在安提瓜和巴布达出席英联邦政府首脑会议（CHOGM）时，在开幕致词中形容跨大西洋奴隶贸易是「历史上可耻的一章」，令他感到「极为悲痛」。贝安德首相同步透露，他愿意考虑由英国作出正式道歉。\n\n法新社引述这位幕僚说：「我认为，我们正目睹一种非常清晰的模式显现出来：政府要求国王介入一些政治色彩浓厚、且颇具挑战性的局面。」\n\n英国报联社引述该名白金汉宫高级幕僚说：「中国是个何其重要的国家，是个很复杂的国家，在制定访问计划时得应付诸多复杂因素。」\n\n已故英女王伊丽莎白二世1986年的访问，是英国在位君主迄今唯一一次官式对华访问。女王当年10月12日抵达北京，先后会晤中国国家主席李先念、中共中央总书记赵紫阳和中共中央顾问委员会主任邓小平。行程从北京延伸至上海和广州，历时七天。女王结束访华后，紧接巡访当时的英属香港两天。\n\n该次国事访问是在1984年《中英联合声明》签署10个月后进行，《声明》敲定了1997年香港主权自英国移交中国。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n查尔斯国王从未访问中国。在1999年时任中国国家主席江泽民访英，和现任中国国家主席习近平2015年访英时，当时的王储威尔士亲王查尔斯王子（Charles, Prince of Wales）并未出席欢迎国宴。\n\n白金汉宫前幕僚马克·博兰德（Mark Bolland）曾形容，1999年的一次，查尔斯王子是「蓄意冷落」中方，因其并不认可中共政权。\n\n博兰德解释，这是因为查尔斯王子是西藏流亡精神领袖达赖喇嘛的忠实支持者，认为对方遭受中共打压。中国长期指控达赖喇嘛长期阴谋将西藏从中国分裂出去。\n\n博兰德的描述源于2006年查尔斯王子起诉《星期日邮报》（The Mail on Sunday）母公司将其私人日记曝光的侵犯隐私诉讼。时任王储法律代表后来公开了这3000字日记，而《星期日邮报》母公司最终败诉。\n\n这篇日记记载1997年6月30日至7月1日凌晨间，王储作为女王代表出席香港移交大典的经历。王储形容香港移交是「中国大外卖」，出席大典的中方官员是「糟透的陈旧蜡像」——当时出席的中方代表包括江泽民和总理李鹏，大典其中一项仪式是「糟糕的苏联风格」表演。\n\n不过，向媒体记者放话的白金汉宫高级幕僚形容，按宪制惯例保持政治中立的查尔斯国王「乐于面对」其职责中「艰难的部分」，并且可以成为政府的「绝佳秘密武器」。\n\n这位幕僚说：「无论是在环境议题上发挥领导作用，还是在一些涉及复杂政治问题的国家之间，更新、重建并重新注入活力于彼此关系方面，这正是他全心投入、热衷不已的事情。」", "link": "https://www.bbc.com/zhongwen/articles/cj20v0x3ze2no/trad?at_medium=RSS&at_campaign=rss", "time": "11月10日 00:31", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "中式微短剧浪潮席卷英国：为滑动时代而生的「碎片化」剧集", "title_zh": "中式微短剧浪潮席卷英国：为滑动时代而生的「碎片化」剧集", "summary_orig": "这些节奏明快、张力十足的短篇剧集透过手机观看，在中国大受欢迎，在英国也正迅速兴起。", "summary_zh": "这些节奏明快、张力十足的短篇剧集透过手机观看，在中国大受欢迎，在英国也正迅速兴起。", "body_orig": "", "body_zh": "每天晚上，希瑟·夏罗克（Heather Sharrock）都会坐下来观看自己最喜爱的剧集。\n\n但那不是在网飞（Netflix）、BBC iPlayer，甚至不是在电视上播放，而是在她的手机里。\n\n我们之中有些人或许每晚能看完几集最新追看的剧集，Heather 却能一口气追看几十集，因为这位来自苏格兰、55岁的女子迷上了微短剧（microdrama）。\n\nHeather 说：「现在世界上有太多乱七八糟的事情在发生，能够暂时放空，不去想那些事情，感觉很好。」\n\n微短剧在中国早已大受欢迎，如今在英国也愈来愈流行，可在 ReelShort、CandyJar 和 DramaBox 等应用程式上观看。上星期，制作方宣布将经典肥皂剧《家有芳邻》（Neighbours）的故事线重新剪辑成超短的直式剧集，这是这种形式正逐步走向主流的最新迹象之一。\n\n微短剧由节奏明快、张力十足的短篇集数组成，每集通常长60至90秒。许多作品聚焦于禁忌之恋、家族纷争和隐藏身份的亿万富豪等主题，而几乎每一集都会以戏剧性的悬念作结。每部作品通常有50集或以上，因此总时长与一部长篇电影相若。\n\n来自苏格兰、45岁的影迷黛安·艾特肯（Diane Aitken）将她喜爱的狼人与吸血鬼题材微短剧形容为1980年代美国肥皂剧《家族风云》（Dallas；《朱门恩怨》／《豪门恩怨》）或《王朝》（Dynasty；《朝代》／《锦绣豪门》）的「加强版」。\n\n出生于中国的电影制作人孙慧明（Samantha Sun）表示，这类剧集于2010年代末在中国出现，最初是由网络小说改编而成，制作成本低廉且拍摄快捷；对许多观众而言，它们是一种逃避现实的方式。\n\n来自唐卡斯特、46岁的莎拉—简·伦恩（Sarah-Jayne Lunn）表示，微短剧帮助她度过人生中的艰难时期。她说：「我立刻就上瘾了。我不用想太多。」\n\n珍·库珀（Jen Cooper）是微短剧观众，现时则担任业界顾问。她对此表示认同。她说，微短剧最初主要受到寻找爱情题材内容的中年女性欢迎，许多 BookTok 和浪漫奇幻（romantasy）爱好者都会观看，但如今已吸引更广泛的观众群。\n\n根据中国国家广播电视总局数据，去年中国微短剧市场规模超过1000亿元人民币（138.9亿美元；4200亿元新台币），观众人数突破8亿。但微短剧在韩国（南韩）、印度和美国同样受欢迎，而亚马逊 Prime、Peacock 和 Disney+ 等串流平台都已宣布计划在服务中加入微短剧。\n\n在英国，自称全国首个专门微短剧应用程式的 TattleTV 于今年稍早推出；而皇家电视学会（Royal Television Society, RTS）则于今夏举办有关微短剧的业界座谈会。\n\n各家公司亦希望把握微短剧热潮，为社交媒体制作品牌短片广告，其中包括杰米·奥利弗（Jamie Oliver）、合作社（Co-op），以及第四频道电视台（Channel 4）与 Sol de Janeiro 合作推出的作品。\n\n威尔士制作公司 Spare Arrow 的夏洛特·布罗肯布罗（Charlotte Brokenbrow）表示，微短剧必须节奏明快，才能留住观众注意力。该公司于今年制作首部微短剧系列。\n\n除了节奏飞快之外，微短剧受欢迎的原因之一是观众可以利用零碎时间观看，因此有分析人士形容它们为「零食式内容」（snackable；碎片化内容）。\n\n安格利亚鲁斯金大学（Anglia Ruskin University, ARU）电影与媒体副教授蒂娜·肯德尔博士（Dr Tina Kendall）表示，微短剧亦迎合了观众转向「随意、低投入、可以随时开始和停止观看」的趋势。\n\n有受访者向BBC表示，他们会在接孩子放学时于车内观看；也有人表示，会一边处理家务或行政工作，一边把微短剧当作背景播放。\n\nSarah-Jayne 说，由于剧情走向通常「太容易预料」，她甚至可以一边工作一边看。\n\n专门的微短剧应用程式通常先让用户免费观看头几集，之后则要求付费订阅。CandyJar 年费49英镑（66美元；475元人民币；1960元新台币），DramaBox 则收费110英镑。不过，大部分微短剧平台都允许追剧观众购买按周计算的订阅服务，或透过观看广告换取免费集数。\n\n孙慧明表示，中国制作公司经常复制成功公式，只作微小改动，而 Heather 对此亦深有同感。\n\n她说：「很多其实都是同一个故事，只是换了不同背景设定。」又说自己已经「看腻了」亿万富豪行政总裁题材。\n\n较为离奇的剧名包括《我领养了被偷走的孩子》（I Adopted My Stolen Baby）、《迷恋我的英国牛仔》（Craving My British Cowboy），以及《我在圣诞节找到一位无家可归的亿万富翁丈夫》（Found a Homeless Billionaire Husband for Christmas）。\n\n一些观众表示，部分剧情有贬低女性之嫌，其中某些作品粗糙地描绘暴力和性侵情节。曾于2024年出演首部微短剧的演员可可·泰勒（Coco Taylor）说：「这甚至变成了一个笑话，女演员在吃午饭之前就已经遭遇了无数可怕的事情，哭喊了上千万次。」\n\n泰勒表示，她曾拒绝接演某些作品，因为她认为那些剧集过于厌女。不过，她与许多微短剧爱好者都表示，故事质素已经有所提升，他们认为这是因为现在有更多剧情由美国和英国团队编写；他们亦热切谈论微短剧正逐步拓展至喜剧、惊悚和恐怖等类型。\n\n制作公司 Black Swan 创办人海顿·韦克林（Haydn Wakeling）于今年稍早透过电影业界人士首次听闻微短剧。他说：「快转到现在，已经变成所有人都在谈论的话题。」\n\n韦克林表示，从财务角度来看，微短剧对导演与制作人非常有吸引力。拍摄一部时长介乎60至90分钟的微短剧通常不足两星期，因此能有效降低成本。\n\n导演丹·勒文斯坦Dan Löwenstein）于2024年2月执导首部微短剧《黑帮情人》（Mafia Lover），如今他已拍摄到第38部。他最初参与的是由中国应用程式平台委托制作的作品，但表示随着中国业界转向人工智能（artificial intelligence, AI；人工智慧）制作，他现正与美国平台、全球串流媒体和英国公司合作。\n\n英国现已成为欧洲最大的微短剧观众市场。虽然许多观众与业界制作人都对这种形式的未来感到兴奋，但它亦不乏批评者。\n\n有人讥讽微短剧是低质内容，会破坏人们的专注力。《卫报》（The Guardian）一篇评论文章的作者便形容这类剧集「愚蠢得近乎灾难性，而且客观而言品质低劣」。\n\n但正如由观众转型成顾问的珍·库珀所说：「没有人会说这是甚么深刻作品，但如果它能让人产生情感共鸣、令某人展露笑容，或让艰难的一天变得稍微容易一些，那肯定是一件值得庆祝的美好事情。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "每天晚上，希瑟·夏罗克（Heather Sharrock）都会坐下来观看自己最喜爱的剧集。\n\n但那不是在网飞（Netflix）、BBC iPlayer，甚至不是在电视上播放，而是在她的手机里。\n\n我们之中有些人或许每晚能看完几集最新追看的剧集，Heather 却能一口气追看几十集，因为这位来自苏格兰、55岁的女子迷上了微短剧（microdrama）。\n\nHeather 说：「现在世界上有太多乱七八糟的事情在发生，能够暂时放空，不去想那些事情，感觉很好。」\n\n微短剧在中国早已大受欢迎，如今在英国也愈来愈流行，可在 ReelShort、CandyJar 和 DramaBox 等应用程式上观看。上星期，制作方宣布将经典肥皂剧《家有芳邻》（Neighbours）的故事线重新剪辑成超短的直式剧集，这是这种形式正逐步走向主流的最新迹象之一。\n\n微短剧由节奏明快、张力十足的短篇集数组成，每集通常长60至90秒。许多作品聚焦于禁忌之恋、家族纷争和隐藏身份的亿万富豪等主题，而几乎每一集都会以戏剧性的悬念作结。每部作品通常有50集或以上，因此总时长与一部长篇电影相若。\n\n来自苏格兰、45岁的影迷黛安·艾特肯（Diane Aitken）将她喜爱的狼人与吸血鬼题材微短剧形容为1980年代美国肥皂剧《家族风云》（Dallas；《朱门恩怨》／《豪门恩怨》）或《王朝》（Dynasty；《朝代》／《锦绣豪门》）的「加强版」。\n\n出生于中国的电影制作人孙慧明（Samantha Sun）表示，这类剧集于2010年代末在中国出现，最初是由网络小说改编而成，制作成本低廉且拍摄快捷；对许多观众而言，它们是一种逃避现实的方式。\n\n来自唐卡斯特、46岁的莎拉—简·伦恩（Sarah-Jayne Lunn）表示，微短剧帮助她度过人生中的艰难时期。她说：「我立刻就上瘾了。我不用想太多。」\n\n珍·库珀（Jen Cooper）是微短剧观众，现时则担任业界顾问。她对此表示认同。她说，微短剧最初主要受到寻找爱情题材内容的中年女性欢迎，许多 BookTok 和浪漫奇幻（romantasy）爱好者都会观看，但如今已吸引更广泛的观众群。\n\n根据中国国家广播电视总局数据，去年中国微短剧市场规模超过1000亿元人民币（138.9亿美元；4200亿元新台币），观众人数突破8亿。但微短剧在韩国（南韩）、印度和美国同样受欢迎，而亚马逊 Prime、Peacock 和 Disney+ 等串流平台都已宣布计划在服务中加入微短剧。\n\n在英国，自称全国首个专门微短剧应用程式的 TattleTV 于今年稍早推出；而皇家电视学会（Royal Television Society, RTS）则于今夏举办有关微短剧的业界座谈会。\n\n各家公司亦希望把握微短剧热潮，为社交媒体制作品牌短片广告，其中包括杰米·奥利弗（Jamie Oliver）、合作社（Co-op），以及第四频道电视台（Channel 4）与 Sol de Janeiro 合作推出的作品。\n\n威尔士制作公司 Spare Arrow 的夏洛特·布罗肯布罗（Charlotte Brokenbrow）表示，微短剧必须节奏明快，才能留住观众注意力。该公司于今年制作首部微短剧系列。\n\n除了节奏飞快之外，微短剧受欢迎的原因之一是观众可以利用零碎时间观看，因此有分析人士形容它们为「零食式内容」（snackable；碎片化内容）。\n\n安格利亚鲁斯金大学（Anglia Ruskin University, ARU）电影与媒体副教授蒂娜·肯德尔博士（Dr Tina Kendall）表示，微短剧亦迎合了观众转向「随意、低投入、可以随时开始和停止观看」的趋势。\n\n有受访者向BBC表示，他们会在接孩子放学时于车内观看；也有人表示，会一边处理家务或行政工作，一边把微短剧当作背景播放。\n\nSarah-Jayne 说，由于剧情走向通常「太容易预料」，她甚至可以一边工作一边看。\n\n专门的微短剧应用程式通常先让用户免费观看头几集，之后则要求付费订阅。CandyJar 年费49英镑（66美元；475元人民币；1960元新台币），DramaBox 则收费110英镑。不过，大部分微短剧平台都允许追剧观众购买按周计算的订阅服务，或透过观看广告换取免费集数。\n\n孙慧明表示，中国制作公司经常复制成功公式，只作微小改动，而 Heather 对此亦深有同感。\n\n她说：「很多其实都是同一个故事，只是换了不同背景设定。」又说自己已经「看腻了」亿万富豪行政总裁题材。\n\n较为离奇的剧名包括《我领养了被偷走的孩子》（I Adopted My Stolen Baby）、《迷恋我的英国牛仔》（Craving My British Cowboy），以及《我在圣诞节找到一位无家可归的亿万富翁丈夫》（Found a Homeless Billionaire Husband for Christmas）。\n\n一些观众表示，部分剧情有贬低女性之嫌，其中某些作品粗糙地描绘暴力和性侵情节。曾于2024年出演首部微短剧的演员可可·泰勒（Coco Taylor）说：「这甚至变成了一个笑话，女演员在吃午饭之前就已经遭遇了无数可怕的事情，哭喊了上千万次。」\n\n泰勒表示，她曾拒绝接演某些作品，因为她认为那些剧集过于厌女。不过，她与许多微短剧爱好者都表示，故事质素已经有所提升，他们认为这是因为现在有更多剧情由美国和英国团队编写；他们亦热切谈论微短剧正逐步拓展至喜剧、惊悚和恐怖等类型。\n\n制作公司 Black Swan 创办人海顿·韦克林（Haydn Wakeling）于今年稍早透过电影业界人士首次听闻微短剧。他说：「快转到现在，已经变成所有人都在谈论的话题。」\n\n韦克林表示，从财务角度来看，微短剧对导演与制作人非常有吸引力。拍摄一部时长介乎60至90分钟的微短剧通常不足两星期，因此能有效降低成本。\n\n导演丹·勒文斯坦Dan Löwenstein）于2024年2月执导首部微短剧《黑帮情人》（Mafia Lover），如今他已拍摄到第38部。他最初参与的是由中国应用程式平台委托制作的作品，但表示随着中国业界转向人工智能（artificial intelligence, AI；人工智慧）制作，他现正与美国平台、全球串流媒体和英国公司合作。\n\n英国现已成为欧洲最大的微短剧观众市场。虽然许多观众与业界制作人都对这种形式的未来感到兴奋，但它亦不乏批评者。\n\n有人讥讽微短剧是低质内容，会破坏人们的专注力。《卫报》（The Guardian）一篇评论文章的作者便形容这类剧集「愚蠢得近乎灾难性，而且客观而言品质低劣」。\n\n但正如由观众转型成顾问的珍·库珀所说：「没有人会说这是甚么深刻作品，但如果它能让人产生情感共鸣、令某人展露笑容，或让艰难的一天变得稍微容易一些，那肯定是一件值得庆祝的美好事情。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/c50med2zn8dno/trad?at_medium=RSS&at_campaign=rss", "time": "11月09日 08:20", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举：共和党失去两院，对华政策与对台军售会转向吗？", "title_zh": "美国中期选举：共和党失去两院，对华政策与对台军售会转向吗？", "summary_orig": "美国期中选举民主党取得两院多数后，专家普遍认为，特朗普（川普）以个人外交主导的中国政策与对台军售节奏将面临国会更多监督与拉锯，但总统仍掌握主要决策权。", "summary_zh": "美国期中选举民主党取得两院多数后，专家普遍认为，特朗普（川普）以个人外交主导的中国政策与对台军售节奏将面临国会更多监督与拉锯，但总统仍掌握主要决策权。", "body_orig": "", "body_zh": "美国中期选举结果出炉，民主党在参众两院同时翻盘，共和党总统特朗普（Donald Trump，又译川普）的第二任期后半段将在「跛脚」状态下展开。这场选举不只改变华盛顿的权力版图，也可能牵动美中关系与台湾议题的走向。\n\n时机尤其敏感。11月18至19日，亚太经合组织（APEC）领导人峰会将在深圳举行；12月中，特朗普与习近平还可能在迈阿密G20峰会再度会面。价值140亿美元的对台军售案正卡在特朗普手中，他今年5月曾公开称这笔军售是「很好的谈判筹码」。民主党掌控国会后，出口管制、晶片限制与军售节奏会否出现新的拉锯，成为观察焦点。\n\n多位专家向BBC中文分析，美国两党在对华问题上的共识深厚，总统仍是政策主导者，大方向不会因国会易主而改变；真正的变化在于监督力度，民主党将透过听证会、传票、《国防授权法》与拨款法案，严格审视特朗普与北京达成的贸易休战。\n\n与此同时，多位长期支持台湾的共和党「台湾连线」议员落马，也意味著台北必须重新经营与新生代民主党议员的关系。\n\n美国智库太平洋论坛（Pacific Forum）兼任研究员蓝若思（Elizabeth Larus）向BBC中文表示，无论国会由哪个党派掌握多数，美国对台湾的支持及对华政策都不会改变，两党都会试图推动特朗普批准桌上那笔140亿美元的对台军售案。\n\n「自1979年以来，每一任美国总统都维持了《台湾关系法》、『六项保证』以及美国的『一个中国』政策，这些都不会因为民主党掌控国会而改变。」她说。\n\n美国智库德国马歇尔基金会（German Marshall Fund, GMF）亚洲计划主任葛来仪（Bonnie Glaser）预测，民主党将掌控拨款程序与参议院议程，很可能在《国防授权法》（NDAA）与拨款法案中加入多项要求：加速交付已核准的对台武器、新的对外军售（FMS）案件通报、对台使用外国军事融资（FMF），以及台湾安全合作倡议（Taiwan Security Cooperation Initiative）资金。《六项保证法案》（Six Assurances Act）也可能获得更多推进动能。\n\n葛来仪还指出，民主党大胜后，美国可能加强对中国取得先进晶片的限制，《安全晶片法案》（Safe Chips Act）有机会通过。但特朗普拥有否决权，民主党票数不足以推翻，除非部分共和党议员倒戈支持。\n\n新加坡南洋理工大学公共政策与全球事务副教授骆明辉（Dylan Loh）对BBC中文表示：「美国对中国存在广泛共识，整体关系的塑造仍主要由总统主导。」\n\n新加坡独立分析师邓铭杰也不认为民主党大胜会带来更温和的对华政策。两大党在出口管制、晶片限制与供应链措施上立场一致，实际变化在于监督力度：民主党将透过听证会与传票，严格审视贸易休战和「建设性战略稳定」框架。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国近年对特朗普的战略，核心是「以经贸换稳定、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "body": "美国中期选举结果出炉，民主党在参众两院同时翻盘，共和党总统特朗普（Donald Trump，又译川普）的第二任期后半段将在「跛脚」状态下展开。这场选举不只改变华盛顿的权力版图，也可能牵动美中关系与台湾议题的走向。\n\n时机尤其敏感。11月18至19日，亚太经合组织（APEC）领导人峰会将在深圳举行；12月中，特朗普与习近平还可能在迈阿密G20峰会再度会面。价值140亿美元的对台军售案正卡在特朗普手中，他今年5月曾公开称这笔军售是「很好的谈判筹码」。民主党掌控国会后，出口管制、晶片限制与军售节奏会否出现新的拉锯，成为观察焦点。\n\n多位专家向BBC中文分析，美国两党在对华问题上的共识深厚，总统仍是政策主导者，大方向不会因国会易主而改变；真正的变化在于监督力度，民主党将透过听证会、传票、《国防授权法》与拨款法案，严格审视特朗普与北京达成的贸易休战。\n\n与此同时，多位长期支持台湾的共和党「台湾连线」议员落马，也意味著台北必须重新经营与新生代民主党议员的关系。\n\n美国智库太平洋论坛（Pacific Forum）兼任研究员蓝若思（Elizabeth Larus）向BBC中文表示，无论国会由哪个党派掌握多数，美国对台湾的支持及对华政策都不会改变，两党都会试图推动特朗普批准桌上那笔140亿美元的对台军售案。\n\n「自1979年以来，每一任美国总统都维持了《台湾关系法》、『六项保证』以及美国的『一个中国』政策，这些都不会因为民主党掌控国会而改变。」她说。\n\n美国智库德国马歇尔基金会（German Marshall Fund, GMF）亚洲计划主任葛来仪（Bonnie Glaser）预测，民主党将掌控拨款程序与参议院议程，很可能在《国防授权法》（NDAA）与拨款法案中加入多项要求：加速交付已核准的对台武器、新的对外军售（FMS）案件通报、对台使用外国军事融资（FMF），以及台湾安全合作倡议（Taiwan Security Cooperation Initiative）资金。《六项保证法案》（Six Assurances Act）也可能获得更多推进动能。\n\n葛来仪还指出，民主党大胜后，美国可能加强对中国取得先进晶片的限制，《安全晶片法案》（Safe Chips Act）有机会通过。但特朗普拥有否决权，民主党票数不足以推翻，除非部分共和党议员倒戈支持。\n\n新加坡南洋理工大学公共政策与全球事务副教授骆明辉（Dylan Loh）对BBC中文表示：「美国对中国存在广泛共识，整体关系的塑造仍主要由总统主导。」\n\n新加坡独立分析师邓铭杰也不认为民主党大胜会带来更温和的对华政策。两大党在出口管制、晶片限制与供应链措施上立场一致，实际变化在于监督力度：民主党将透过听证会与传票，严格审视贸易休战和「建设性战略稳定」框架。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国近年对特朗普的战略，核心是「以经贸换稳定、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "link": "https://www.bbc.com/zhongwen/articles/cqr7ydkrnpxno/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 18:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "title_zh": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "summary_orig": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "summary_zh": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "body_orig": "", "body_zh": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/cqlyeen0z8x2o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 13:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举结果对中国和世界各国意味着什么？", "title_zh": "美国中期选举结果对中国和世界各国意味着什么？", "summary_orig": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "summary_zh": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "body_orig": "", "body_zh": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/ckreyrxvg3xyo/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 05:02", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}]}, {"key": "dw_cn", "name": "德国之声中文", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": []}, {"key": "guardian_biz", "name": "卫报商业版", "lang": "英文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读，含中文对照）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "Silicon Valley and Trump rally behind Nvidia CEO after his affair with alleged Chinese spy", "title_zh": "硅谷和特朗普在与涉嫌中国间谍事件后支持英伟达首席执行官", "summary_orig": "Elon Musk and other finance moguls defend Jensen Huang after he admitted to the affair in an email to employees Nvidia’s board needs to do some succession planning – sharpish Donald Trump , Elon Musk and prominent finance moguls have expressed their support for embattled Nvidia CEO Jensen Huang , as the head of the world’s most valuable chip company faces an internal investigation over a romantic relationship with an alleged Chinese spy. “I have not ​spoken to him about it,” the US president told reporters on Sunday. “I just know he’s a fine person, but you never know what is going on. I’m sure, I hope everything’s fine. He’s done such an incredible job”. Continue reading...", "summary_zh": "埃隆·马斯克（ Elon Musk ）和其他金融大亨在给员工的电子邮件中承认黄延森（ Jensen Huang ）需要做一些继任计划后，为黄延森（ Jensen Huang ）的事件辩护--敏锐的唐纳德·特朗普（ Donald Trump ）、埃隆·马斯克（ Elon Musk ）和知名金融大亨表示支持陷入困境的英伟达（ Nvidia ）首席执行官黄延森（ Jensen Huang ） ，因为这家全球最有价值的芯片公司的负责人面临着与涉嫌中国间谍的浪漫关系的内部调查。“没有和他谈过这件事， ”这位美国总统周日告诉记者。“我只知道他是个好人，但你永远不知道发生了什么。我敢肯定，我希望一切都好。他做了如此令人难以置信的工作”。继续阅读...", "body_orig": "Elon Musk and other finance moguls defend Jensen Huang after he admitted to the affair in an email to employees\n\nNvidia’s board needs to do some succession planning – sharpish\n\nDonald Trump, Elon Musk and prominent finance moguls have expressed their support for embattled Nvidia CEO Jensen Huang, as the head of the world’s most valuable chip company faces an internal investigation over a romantic relationship with an alleged Chinese spy.\n\n“I have not ​spoken to him about it,” the US president told reporters on Sunday. “I just know he’s a fine person, but you never know what is going on. I’m sure, I hope everything’s fine. He’s done such an incredible job”.\n\n“I think he’s an honorable guy. I think he probably has an excuse for it,” Trump later added, saying he believed that Huang would and should stay on as CEO.\n\nHuang’s defenders framed his affair as a personal lapse in judgment rather than evidence of treachery against the United States, which has imposed strict limits on what chips Nvidia can sell to China.\n\nHuang, who has been married to his wife, Lori, since 1985, admitted in an email to employees on Sunday that he had an affair and that he would cooperate with an internal investigation. Nvidia’s board of directors put out a statement the same day that the company was launching a probe regarding reports that Huang was the target of a foreign intelligence effort.\n\nThe chip mogul is alleged to have had a relationship with Alice Huang, a businesswoman that US intelligence services suspect of spying for the Chinese government, according to The New York Times. Trump was reportedly briefed on the relationship last year, the Times reported, but took no action. Alice Huang and Jensen Huang are unrelated, with the latter being one of the world’s richest men and CEO of Nvidia, worth more than $4tn, for the past 33 years.\n\nUS intelligence agencies believe Alice Huang, acting on behalf of Beijing, pushed Jensen Huang to lobby Trump for relaxed export controls on Nvidia’s sales in China, which he has done multiple times publicly. Nvidia said in a statement that neither trade secrets nor US national security had been compromised.\n\nThe affair and alleged intelligence operation involving Huang could have far reaching implications for Nvidia and the tech industry, which are already enduring a period of high market volatility. Huang’s leadership of Nvidia, which is deeply financially intertwined with other leading tech companies like OpenAI, has long been viewed as crucial to the company’s success and stability.\n\nAs news of the scandal broke over the weekend, Musk and prominent investors shared their support of Huang. Musk posted “I agree” in response to prominent venture capitalist Shaun Maguire’s defense of Huang. Maguire argued the Nvidia CEO “did something incredibly dumb” but that he is “one of the greatest entrepreneurs of this generation”.\n\n“Two mistakes don’t make a right, and I believe Jensen is irreplaceable for America’s AI leadership,” Maguire posted.\n\n“Let’s also not nuke our AI industry because China ran a successful intel op,” Maguire added in a separate post.\n\nBill Ackman, the US hedge fund manager and pro-Trump billionaire, meanwhile, suggested that Huang is “human” and deserves public support over the affair.\n\n“He is an incredible human. Even incredible humans make mistakes,” Ackman posted. “He takes full responsibility as he should. We should all support him and his family. Onward.”\n\nAckman followed up with another post later clarifying that he wasn’t suggesting Huang “gets a free pass” but that he was “hoping for a simple affair, not a risk to our national security”.\n\nChina has meanwhile denied allegations of an intelligence operation targeting Huang, with the Associated Press reporting that foreign ministry spokesperson Guo Jiakun rejected the allegations as “entirely baseless vilification and smearing”.\n\nNvidia and its chips have been an integral part of the AI boom in recent years, with hundreds of billions of dollars committed to building out projects such as datacenters and chip factories. In August, Nvidia agreed to provide a $105bn guarantee to help OpenAI lease an Ohio datacenter.\n\nAs Nvidia has grown in prominence, Huang has also become one of the world’s richest people and most influential figures in tech. He has taken calls from Trump in the middle of an all-hands company meeting and on stage at a conference, and attended state dinners with the president and accompanied him on a trip to China. Huang has also been a powerful voice on tech policy, weighing in on issues such as export controls of chips to China and regulation of open-source AI models.\n\nNvidia’s stock price fell on Monday as speculation swirled around Huang’s future at the company and the extent of damage from the affair. Shares were down around 5% as of midday and were on track to wipe out around $200bn in market value. The losses extend a six-month slide for what was once the world’s most valuable company, with Nvidia shares down over 20% since May.", "body_zh": "Elon Musk和其他金融大亨在给员工的电子邮件中承认此事后，为Jensen Huang辩护\n\n英伟达董事会需要做一些继任规划--敏锐\n\n唐纳德•特朗普(Donald Trump)、埃隆•马斯克(Elon Musk)和知名金融大亨已表示支持陷入困境的英伟达(Nvidia)首席执行官黄延森(Jensen Huang) ，因为这家全球最有价值的芯片公司的负责人面临着一项内部调查，涉及与一名涉嫌中国间谍的\n\n“我有没有和他谈过这件事， ”这位美国总统周日告诉记者。 “我只知道他是个好人，但你永远不知道发生了什么。 我敢肯定，我希望一切都好。 他做了如此令人难以置信的工作。”\n\n“我认为他是一个值得尊敬的人。 我认为他可能有借口， ”特朗普后来补充说，他相信黄将继续担任首席执行官。\n\n黄的辩护人把他的事情说成是个人判断失误，而不是有背叛美国的证据，美国对英伟达可以向中国销售的芯片施加了严格的限制。\n\n自1985年以来一直与妻子Lori结婚的Huang周日在给员工的电子邮件中承认，他有外遇，他将配合内部调查。 英伟达董事会当天发表声明称，该公司正在对有关黄先生是了解国外情报工作。\n\n据《纽约时报》报道，这位芯片大亨据称与美国情报部门怀疑为中国政府从事间谍活动的女商人爱丽丝·黄(Alice Huang)有过关系。 据“泰晤士报”报道，特朗普去年听取了有关这种关系的简报，但没有采取任何行动。 Alice Huang和Jensen Huang无关，后者是世界上最富有的人之一，也是英伟达的首席执行官在过去的33年里，价值超过4万亿美元。\n\n美国情报机构认为，代表北京的Alice Huang推动Jensen Huang游说特朗普放松对英伟达在中国销售的出口管制，他曾多次公开这样做。 英伟达在一份声明中表示，商业机密和美国国家安全都没有受到损害。\n\n涉及黄的事情和所谓的情报行动可能具有深远的意义英伟达和科技行业已经经历了一段高市场波动期。黄对英伟达的领导，深深地", "body": "Elon Musk和其他金融大亨在给员工的电子邮件中承认此事后，为Jensen Huang辩护\n\n英伟达董事会需要做一些继任规划--敏锐\n\n唐纳德•特朗普(Donald Trump)、埃隆•马斯克(Elon Musk)和知名金融大亨已表示支持陷入困境的英伟达(Nvidia)首席执行官黄延森(Jensen Huang) ，因为这家全球最有价值的芯片公司的负责人面临着一项内部调查，涉及与一名涉嫌中国间谍的\n\n“我有没有和他谈过这件事， ”这位美国总统周日告诉记者。 “我只知道他是个好人，但你永远不知道发生了什么。 我敢肯定，我希望一切都好。 他做了如此令人难以置信的工作。”\n\n“我认为他是一个值得尊敬的人。 我认为他可能有借口， ”特朗普后来补充说，他相信黄将继续担任首席执行官。\n\n黄的辩护人把他的事情说成是个人判断失误，而不是有背叛美国的证据，美国对英伟达可以向中国销售的芯片施加了严格的限制。\n\n自1985年以来一直与妻子Lori结婚的Huang周日在给员工的电子邮件中承认，他有外遇，他将配合内部调查。 英伟达董事会当天发表声明称，该公司正在对有关黄先生是了解国外情报工作。\n\n据《纽约时报》报道，这位芯片大亨据称与美国情报部门怀疑为中国政府从事间谍活动的女商人爱丽丝·黄(Alice Huang)有过关系。 据“泰晤士报”报道，特朗普去年听取了有关这种关系的简报，但没有采取任何行动。 Alice Huang和Jensen Huang无关，后者是世界上最富有的人之一，也是英伟达的首席执行官在过去的33年里，价值超过4万亿美元。\n\n美国情报机构认为，代表北京的Alice Huang推动Jensen Huang游说特朗普放松对英伟达在中国销售的出口管制，他曾多次公开这样做。 英伟达在一份声明中表示，商业机密和美国国家安全都没有受到损害。\n\n涉及黄的事情和所谓的情报行动可能具有深远的意义英伟达和科技行业已经
