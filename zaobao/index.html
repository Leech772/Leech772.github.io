    linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 32%),
    repeating-linear-gradient(90deg,transparent 0 3px,rgba(42,42,40,.018) 3px 4px);
  background-attachment:fixed;
  color:var(--text);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding:0 0 36px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 56px,rgba(42,42,40,.03) 56px 57px),
    repeating-linear-gradient(0deg,transparent 0 56px,rgba(42,42,40,.022) 56px 57px);
  opacity:.7;
}
.wrap,.fs-fixed,#fsTip{position:relative;z-index:1}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:16px 14px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.brand img{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);object-fit:cover;box-shadow:var(--sm);background:var(--card)}
h1{font-size:1.22rem;margin:0;font-weight:700;color:var(--ink);text-align:center;letter-spacing:-.02em;line-height:1.35;
  border-bottom:1px solid rgba(42,42,42,.14);padding-bottom:8px}
.sub{color:var(--muted);font-size:.8rem;margin:0;text-align:center;line-height:1.55;font-weight:450}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counts div{background:var(--card);border:1px solid rgba(200,200,196,.9);border-radius:var(--radius);padding:9px 8px;text-align:center;box-shadow:var(--sm)}
.counts b{display:block;font-size:1.12rem;font-weight:650;color:var(--accent2);letter-spacing:-.02em}
.counts span{font-size:.7rem;color:var(--muted);letter-spacing:.01em}
header.sticky{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(244,244,242,.94) 70%,rgba(244,244,242,.72));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 0 0;margin:0 -2px;border-bottom:1px solid rgba(200,200,196,.55);
}
.langbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px 0 8px}
.langbar .lab{font-size:.72rem;color:var(--muted);font-weight:550}
.pill{border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:.84rem;cursor:pointer;
  background:var(--card);color:var(--text);box-shadow:var(--sm);font-family:inherit;font-weight:500;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s ease}
.pill:active{transform:scale(.985)}
.pill.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 1px 3px rgba(139,26,26,.22)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:.78rem;
  background:var(--card);color:var(--accent2);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap;box-shadow:none}
.tabs button.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
.meta{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;
  color:var(--muted);font-size:.78rem;line-height:1.55;box-shadow:none}
.card{background:var(--card);border:1px solid rgba(200,200,196,.9);border-radius:var(--radius);padding:14px 15px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card + .card{margin-top:10px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.badge{display:inline-block;font-size:.7rem;padding:3px 10px;border-radius:var(--radius);
  background:var(--accent-soft);color:var(--accent2);border:1px solid #e0c8c8;font-weight:550;letter-spacing:.01em}
.badge.ok{background:rgba(47,107,78,.10);color:var(--good);border-color:rgba(47,107,78,.28)}
.badge.warn{background:var(--accent-soft);color:var(--accent2);border-color:#e0c8c8}
.card h2{font-size:1.02rem;margin:0;line-height:1.45;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.card h2.orig{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#3a3a38;font-size:.95rem}
.summary{color:var(--muted);font-size:.88rem;margin:0;line-height:1.55}
.body{margin-top:4px;font-size:.95rem;white-space:pre-wrap;word-break:break-word;line-height:1.65;color:var(--text)}
.body.orig{font-family:Georgia,"Times New Roman",serif;font-size:.92rem;color:#3a3a38}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.72rem;color:var(--muted);margin-top:8px;flex-wrap:wrap;
  padding-top:8px;border-top:1px dashed var(--border)}
a{color:var(--accent);text-decoration:none;font-weight:600}
a:hover{color:var(--accent2)}
.bi-sep{border-top:1px dashed var(--border);margin:8px 0;padding-top:8px}
.note{font-size:.74rem;color:var(--muted);text-align:center;margin:8px 0 24px;line-height:1.7;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--sm)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}
.hidden{display:none !important}
.fs-fixed{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9999;font-weight:600!important;
  background:rgba(139,26,26,.94)!important;color:#fff!important;border:1px solid rgba(255,255,255,.12)!important;
  border-radius:2px;padding:10px 16px!important;font-size:.88rem!important;
  box-shadow:0 4px 14px rgba(26,26,24,.14)!important;letter-spacing:.01em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font-family:inherit;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fs-fixed:active{transform:scale(.98)}
#fsTip{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10000;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);
  display:none;font-size:.84rem;line-height:1.55;color:var(--ink)}
#fsTip.show{display:block}
#fsTip .ok{margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit}
html:fullscreen body,html:-webkit-full-screen body{width:100vw;min-height:100vh}
html.immersive header .sub{display:none}
@media(min-width:760px){
  .wrap{padding-top:20px}
  .fs-fixed{top:18px;right:22px;padding:11px 18px!important}
}
</style>
</head>

const DATA = {"updated": "2026年11月10日 06:57", "papers": [{"key": "nyt_cn", "name": "纽约时报中文网", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "黄仁勋承认出轨，英伟达调查其与疑似中国间谍的关系", "title_zh": "黄仁勋承认出轨，英伟达调查其与疑似中国间谍的关系", "summary_orig": "黄仁勋承认发生婚外情，涉事女性被美国情报部门认定为中国间谍。英伟达称正对黄仁勋展开调查，但表示目前没有理由认为国家安全或公司商业机密受到了损害。 Demetrius Freeman for The New York Times 英伟达首席执行官黄仁勋是人工智能革命中最有影响力的人物之一，也是特朗普总统颇具影响力的盟友。", "summary_zh": "黄仁勋承认发生婚外情，涉事女性被美国情报部门认定为中国间谍。英伟达称正对黄仁勋展开调查，但表示目前没有理由认为国家安全或公司商业机密受到了损害。 Demetrius Freeman for The New York Times 英伟达首席执行官黄仁勋是人工智能革命中最有影响力的人物之一，也是特朗普总统颇具影响力的盟友。", "body_orig": "", "body_zh": "英伟达周日表示，已对公司首席执行官兼联合创始人黄仁勋展开调查。此前，黄仁勋向公司董事会承认，他曾与一名企业高管发生亲密关系，而美国情报部门认定，该女子是 中国间谍 。\n\n这名女子名叫黄乐(音，其英文名为Alice Huang)。美国政府的监控发现，她一直直接向北京提供情报，此后，黄仁勋与她的关系引起了美国政府的关注。这一发现引发了令人不安的种种可能性，因为黄仁勋不仅是人工智能革命中最有影响力的人物之一，也是特朗普总统的 重要盟友 。\n\n黄仁勋在给公司的情况说明中道歉说：“我对妻子不忠。我的行为伤害了她和我们的孩子。我的所作所为没有任何借口。我深感抱歉。”\n\n英伟达 董事会表示 ，“没有理由认为国家安全或英伟达的商业机密受到了损害”，但“董事会的调查将审查所有可获得的信息”。董事会表示，黄仁勋“完全支持此次审查，并承诺予以配合”。董事会没有透露调查的更多细节，也没有说明调查将持续多长时间。\n\n董事会表示，63岁的黄仁勋将在调查期间继续领导公司。作为联合创始人，他在英伟达建立了一套独特的管理架构，掌控公司业务的方方面面，并直接管理约60名向他汇报的员工。\n\n“今天的新闻不会拖慢英伟达的步伐，”公司发言人约翰·里佐说。“黄仁勋将继续不受干扰地履行首席执行官职责，领导英伟达。”\n\n《纽约时报》上个月 报道 ，美国情报机构发现，黄仁勋与一名中国公民建立了密切关系。此人从事芯片采购业务，美国官员认定她正在为北京搜集情报。\n\n这名芯片采购商就是黄乐。据她的个人履历介绍，她曾在中国担任电视记者，之后成为一家总部位于新加坡的数据中心公司的高管。这家公司后来成为英伟达在东南亚最大的客户之一，自2024年6月以来购买了价值超过48亿美元的芯片。\n\n这家公司名为Megaspeed。去年， 《纽约时报》曾报道 ，美国商务部正在调查Megaspeed是否协助中国走私受到出口限制的人工智能芯片，但英伟达此后仍继续与该公司开展业务。\n\n英伟达和黄仁勋最初坚称，他与黄乐的关系没有任何问题，也没有任何不寻常之处。上个月接受 彭博新闻社 采访时，黄仁勋表示，他与黄乐的往来“都与Megaspeed有关，完全正常，没有什么特别之处”。\n\n这段关系和婚外情对黄仁勋来说是罕见的一次行差踏错。\n\n过去三年里，黄仁勋可谓顺风顺水。他领导的芯片公司生产用于构建人工智能系统的关键技术，发展为全球市值最高的企业之一，也成为推动美国经济的数据中心建设热潮的核心力量。特朗普与他结为盟友，还邀请他乘坐“空军一号”总统专机。每逢出席活动，会有大批人群追着他索要签名。他每天穿着的黑色皮夹克也 成了收藏者追捧的物品 。\n\n随着业务蓬勃发展，黄仁勋也让家人进入了公司的核心业务领域。他的儿子斯宾塞担任产品管理总监，在公司的机器人业务中发挥主导作用。女儿麦迪逊是产品营销高级总监，同样参与机器人业务，并负责公司的传播和营销工作。他的女婿尼科·卡普雷斯则在公司的业务拓展团队任职。\n\n黄仁勋曾表示，自己创业成功离不开妻子洛丽的支持。两人于1985年结婚，最初相识时，黄仁勋还是俄勒冈州立大学一名十几岁的工程系学生。当时，在一个有250人的工程实验室里只有三名女生，洛丽就是其中之一。高中曾跳过两级的黄仁勋设法与她分到同一个实验小组，并试图用自己的聪明才智打动她。\n\n“我知道我看起来像个孩子，所以她对我的第一印象是我很聪明，”2024年，黄仁勋在在香港科技大学 谈起 自己职业生涯时说。“我走到她面前说：‘你想看我的作业吗？’然后我向她承诺：‘如果你每周日都和我一起做作业，我保证，你肯定全拿A。’”\n\n黄仁勋还向她承诺，到30岁时他会成为一家公司的首席执行官。1993年，他刚满30岁不久便联合创立了英伟达，兑现了这个承诺。\n\n黄仁勋在播客“ 我是如何打造这一切的 ”中说：“洛丽照顾一切事情，我不记得她曾抱怨过一次。这是她送给我的礼物。”\n\n美国政府一直在调查Megaspeed是否可能将英伟达先进人工智能芯片转运到中国，一年多前开始对黄乐进行监视。在监视过程中，他们发现她与一名被确认为黄仁勋的美国公民有通信。\n\n看过该情报的官员说，他们确信两人之间存在恋爱关系。这削弱了英伟达过去一年向《纽约时报》和其他方面就黄仁勋与黄乐关系性质所作的最初误导性声明。\n\n大约一年前，特朗普被告知美国情报界一直在对黄乐进行电子监视。\n\n今年春天，国务卿鲁比奥 监督起草了一份高度机密备忘录 ，详细说明情报显示黄乐被中国国家安全部招募来针对黄仁勋。该备忘录在今年早些时候总统访华前不久被传阅。\n\n随着美国监视黄乐的新闻曝光，黄仁勋的回旋余地几乎消失。国会希望他作证——很可能是宣誓作证——而有关监视的报道让人更加相信，美国情报部门可能已经知晓他与黄乐关系的性质。\n\n英伟达董事会也面临压力。上个月，马萨诸塞州民主党参议员、负责监督海外芯片销售的参议院银行委员会资深成员伊丽莎白·沃伦在社交媒体帖子中说，黄仁勋和公司董事会“有义务向国会解释”他与这名间谍之间的关系。\n\nMegaspeed成立于2023年，当时一家中国网络游戏公司将其新加坡子公司剥离出来。不久之前，美国政府首次发布对华出售人工智能芯片的广泛禁令。公司成立时，黄乐被列为Megaspeed的董事总经理，后来她自称该公司首席执行官。\n\n中国互联网上基本没有黄乐的背景信息，但根据一份网上简历，她曾在几家中国大型银行工作。根据WireScreen和Sayari平台汇编的公司和贸易记录，以及华盛顿非营利组织高级国防研究中心的分析，她随后加入了一家总部位于上海的基金，该基金与富有投资者和在中国有数据中心项目的科技公司有联系。\n\n该网络中的公司帮助在上海郊外建设了一个大型数据中心，服务于中国公司腾讯。它还通过对中国电子科技集团一家网络安全子公司的投资，与中国军工体系产生了财务联系；中国电子科技集团是中国最大的军事技术制造商之一。\n\n随着Megaspeed的芯片采购不断到来，黄仁勋和黄乐开始共处。2024年6月，在台北一场当地科技贸易展结束后，二人在台北一家酒吧见面。他们与其他人工智能高管一起喝威士忌。一年后，他们与其他高管 在台北一家餐厅用餐 。台湾媒体拍到她亲吻他的脸颊，以及他接受记者采访时她站在他身后的画面。\n\n他们的关系成为华盛顿的关注焦点，此前官员们已经对Megaspeed的大量采购感到警觉。\n\n“这是CCP惯用伎俩的典型手段——也是它为何永远不可信任的又一例证，” 得克萨斯州共和党众议员、众议院国土安全委员会副主席迈克尔·麦考尔 在社交媒体上写道 ，他指的是中国共产党。“美国应立即暂停向中国出口先进的人工智能芯片，直到我们查明此事的真相，并确保我们的国家安全不受损害。”", "body": "英伟达周日表示，已对公司首席执行官兼联合创始人黄仁勋展开调查。此前，黄仁勋向公司董事会承认，他曾与一名企业高管发生亲密关系，而美国情报部门认定，该女子是 中国间谍 。\n\n这名女子名叫黄乐(音，其英文名为Alice Huang)。美国政府的监控发现，她一直直接向北京提供情报，此后，黄仁勋与她的关系引起了美国政府的关注。这一发现引发了令人不安的种种可能性，因为黄仁勋不仅是人工智能革命中最有影响力的人物之一，也是特朗普总统的 重要盟友 。\n\n黄仁勋在给公司的情况说明中道歉说：“我对妻子不忠。我的行为伤害了她和我们的孩子。我的所作所为没有任何借口。我深感抱歉。”\n\n英伟达 董事会表示 ，“没有理由认为国家安全或英伟达的商业机密受到了损害”，但“董事会的调查将审查所有可获得的信息”。董事会表示，黄仁勋“完全支持此次审查，并承诺予以配合”。董事会没有透露调查的更多细节，也没有说明调查将持续多长时间。\n\n董事会表示，63岁的黄仁勋将在调查期间继续领导公司。作为联合创始人，他在英伟达建立了一套独特的管理架构，掌控公司业务的方方面面，并直接管理约60名向他汇报的员工。\n\n“今天的新闻不会拖慢英伟达的 。2024年6月，在台北一场当地科技贸易展结束后，二人在台北一家酒吧见面。他们与其他人工智能高管一起喝威士忌。一年后，他们与其他高管 在台北一家餐厅用餐 。台湾媒体拍到她亲吻他的脸颊，以及他接受记者采访时她站在他身后的画面。\n\n他们的关系成为华盛顿的关注焦点，此前官员们已经对Megaspeed的大量采购感到警觉。\n\n“这是CCP惯用伎俩的典型手段——也是它为何永远不可信任的又一例证，” 得克萨斯州共和党众议员、众议院国土安全委员会副主席迈克尔·麦考尔 在社交媒体上写道 ，他指的是中国共产党。“美国应立即暂停向中国出口先进的人工智能芯片，直到我们查明此事的真相，并确保我们的国家安全不受损害。”", "link": "https://cn.nytimes.com/technology/20261109/nvidia-investigation-jensen-huang-china/?utm_source=RSS", "time": "11月09日 08:18", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "为什么泰国医生“害怕”肯德基", "title_zh": "为什么泰国医生“害怕”肯德基", "summary_orig": "许多泰国医生迷信，在工作时吃肯德基会导致班次极其繁忙。但一项研究发现，吃肯德基并不会导致工作量增加。肯德基诅咒究竟从何而来？医生们为何对此深信不疑？ Lauren DeCicca for The New York Times 在曼谷哇集拉医院工作的外科医生塔纳·坦提南开展了一项研究，测试一项与肯德基有关的流行医学迷信。", "summary_zh": "许多泰国医生迷信，在工作时吃肯德基会导致班次极其繁忙。但一项研究发现，吃肯德基并不会导致工作量增加。肯德基诅咒究竟从何而来？医生们为何对此深信不疑？ Lauren DeCicca for The New York Times 在曼谷哇集拉医院工作的外科医生塔纳·坦提南开展了一项研究，测试一项与肯德基有关的流行医学迷信。", "body_orig": "", "body_zh": "泰国结直肠外科医生塔纳·坦提南从他的医学训练中了解到了许多事情，比如人体消化系统的细节，或是肠癌的发病率。但除此以外，还有一条准则：绝对不要在上班时吃 肯德基 。\n\n大约十年前，他还是医学生的时候，这家美国快餐连锁就已经是泰国医生群体中一个离奇迷信的主题。他们中的许多人深信，在工作时吃肯德基会导致班次极其繁忙，令人难以忍受。\n\n“在某些医院里，这是个十分严肃的迷信，”35岁的塔纳说。“如果你带肯德基来，同事可能会跟你急。”\n\n他最近对这一说法进行了测试。2023年至2024年间，他与当时所在医院——泰国南部博他仑医院的几位同事，针对345个外科班次进行了一项 随机对照试验 。他们将外科医生分为三组：一组吃肯德基，一组吃本土品牌“五星烤鸡”，另一组什么都不吃，随后比较各组患者的病例数和预估失血量等指标。\n\n这项研究于今年早些时候发表在总部位于费城的医学期刊《外科学年鉴开放版》上。研究发现，吃肯德基实际上并不会导致工作量增加。但这也留下了诸多未解之谜：肯德基诅咒究竟从何而来？它又是如何让这个国家最有学养的科学头脑——包括塔纳本人——深信不疑的？\n\n“是的，我仍然相信——大概80%吧，”他说。“如果有人在上班时给我带了肯德基，我会一直放到下班后才吃。”\n\n这种迷信在泰国极为普遍。在这里，佛教与万物有灵论、印度教仪式及中国占星术等其他精神传统相融合，使得当代生活与超自然现象产生了强烈的联结。\n\n“在泰国，迷信并非现代性的对立面，而是与现代性和谐共存，”朱拉隆功大学商学院研究迷信如何影响消费行为的教授提拉努·普萨斯里吉表示。“同一个人可以拥有科学学位，在签合同前查阅黄道吉日，然后戴着护身符去上班。”\n\n无论场合大小，人们总能掺杂一点迷信元素。有时政领域偶尔浮现的臭名昭著的 黑魔法仪式 ，也有按一周每天的幸运色穿衣的流行习俗。去年，当曼谷哇集拉医院（ 塔纳目前在那里就职）附近发生地陷并困住一辆皮卡车时，人们纷纷抢购与 该车车牌号 一致的彩票。\n\n“每家医院都有属于自己的迷信文化，”塔纳说。他还听说有同事在上班时不碰坚果、披萨或咖啡，并且知道至少有一家医院将香蕉列为禁忌，尽管它在其他地方常被视为吉祥食物。\n\n然而，很少有医学迷信能像“肯德基诅咒”这般普遍且持久，这甚至引起了肯德基自身的极大兴趣。\n\n“我们深入分析了数据，结果非常明显，”前不久还担任肯德基泰国区首席营销官的苏海尔·林巴达说。“医院周边餐厅出现了一个明显的趋势，销售额会下降。”\n\n两年前，他将这一诅咒 转化利用 为一场营销活动。尽管拿文化习俗做文章曾让林巴达惹上过麻烦——该公司为农历新年推出的炸鸡味线香就曾广受批评，但这次活动 受到了欢迎。\n\n活动于2024年11月的医生节推出，提供了一种类似净化的仪式：在医院附近的门店里，炸鸡包装上印有“这不是肯德基”之类的标语进行售卖。\n\n对于这个诅咒的由来，林巴达有自己的看法。肯德基在1984年进入泰国，此后便成为该国最普及的快餐连锁店之一，同时也是深夜外卖的先驱。它拥有约1300家门店，数量远超约有240家门店的麦当劳。哪怕是在最偏远的乡村小镇，也很可能至少有一家肯德基。\n\n他认为，这些乡村门店中的某一家可能就是诅咒的发源地。在某个深夜，一份外卖被送到当地一家人手短缺的医院，那里有一位饥肠辘辘的医生正在等待，他并不知道自己即将被如潮水般涌来、令人精神崩溃的病患潮所淹没。\n\n自那时起，这种迷信便衍生出了一系列非常具体的传说。\n\n例如泰国东北部加马拉赛医院34岁的急诊科医生提塔蓬·纳萨安说，大家普遍默认它只适用于像外科或急诊室这样不便离开医院就餐的科室。\n\n她回忆起同事们曾有一次成功将这种迷信派上了用场。那是在外科重症监护室一个异常平静的夜晚，一些想干活的护士担心她们会失去接下来的排班。\n\n“值班麻醉师通过点肯德基和披萨进行了一场召唤病例的仪式，”她说。随后病床果然住满了。不过她补充道：“通常情况下，几乎没有人敢去点它。”\n\n当然，对于其他人而言，提供绿咖喱鸡肉饭等泰国本土化产品的肯德基依然是诱人的美食。在许多医院，患者或其家属有时会买这些东西来犒劳医护人员，但这一举动总会让哇集拉医院42岁的护士贾鲁达·马孟本神经紧绷。\n\n不过她和同事们已经注意到，在过去大概两年里，收到肯德基礼物的情况已经大幅减少。\n\n“我们一直都礼貌地接受这份心意，”贾鲁达说。“但我认为患者家属可能已经从社交媒体上获知了这种迷信。”\n\n提拉努认为，人们对这种厄运的普遍信仰并非反科学，而是泰国医护人员保持精神振奋的一种方式。\n\n“医院工作充满了极大的不确定性，在面对那些本质上不可预测的事物时，‘值班时不吃肯德基’这种共同规则或许能让员工获得些许控制感，”她说。“他们还能形成凝聚力。”\n\n塔纳也抱有类似的看法。他表示，在肯德基诅咒那超自然的外表下，隐藏着更令人清醒的现实问题。\n\n值得注意的是，这种诅咒主要局限于该国的公立医院。那里的医生长期面临工作强度大且薪酬低于私营部门同行的问题，并一直呼吁改善工作条件。\n\n“如果你在私立医院工作，你会希望有更多患者来看病，”塔纳说，因为私立医院医生的收入是与病例数挂钩的。\n\n“我认为肯德基诅咒是恐惧的一种投射，”他说。“我们需要一个替罪羊。”", "body": "泰国结直肠外科医生塔纳·坦提南从他的医学训练中了解到了许多事情，比如人体消化系统的细节，或是肠癌的发病率。但除此以外，还有一条准则：绝对不要在上班时吃 肯德基 。\n\n大约十年前，他还是医学生的时候，这家美国快餐连锁就已经是泰国医生群体中一个离奇迷信的主题。他们中的许多人深信，在工作时吃肯德基会导致班次极其繁忙，令人难以忍受。\n\n“在某些医院里，这是个十分严肃的迷信，”35岁的塔纳说。“如果你带肯德基来，同事可能会跟你急。”\n\n他最近对这一说法进行了测试。2023年至2024年间，他与当时所在医院——泰国南部博他仑医院的几位同事，针对345个外科班次进行了一项 随机对照试验 。他们将外科医生分为三组：一组吃肯德基，一组吃本土品牌“五星烤鸡”，另一组什么都不吃，随后比较各组患者的病例数和预估失血量等指标。\n\n这项研究于今年早些时候发表在总部位于费城的医学期刊《外科学年鉴开放版》上。研究发现，吃肯德基实际上并不会导致工作量增加。但这也留下了诸多未解之谜：肯德基诅咒究竟从何而来？它又是如何让这个国家最有学养的科学头脑——包括塔纳本人——深信不疑的？\n\n“是的，我仍然相信——大概80%吧，”他说。“如果有人在上班时给我带了肯德基，我会一直放到下班后才吃。”\n\n这种迷信在泰国极为普遍。在这里，佛教与万物有灵论、印度教仪式及中国占星术等其他精神传统相融合，使得当代生活与超自然现象产生了强烈的联结。\n\n“在泰国，迷信并非现代性的对立面，而是与现代性和谐共存，”朱拉隆功大学商学院研究迷信如何影响消费行为的教授提拉努·普萨斯里吉表示。“同一个人可以拥有科学学位，在签合同前查阅黄道吉日，然后戴着护身符去上班。”\n\n无论场合大小，人们总能掺杂一点迷信元素。有时政领域偶尔浮现的臭名昭著的 黑魔法仪式 ，也有按一周每天的幸运色穿衣的流行习俗。去年，当曼谷哇集拉医院（ 塔纳目前在那里就职）附近发生地 _orig": "", "body_zh": "1945年初，美国、苏联和英国领导人在克里米亚城市雅尔塔举行会晤，达成了 一项秘密协议 ：作为苏联加入对日作战的交换条件，美英同意给予莫斯科在中国的特殊权益。\n\n“这种大国历史的教训，中国不会忘记的，”上海复旦大学研究中美关系的专家信强说。“都是背着中国，出卖中国的利益。”\n\n八十多年后的今天，北京正在考虑是否主办一场由美国总统特朗普、俄罗斯总统普京和中国领导人习近平参加的三方会晤。\n\n这样的会晤可以彰显中国想成为与美国平起平坐、不可或缺的全球大国的雄心，但也可能重演北京声称反感的那种大国交易。克里姆林宫放风提出举行这样的会晤，在乌克兰引发了担忧：普京可能推动与特朗普达成结束战争的协议，在基辅缺席的情况下决定乌克兰的命运。\n\n中国周三证实，正在与俄罗斯和美国就三国领导人会晤进行磋商，据推测会晤将在本月晚些时候于中国南方城市深圳举行的亚太经合组织峰会期间举行。但这样的会晤是否会举行，目前仍不清楚。\n\n中国对为普京提供与华盛顿就乌克兰问题达成交易的平台持谨慎态度。\n\n这样做将与北京的立场相矛盾：北京认为，和平谈判需要乌克兰和欧洲参与。习近平上周似乎还强调了这一点。\n\n访问北京的德国总统施泰因迈尔 对一家德国广播公司说 ，他在与习近平会晤时，后者明确表示，他认为美国、俄罗斯和中国不会在深圳讨论乌克兰的命运。\n\n“你可以看出他脸上的不悦。他甚至问，这些传言是从哪里来的，”施泰因迈尔说。\n\n“他明确表示，这是欧洲的冲突，欧洲人必须参与谈判，”他补充说。\n\n乌克兰总统弗拉基米尔·泽连斯基也对可能举行的会谈表示保留。据乌克兰国家通讯社 报道 ，他上周说：“我真的希望这不会演变成某种‘雅尔塔2.0、3.0或4.0’式的局面，让各方重新划分势力范围。”\n\n一些中国人认为，第二次世界大战接近尾声时雅尔塔会议达成的秘密交易是一种背叛。当时的中国国民政府受到压力，被迫放弃对今蒙古国领土的主权主张，并给予苏联在中国东北满洲地区的特殊海军、交通运输和商业权益。\n\n如今，如果全球三大核武国家的领导人聚首，将与北京一直试图塑造的形象格格不入：中国一直将自己描绘为弱小国家利益的捍卫者。（事实上，中国在面对菲律宾等较小国家时，并不吝于展示自己的实力。）\n\n“无论普京、习近平和特朗普可能讨论什么，他们会面的画面本身就会引发疑问：这是否意味着某种无视小国利益的大国共治，”华盛顿美利坚大学研究中国共产党历史的学者唐志学(Joseph Torigian)说。\n\n“如果中国人出于某种原因，仍然认为三方会晤值得举行，那确实会很具讽刺意味，”他补充说。\n\n特朗普表示，他希望利用在深圳与习近平和普京举行三方会晤的机会讨论无核化问题。美俄之间最后一项核军控条约已 于今年2月到期 ，而中国正在迅速扩充核武库。\n\n然而，对北京来说，这个话题没有商量余地。 在习近平领导下 ，中国已经放弃奉行数十年的仅维持“ 最低限度威慑 ”的核武库战略，转而大力扩充一个有朝一日可能与华盛顿和莫斯科比肩的核武库，并一直抵制对其核武器发展设定限制。据 斯德哥尔摩国际和平研究所 估计，中国的核弹头数量要少得多，约为620枚，而俄罗斯和美国各自都超过5000枚。\n\n上个月，当被问及中国是否愿意在深圳与美国和俄罗斯讨论无核化问题时，中国外交部发言人毛宁回避了该问题。她表示，华盛顿对核裁军负有首要责任，并补充说，要求中国参与核裁军谈判“不公平、不合理，也不可行”。\n\n不过，中国分析人士认为，北京可能愿意就范围更有限的议题展开讨论。\n\n上海国际问题研究院安全问题专家赵隆表示，中国可能愿意讨论如何降低核冲突风险。\n\n这可能包括改善危机期间的沟通渠道，以及确保即使在人工智能时代，各国仍由人类掌控核决策。中美两国已于2024年在后一问题上达成共识。\n\n曾任职业外交官和白宫国家安全官员、现任职于布鲁金斯学会的何瑞恩(Ryan Hass)认为，尽管有诸多保留，北京仍不太可能拒绝特朗普和普京。\n\n何瑞恩最近访问了北京，会见了一些中国官员和学者，他们有兴趣探讨特朗普希望从三方会晤中得到什么。\n\n这次访问给何瑞恩留下的印象是，北京希望从这场历史性会晤中获得好处，却又担心要承担确保会晤成功的责任。\n\n“习近平通常会避免为结果不确定的重大外交活动承担责任，因此，这场会晤会超出中方的舒适区，”哈斯说。\n\n在许多西方官员看来，中国在影响莫斯科方面发挥着关键作用，因为俄罗斯在外交和经济上已如此依赖北京。2024年，北约指责中国是“俄罗斯对乌克兰战争的 决定性助推者 ”，敦促其停止向俄罗斯运送重建军队所需的“武器部件”和其他技术。\n\n但在北京看来，中国与这场冲突没有多大关系：战争不是中国挑起的，中国也没有向俄罗斯提供军事支持。一些中国分析人士认为，北京最多只能为谈判提供便利，同时尽量避免给外界留下中国能够向克里姆林宫施压的印象。\n\n“如果美俄要把这个问题来谈的话，那么中国不能说你们不要谈，”上海复旦大学中美关系专家宋国友说。\n\n他说，如果三国领导人举行会晤，乌克兰问题又被列入议程，那么中国只会是“一个对话的促进者和平台的提供者，然后呢，也是一个呃居间的见证者”。", "body": "1945年初，美国、苏联和英国领导人在克里米亚城市雅尔塔举行会晤，达成了 一项秘密协议 ：作为苏联加入对日作战的交换条件，美英同意给予莫斯科在中国的特殊权益。\n\n“这种大国历史的教训，中国不会忘记的，”上海复旦大学研究中美关系的专家信强说。“都是背着中国，出卖中国的利益。”\n\n八十多年后的今天，北京正在考虑是否主办一场由美国总统特朗普、俄罗斯总统普京和中国领导人习近平参加的三方会晤。\n\n这样的会晤可以彰显中国想成为与美国平起平坐、不可或缺的全球大国的雄心，但也可能重演北京声称反感的那种大国交易。克里姆林宫放风提出举行这样的会晤，在乌克兰引发了担忧：普京可能推动与特朗普达成结束战争的协议，在基辅缺席的情况下决定乌克兰的命运。\n\n中国周三证实，正在与俄罗斯和美国就三国领导人会晤进行磋商，据推测会晤将在本月晚些时候于中国南方城市深圳举行的亚太经合组织峰会期间举行。但这样的会晤是否会举行，目前仍不清楚。\n\n中国对为普京提供与华盛顿就乌克兰问题达成交易的平台持谨慎态度。\n\n这样做将与北京的立场相矛盾：北京认为，和平谈判需要乌克兰和欧洲参与。习近平上周似乎还强调了这一点。\n\n访问北京的德国总统施泰因迈尔 对一家德国广播公司说 ，他在与习近平会晤时，后者明确表示，他认为美国、俄罗斯和中国不会在深圳讨论乌克兰的命运。\n\n“你可以看出他脸上的不悦。他甚至问，这些传言是从哪里来的，”施泰因迈尔说。\n\n“他明确表示，这是欧洲的冲突，欧洲人必须参与谈判，”他补充说。\n\n乌克兰总统弗拉基米尔·泽连斯基也对可能举行的会谈表示保留。据乌克兰国家通讯社 报道 ，他上周说：“我真的希望这不会演变成某种‘雅尔塔2.0、3.0或4.0’式的局面，让各方重新划分势力范围。”\n\n一些中国人认为，第二次世界大战接近尾声时雅尔塔会议达成的秘密交易是一种背叛。当时的中国国民政府受到压力，被迫放弃对今蒙古国领土的主权主张，并给予苏联在中国东北满洲地区的特殊海军、交通运输和商业权益。\n\n如今，如果全球三大核武国家的领导人聚首，将与北京一直试图塑造的形象格格不入：中国一直将自己描绘为弱小国家利益的捍卫者。（事实上，中国在面对菲律宾等较小国家时，并不吝于展示自己的实力。）\n\n“无论普京、习近平和特朗普可能讨论什么，他们会面的画面本身就会引发疑问：这是否意味着某种无视小国利益的大国共治，”华盛顿美利坚大学研究中国共产党历史的学者唐志学(Joseph Torigian)说。\n\n“如果中国人出于某种原因，仍然认为三方会晤值得举行，那确实会很具讽刺意味，”他补充说。\n\n特朗普表示，他希望利用在深圳与习近平和普京举行三方会晤的机会讨论无核化问题。美俄之间最后一项核军控条约已 于今年2月到期 ，而中国正在迅速扩充核武库。\n\n然而，对北京来说，这个话题没有商量余地。 在习近平领导下 ，中国已经放弃奉行数十年的仅维持“ 最低限度威慑 ”的核武库战略，转而大力扩充一个有朝一日可能与华盛顿和莫斯科比肩的核武库，并一直抵制对其核武器发展设定限制。据 斯德哥尔摩国际和平研究所 估计，中国的核弹头数量要少得多，约为620枚，而俄罗斯和美国各自都超过5000枚。\n\n上个月，当被问及中国是否愿意在深圳与美国和俄罗斯讨论无核化问题时，中国外交部发言人毛宁回避了该问题。她表示，华盛顿对核裁军负有首要责任，并补充说，要求中国参与核裁军谈判“不公平、不合理，也不可行”。\n\n不过，中国分析人士认为，北京可能愿意就范围更有限的议题展开讨论。\n\n上海国际问题研究院安全问题专家赵隆表示，中国可能愿意讨论如何降低核冲突风险。\n\n这可能包括改善危机期间的沟通渠道，以及确保即使在人工智能时代，各国仍由人类掌控核决策。中美两国已于2024年在后一问题上达成共识。\n\n曾任职业外交官和白宫国家安全官员、现任职于布鲁金斯学会的何瑞恩(Ryan Hass)认为，尽管有诸多保留，北京仍不太可能拒绝特朗普和普京。\n\n何瑞恩最近访问了北京，会见了一些中国官员和学者，他们有兴趣探讨特朗普希望从三方会晤中得到什么。\n\n这次访问给何瑞恩留下的印象是，北京希望从这场历史性会晤中获得好处，却又担心要承担确保会晤成功的责任。\n\n“习近平通常会避免为结果不确定的重大外交活动承担责任，因此，这场会晤会超出中方的舒适区，”哈斯说。\n\n在许多西方官员看来，中国在影响莫斯科方面发挥着关键作用，因为俄罗斯在外交和经济上已如此依赖北京。2024年，北约指责中国是“俄罗斯对乌克兰战争的 决定性助推者 ”，敦促其停止向俄罗斯运送重建军队所需的“武器部件”和其他技术。\n\n但在北京看来，中国与这场冲突没有多大关系：战争不是中国挑起的，中国也没有向俄罗斯提供军事支持。一些中国分析人士认为，北京最多只能为谈判提供便利，同时尽量避免给外界留下中国能够向克里姆林宫施压的印象。\n\n“如果美俄要把这个问题来谈的话，那么中国不能说你们不要谈，”上海复旦大学中美关系专家宋国友说。\n\n他说，如果三国领导人举行会晤，乌克兰问题又被列入议程，那么中国只会是“一个对话的促进者和平台的提供者，然后呢，也是一个呃居间的见证者”。", "link": "https://cn.nytimes.com/world/20261109/china-trump-putin-xi-summit/?utm_source=RSS", "time": "11月09日 01:54", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "英伟达先进芯片流向中国“空壳”公司", "title_zh": "英伟达先进芯片流向中国“空壳”公司", "summary_orig": "美国商务部已批准数十家中国公司购买和处理英伟达芯片，但时报调查发现，两家获批企业在中国的登记办公室空置、无人办公，且与被美国政府列入黑名单的公司有关联。 The New York Times 北京的一处高科技企业工业园区。新矩阵公司将该建筑列为其地址，但园区公司名录中并未收录该企业。", "summary_zh": "美国商务部已批准数十家中国公司购买和处理英伟达芯片，但时报调查发现，两家获批企业在中国的登记办公室空置、无人办公，且与被美国政府列入黑名单的公司有关联。 The New York Times 北京的一处高科技企业工业园区。新矩阵公司将该建筑列为其地址，但园区公司名录中并未收录该企业。", "body_orig": "", "body_zh": "在北京西北郊一个最近建成的工业园区里，一家名为新矩阵的公司登记地址空无一人，那是一个空荡荡的灰色房间，天花板上本该装灯的地方垂着电线。\n\n今年早些时候，特朗普政府批准这家中国公司组装英伟达的先进芯片，用于创建人工智能的计算机。特朗普去年年底允许向中国出售这种名为H200的芯片。但在芯片出售之前，美国商务部必须对相关企业进行审查，以评估其是否存在国家安全风险。\n\n新矩阵通过了这项审查。然而，《纽约时报》近期的核查发现，在中国国内，几乎没有证据表明这家公司真实存在，这引发了关于究竟是谁在幕后掌控这家公司的疑问。\n\n关于这家17个月前成立的公司，网上只能找到极少信息。在新矩阵登记地址所在的大楼里，公司名录中没有这家公司。在附近工业园区的物业管理处，一名接待员和一名经理都说没有该公司的记录。\n\n根据中国企业登记记录，新矩阵的所有者与一家知名中国私募股权基金有关联，该基金已于2024年被美国政府列入贸易黑名单。两名审查了公司记录和其他中文信息的分析师表示，他们认为新矩阵可能是与该基金有关公司的幌子。\n\n芯片流向新矩阵似乎是令政府内外技术专家担忧的一种模式的一部分：美国商务部正在批准某些中国公司购买和处理英伟达芯片，而这些公司与此前被列入国家安全相关贸易限制的中国企业有关联。\n\n英伟达的芯片是人工智能数据中心的关键技术，如今也是世界上最抢手的商品之一。它们也是美中经济与地缘政治竞争的核心。\n\n公司记录显示，其他几家获准购买H200芯片或将其组装成服务器的中国公司与被美国政府列入黑名单的公司有关联，或者在中国担任军事承包商运营。\n\n曾在特朗普和拜登政府时期担任白宫国家安全委员会中国事务主任的莉莎·托宾说，这些批准引发了疑问：特朗普政府在监管谁能获得英伟达芯片方面究竟有多严格。\n\n“我有很多担忧，商务部和英伟达都没有进行必要的尽职调查，以确保许可条款得到遵守，”她说。\n\n在拜登政府时期，美国开始更广泛地限制向中国出售人工智能芯片，担心该技术会帮助中国推进军事发展。但特朗普在英伟达首席执行官黄仁勋的游说下放松了部分限制，他在第二任期内与黄仁勋的关系 日益密切 。\n\n去年12月，特朗普 允许英伟达 向中国出售H200——一款较旧但仍性能强大的人工智能芯片，条件是美国政府从销售中抽成。\n\n在一项不同寻常的安排中，特朗普要求这些在台湾组装的芯片在运往中国途中经过美国，以便政府对其价值征收25%的关税。\n\n英伟达目前只向中国出售少量H200芯片。中国政府一直 缓慢批准 本国公司购买，部分原因是它试图推广国产芯片。\n\n尽管中国是人工智能技术的潜在巨大市场，但直接对华销售目前仅占英伟达收入的很小比例。 在截至7月的财季中 ，向位于中国的客户交付H200的出货量不到英伟达数据中心收入的1%。公司还在8月表示，在对本财季度数据中心营收的预估中，并未将对华销售额纳入考量。\n\n但许多中国企业正通过 东南亚的数据中心 获得英伟达芯片，而这些芯片似乎仍是北京关注的焦点。《纽约时报》上个月报道，英伟达的黄仁勋与一名女性关系密切，美国间谍机构 认定她是中国的情报人员 。她所在的公司Megaspeed在东南亚运营数据中心，为中国客户服务，并因涉嫌将一些芯片走私到中国而受到调查。周日， 英伟达表示 ，在黄仁勋向公司董事会承认他与该女性有亲密关系后，公司正在调查黄仁勋与她的关系。\n\n根据中国公司信息网站企查查，今年美国商务部对新矩阵给与批准之时，该公司的注册地址在北京郊区一个用于公司注册的园区，该园区还有数千家其他公司于名义上在此注册。但今年秋天，新矩阵的地址变更为《纽约时报》探访的工业园区那间空办公室。\n\n截至11月6日，新矩阵的网站没有列出任何员工姓名，没有布任何招聘信息，也没有包含关于其历史的信息。但根据数据平台WireScreen，其两名主要所有者出现在一家受制裁的中国私募股权公司及其创始人的关联企业记录中，该创始人名为李斌。\n\n2024年，美国政府将这家名为智路资本的私募股权公司列入 商务部的“实体清单” ，限制其与美国做生意。商务部称，智路资本曾协助中国政府收购拥有芯片技术的战略敏感企业。\n\n李斌同时还担任清华紫光集团董事长，这是一家国有的科技集团。2021年，清华紫光的一家子公司新华三半导体技术有限公司因与中国军方合作而被列入 实体清单 。\n\n新矩阵是第二家获准处理英伟达H200芯片、但其登记地址处似乎没有任何实体办公场所的中国公司。\n\n《纽约时报》于9月 报道 称，另一家名为Maginfra的中国新成立公司也获得了H200芯片的出口许可。与New Matrix类似，Maginfra 获批的身份似乎并非这批芯片的最终买家，而是一家为其他客户将芯片组装进人工智能服务器的代工企业。\n\n但时报记者9月前往Maginfra在中国的注册地址时，发现那里也空无一人。一间上了锁的小房间里摆放着几把椅子和几张空桌子，没有任何标识。该楼层的员工表示从未见过有人使用过这间办公室，大楼的前台接待人员则表示从未听说过Maginfra这家公司。\n\n分析人士认为，Maginfra是浪潮集团(Inspur)的子公司，而浪潮集团的总部就在Maginfra的注册地址附近。美国政府已将浪潮集团列入实体清单，理由是其与中国军方有业务往来。Maginfra和浪潮集团共享人员和专利，且两家公司均有国资背景。\n\n据熟悉审判情况的人士和《纽约时报》看到的文件，其他获准购买英伟达H200芯片许可证的中国公司也通过其公司所有者与军事供应商存在关联。\n\n其中一家名为浙江银盾云科技的公司与云计算巨头润泽智算科技集团有关联，润泽智算曾向军事承包商出售服务。银盾部分业务在润泽拥有的数据中心运营，其几名高管是润泽创始人的家庭成员。\n\n润泽是河北省国防部门运营的一个卫星项目的云计算提供商，该公司在其网站上称该项目服务于“国防发展”的战略需求。它还在2016年成立了一家子公司，专注于为中国政府和军方提供量子通信。该子公司部分股权由一家公司拥有，美国因该公司为中国军队采购美国物品，已于2021年将其列入 实体清单 。\n\n另一家获准购买H200芯片的公司上海嘉唐源自一家名为大唐电信的国有企业。大唐电信是一家向中国军方提供技术的芯片制造商。大唐由中国电信科学技术研究院控制，这是一家为中国军方开发密码技术的国有企业。\n\n上海嘉唐、银盾云科技和Maginfra没有回应置评请求。", "body": "在北京西北郊一个最近建成的工业园区里，一家名为新矩阵的公司登记地址空无一人，那是一个空荡荡的灰色房间，天花板上本该装灯的地方垂着电线。\n\n今年早些时候，特朗普政府批准这家中国公司组装英伟达的先进芯片，用于创建人工智能的计算机。特朗普去年年底允许向中国出售这种名为H200的芯片。但在芯片出售之前，美国商务部必须对相关企业进行审查，以评估其是否存在国家安全风险。\n\n新矩阵通过了这项审查。然而，《纽约时报》近期的核查发现，在中国国内，几乎没有证据表明这家公司真实存在，这引发了关于究竟是谁在幕后掌控这家公司的疑问。\n\n关于这家17个月前成立的公司，网上只能找到极少信息。在新矩阵登记地址所在的大楼里，公司名录中没有这家公司。在附近工业园区的物业管理处，一名接待员和一名经理都说没有该公司的记录。\n\n根据中国企业登记记录，新矩阵的所有者与一家知名中国私募股权基金有关联，该基金已于2024年被美国政府列入贸易黑名单。两名审查了公司记录和其他中文信息的分析师表示，他们认为新矩阵可能是与该基金有关公司的幌子。\n\n芯片流向新矩阵似乎是令政府内外技术专家担忧的一种模式的一部分：美国商务部正在批准某些中国公司购买和处理英伟达芯片，而这些公司与此前被列入国家安全相关贸易限制的中国企业有关联。\n\n英伟达的芯片是人工智能数据中心的关键技术，如今也是世界上最抢手的商品之一。它们也是美中经济与地缘政治竞争的核心。\n\n公司记录显示，其他几家获准购买H200芯片或将其组装成服务器的中国公司与被美国政府列入黑名单的公司有关联，或者在中国担任军事承包商运营。\n\n曾在特朗普和拜登政府时期担任白宫国家安全委员会中国事务主任的莉莎·托宾说，这些批准引发了疑问：特朗普政府在监管谁能获得英伟达芯片方面究竟有多严格。\n\n“我有很多担忧，商务部和英伟达都没有进行必要的尽职调查，以确保许可条款得到遵守，”她说。\n\n在拜登政府时期，美国开始更广泛地限制向中国出售人工智能芯片，担心该技术会帮助中国推进军事发展。但特朗普在英伟达首席执行官黄仁勋的游说下放松了部分限制，他在第二任期内与黄仁勋的关系 日益密切 。\n\n去年12月，特朗普 允许英伟达 向中国出售H200——一款较旧但仍性能强大的人工智能芯片，条件是美国政府从销售中抽成。\n\n在一项不同寻常的安排中，特朗普要求这些在台湾组装的芯片在运往中国途中经过美国，以便政府对其价值征收25%的关税。\n\n英伟达目前只向中国出售少量H200芯片。中国政府一直 缓慢批准 本国公司购买，部分原因是它试图推广国产芯片。\n\n尽管中国是人工智能技术的潜在巨大市场，但直接对华销售目前仅占英伟达收入的很小比例。 在截至7月的财季中 ，向位于中国的客户交付H200的出货量不到英伟达数据中心收入的1%。公司还在8月表示，在对本财季度数据中心营收的预估中，并未将对华销售额纳入考量。\n\n但许多中国企业正通过 东南亚的数据中心 获得英伟达芯片，而这些芯片似乎仍是北京关注的焦点。《纽约时报》上个月报道，英伟达的黄仁勋与一名女性关系密切，美国间谍机构 认定她是中国的情报人员 。她所在的公司Megaspeed在东南亚运营数据中心，为中国客户服务，并因涉嫌将一些芯片走私到中国而受到调查。周日， 英伟达表示 ，在黄仁勋向公司董事会承认他与该女性有亲密关系后，公司正在调查黄仁勋与她的关系。\n\n根据中国公司信息网站企查查，今年美国商务部对新矩阵给与批准之时，该公司的注册地址在北京郊区一个用于公司注册的园区，该园区还有数千家其他公司于名义上在此注册。但今年秋天，新矩阵的地址变更为《纽约时报》探访的工业园区那间空办公室。\n\n截至11月6日，新矩阵的网站没有列出任何员工姓名，没有布任何招聘信息，也没有包含关于其历史的信息。但根据数据平台WireScreen，其两名主要所有者出现在一家受制裁的中国私募股权公司及其创始人的关联企业记录中，该创始人名为李斌。\n\n2024年，美国政府将这家名为智路资本的私募股权公司列入 商务部的“实体清单” ，限制其与美国做生意。商务部称，智路资本曾协助中国政府收购拥有芯片技术的战略敏感企业。\n\n李斌同时还担任清华紫光集团董事长，这是一家国有的科技集团。2021年，清华紫光的一家子公司新华三半导体技术有限公司因与中国军方合作而被列入 实体清单 。\n\n新矩阵是第二家获准处理英伟达H200芯片、但其登记地址处似乎没有任何实体办公场所的中国公司。\n\n《纽约时报》于9月 报道 称，另一家名为Maginfra的中国新成立公司也获得了H200芯片的出口许可。与New Matrix类似，Maginfra 获批的身份似乎并非这批芯片的最终买家，而是一家为其他客户将芯片组装进人工智能服务器的代工企业。\n\n但时报记者9月前往Maginfra在中国的注册地址时，发现那里也空无一人。一间上了锁的小房间里摆放着几把椅子和几张空桌子，没有任何标识。该楼层的员工表示从未见过有人使用过这间办公室，大楼的前台接待人员则表示从未听说过Maginfra这家公司。\n\n分析人士认为，Maginfra是浪潮集团(Inspur)的子公司，而浪潮集团的总部就在Maginfra的注册地址附近。美国政府已将浪潮集团列入实体清单，理由是其与中国军方有业务往来。Maginfra和浪潮集团共享人员和专利，且两家公司均有国资背景。\n\n据熟悉审判情况的人士和《纽约时报》看到的文件，其他获准购买英伟达H200芯片许可证的中国公司也通过其公司所有者与军事供应商存在关联。\n\n其中一家名为浙江银盾云科技的公司与云计算巨头润泽智算科技集团有关联，润泽智算曾向军事承包商出售服务。银盾部分业务在润泽拥有的数据中心运营，其几名高管是润泽创始人的家庭成员。\n\n润泽是河北省国防部门运营的一个卫星项目的云计算提供商，该公司在其网站上称该项目服务于“国防发展”的战略需求。它还在2016年成立了一家子公司，专注于为中国政府和军方提供量子通信。该子公司部分股权由一家公司拥有，美国因该公司为中国军队采购美国物品，已于2021年将其列入 实体清单 。\n\n另一家获准购买H200芯片的公司上海嘉唐源自一家名为大唐电信的国有企业。大唐电信是一家向中国军方提供技术的芯片制造商。大唐由中国电信科学技术研究院控制，这是一家为中国军方开发密码技术的国有企业。\n\n上海嘉唐、银盾云科技和Maginfra没有回应置评请求。", "link": "https://cn.nytimes.com/business/20261109/nvidia-chips-chinese-firms/?utm_source=RSS", "time": "11月09日 01:43", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "接近黄仁勋的女间谍由中国国安部招募", "title_zh": "接近黄仁勋的女间谍由中国国安部招募", "summary_orig": "一份在特朗普政府高级决策官员之间传阅的备忘录援引情报称，与黄仁勋关系密切的黄乐由中国国家安全部招募，其行动目的包括促使英伟达推动向中国出售先进芯片。 Manuel Orbegozo for The New York Times 英伟达首席执行官黄仁勋是特朗普总统颇具影响力的盟友，也是全球围绕人工智能主导地位的激烈竞争中的关键人物。", "summary_zh": "一份在特朗普政府高级决策官员之间传阅的备忘录援引情报称，与黄仁勋关系密切的黄乐由中国国家安全部招募，其行动目的包括促使英伟达推动向中国出售先进芯片。 Manuel Orbegozo for The New York Times 英伟达首席执行官黄仁勋是特朗普总统颇具影响力的盟友，也是全球围绕人工智能主导地位的激烈竞争中的关键人物。", "body_orig": "", "body_zh": "据听取过相关情报简报的人士透露，今年春天，一份在特朗普政府高级决策官员之间传阅的备忘录援引情报称，一名与英伟达首席执行官关系密切的中国女商人是中国国家安全部的间谍。\n\n知情人士称，这名女商人叫黄乐(Alice Huang)，她被招募来 搜集英伟达首席执行官黄仁勋的情报 。此举是中国最高情报机构的一项行动，目的是进一步了解美国的人工智能芯片，并谋求影响英伟达，促使该公司推动向中国出售其最先进的芯片。\n\n黄仁勋是特朗普总统 有影响力的盟友 ，也是全球关于人工智能主导地位的激烈竞争的关键人物。英伟达的先进芯片在世界各地大受欢迎，公司的增长也成为过去几年推动股市上涨的重要力量。\n\n这份备忘录的存在以及美国官员认定黄乐直接为中国主要情报机构工作的结论此前均未见报道。这些新披露的信息为中国长期以来从事工业间谍活动的一个尤为大胆的案例提供了重要的新细节。\n\n中国为何对黄仁勋感兴趣、北京希望通过让一名情报人员与他建立密切关系达到什么目的一直是美国情报机构关注的重点。这些问题现在也引起了国会的兴趣。周四， 众议院三个重要委员会的共和党领导人要求 黄仁勋在本月晚些时候出席一场闭门简报会，就他与黄乐的往来情况给出说明。\n\n《纽约时报》上周报道，黄仁勋是中国一项情报行动的目标，美国情报机构已对身为中国公民的黄乐实施了至少一年的电子监控。《纽约时报》还报道，特朗普去年曾听取有关黄仁勋与黄乐关系的简报，但决定不采取任何行动。\n\n见过黄乐的人说，她英语流利，与人工智能芯片行业的最高层保持着联系，包括黄仁勋和技嘉科技(Gigabyte)的领导人，技嘉科技是英伟达超级计算机的主要组装商之一。黄乐曾出席行业会议和高管私人晚宴。\n\n目前不清楚黄乐第一次见到英伟达领导人是什么时候。2024年，两人在台北一家酒吧合影前后，她的公司 Megaspeed开始采购价值数十亿美元 的先进人工智能微芯片。\n\n在许多业内人士看来，Megaspeed手握雄厚资金突然大举进军人工智能领域令人颇感意外。\n\n黄乐与一个集中在上海和浙江省的企业及投资者网络存在联系。这个网络利用与上海地方官员的关系，积极推动业务从手机游戏向数据中心扩张。数据中心提供人工智能运行所需的算力。\n\nMegaspeed一直在东南亚建设数据中心，然后将算力出租给中国互联网巨头阿里巴巴，使中国得以通过一条间接渠道使用英伟达的先进芯片。美国限制英伟达直接向中国销售这些芯片。\n\n除了地方关系，这个企业网络还通过投资中国电子科技集团旗下的一家网络安全子公司与中国军工体系存在财务联系。中国电子科技集团是中国最大的军事技术制造商之一。\n\n中国政府已制定目标，要在2030年前超越美国，成为全球人工智能技术的领导者。中国政府内部负责国家安全的部门日益重视人工智能，其中就包括招募黄乐的情报机构。\n\n中国国家安全部曾经是一个不起眼的边缘部门。但习近平2012年成为中国领导人后开始加大对该机构的投入。如今，国安部的规模已是美国中央情报局的数倍，既搜集人力情报，也截获电子通信信息，同时还开展反间谍行动。\n\n曾任美国中央情报局反间谍分析师的彼得·马蒂斯表示，中国的情报机构已将技术列为工作重点，认为技术是“争夺全球经济主导地位的关键战场”。\n\n“他们关注科技领域正在发生的变化、正在开发的技术有哪些具体规格，以及如何影响与这些技术相关的决策，”现任国家安全智库詹姆斯敦基金会主席的马蒂斯说。“黄仁勋正是他们希望施加影响的人，因为他拥有巨大的影响力，而且身处一项足以改变世界的技术的关键位置。”\n\n英伟达发言人约翰·里佐表示，公司不会与客户分享机密信息，客户也不会要求英伟达向美国政府施压，改变对华芯片销售政策。\n\n他还说，中国政府“一直在中国推广包括华为在内的本土替代产品，并严格限制进口我们的数据中心产品”。\n\n里佐一直坚称，黄仁勋与黄乐的往来“并无异常”，与他同英伟达众多客户举行的其他会面没有区别。\n\n中国驻美国大使馆发言人刘畅表示，《纽约时报》的报道“毫无根据”，“纯属对中国的污蔑”。记者近日多次尝试联系黄乐请其置评，但均未得到回应。里佐此前表示，黄仁勋与黄乐的往来“并无异常”，而且黄仁勋每年都会与数千名同英伟达有业务往来的高管交谈。\n\n过去几年里，黄仁勋始终坚定主张美国政府应允许芯片制造商向中国销售人工智能技术。他认为，这样做可以为中国科技巨头华为制造竞争，从而减缓其人工智能技术的发展。\n\n2025年，他说服特朗普撤销 对华销售人工智能芯片的禁令 ， 允许英伟达向中国出售 一款性能较低的芯片。后来，他又与特朗普 达成协议 ，允许公司向中国销售其性能第二强的芯片，美国政府则从销售额中抽取25%。此后，特朗普还 考虑过允许英伟达 向中国出售其最新的Blackwell芯片，但最终放弃了这一想法。\n\n今年5月，黄仁勋 在一场投资者会议上表示 ，中国不应获得英伟达最先进的技术，例如Blackwell芯片或即将推出的Rubin芯片。他说，美国应该“最先拿到、拿到最多、拿到最好的技术，但与此同时，所有美国公司都应该参与全球竞争”。\n\n中国国家安全部成立于1983年，一直以来未能赢得国家领导层的信任。多年来，中国人民解放军的间谍和网络黑客部门一直被视为北京主要的情报搜集力量。\n\n据研究人员和美国官员称，2015年北京与华盛顿 达成限制网络行动的协议 后，国家安全部承担了更多中国的间谍活动。此后数年，美国司法部指控 与国家安全部有关联的黑客 试图窃取美国技术，并渗透美国的网络。\n\n到2023年，国家安全部已 发展成为美国中央情报局的竞争对手 ，并开始利用人工智能筛选情报目标、建立目标画像。该机构通过大规模招募扩大了间谍网络，还利用增加的预算，协助习近平实现挑战美国主导地位的雄心。\n\n国家安全部还利用与多家中国公司的关系来扩展其在网络黑客、间谍活动和 信息行动 方面的工作。据估计，该机构拥有数十万名特工，远远超过美国反间谍人员的数量。\n\n国家安全部在很大程度上仍继续在幕后运作，但在现任部长陈一新的领导下，它在中国社会生活中也扮演了更加公开的角色。2023年，该机构开设了一个微信公众号，主要用于国内宣传，并鼓励中国公民举报疑似外国间谍的人员。该公众号还被用来攻击美国，称其抱有所谓的 冷战思维 。\n\n陈一新非常熟悉黄乐从事商业活动的华东地区。他是浙江人，在漫长的职业生涯中，大部分时间都在为该省的中共党组织工作。习近平在2000年代初主政浙江期间，陈一新曾在其手下任职。政治分析人士称两人关系密切。\n\n陈一新一直直言不讳地谈论 人工智能对中国共产党构成的风险 。在9月发表于官方杂志《中国网信》的一篇文章中，他说中国需要加强对人工智能的控制，以维护国内政治稳定、防范日益复杂的网络攻击，并在军事领域与美国竞争。他表示，算法将帮助各国“赢得战场主动权”。", "body": "据听取过相关情报简报的人士透露，今年春天，一份在特朗普政府高级决策官员之间传阅的备忘录援引情报称，一名与英伟达首席执行官关系密切的中国女商人是中国国家安全部的间谍。\n\n知情人士称 先拿到、拿到最多、拿到最好的技术，但与此同时，所有美国公司都应该参与全球竞争”。\n\n中国国家安全部成立于1983年，一直以来未能赢得国家领导层的信任。多年来，中国人民解放军的间谍和网络黑客部门一直被视为北京主要的情报搜集力量。\n\n据研究人员和美国官员称，2015年北京与华盛顿 达成限制网络行动的协议 后，国家安全部承担了更多中国的间谍活动。此后数年，美国司法部指控 与国家安全部有关联的黑客 试图窃取美国技术，并渗透美国的网络。\n\n到2023年，国家安全部已 发展成为美国中央情报局的竞争对手 ，并开始利用人工智能筛选情报目标、建立目标画像。该机构通过大规模招募扩大了间谍网络，还利用增加的预算，协助习近平实现挑战美国主导地位的雄心。\n\n国家安全部还利用与多家中国公司的关系来扩展其在网络黑客、间谍活动和 信息行动 方面的工作。据估计，该机构拥有数十万名特工，远远超过美国反间谍人员的数量。\n\n国家安全部在很大程度上仍继续在幕后运作，但在现任部长陈一新的领导下，它在中国社会生活中也扮演了更加公开的角色。2023年，该机构开设了一个微信公众号，主要用于国内宣传，并鼓励中国公民举报疑似外国间谍的人员。该公众号还被用来攻击美国，称其抱有所谓的 冷战思维 。\n\n陈一新非常熟悉黄乐从事商业活动的华东地区。他是浙江人，在漫长的职业生涯中，大部分时间都在为该省的中共党组织工作。习近平在2000年代初主政浙江期间，陈一新曾在其手下任职。政治分析人士称两人关系密切。\n\n陈一新一直直言不讳地谈论 人工智能对中国共产党构成的风险 。在9月发表于官方杂志《中国网信》的一篇文章中，他说中国需要加强对人工智能的控制，以维护国内政治稳定、防范日益复杂的网络攻击，并在军事领域与美国竞争。他表示，算法将帮助各国“赢得战场主动权”。", "link": "https://cn.nytimes.com/usa/20261109/chinese-spy-agency-nvidia-jensen-huang/?utm_source=RSS", "time": "11月09日 12:48", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "鲁比奥曾对黄仁勋与中国间谍的关系提出警告", "title_zh": "鲁比奥曾对黄仁勋与中国间谍的关系提出警告", "summary_orig": "知情人士表示，鲁比奥曾向政府高层发出警告，指出黄仁勋与一名中国间谍关系密切。今年5月特朗普访华前，黄仁勋最初未被列入陪同高管名单中，但随后获得特朗普邀请。 Lisi Niesner/Reuters 今年春天，一份备忘录在特朗普政府高层官员中传阅，警告称英伟达首席执行官黄仁勋与一名中国间谍关系密切。", "summary_zh": "知情人士表示，鲁比奥曾向政府高层发出警告，指出黄仁勋与一名中国间谍关系密切。今年5月特朗普访华前，黄仁勋最初未被列入陪同高管名单中，但随后获得特朗普邀请。 Lisi Niesner/Reuters 今年春天，一份备忘录在特朗普政府高层官员中传阅，警告称英伟达首席执行官黄仁勋与一名中国间谍关系密切。", "body_orig": "", "body_zh": "多位听取了相关简报的人士表示，今年春天，国务卿马尔科·鲁比奥 监督起草了 一份高度机密的备忘录 ，向特朗普政府高层发出警告，指出英伟达首席执行官黄仁勋与一名中国间谍关系密切。\n\n该文件基于对中国公民黄乐（音，英文名Alice Huang)进行电子监控所获取的机密情报。她是一家新加坡公司高管，该公司当时正采购英伟达的先进人工智能芯片，并因涉嫌将这些芯片非法走私至中国而接受调查。美国官员已得出结论，黄女士与这位英伟达掌门人（两人无亲属关系）关系密切，且她已被中国最高情报机构国家安全部招募为间谍。\n\n鲁比奥参与向政府官员通报情况一事此前未被报道。这凸显出高级官员已经知晓这段关系及对间谍活动的担忧，尽管黄仁勋作为AI爆炸性增长的一个关键人物，在相关政策上至今仍能对特朗普施加重要影响力。\n\n黄仁勋一直反对对最先进人工智能芯片出口实施更严格监管，并积极推动将除最新研发技术以外的所有技术出售给中国。在全球争夺人工智能主导权的角逐中，中国是美国的主要竞争对手。\n\n周日，英伟达表示，在黄仁勋 承认曾与黄女士有亲密关系后，公司正对他 展开调查 ，不过该公司也表示“没有理由相信国家安全或英伟达的机密遭到了泄露”。\n\n“我对妻子不忠，”他说，“我的行为伤害了她和我们的孩子。我的所作所为没有任何借口。我深表歉意。”\n\n美国国务院发言人及白宫女发言人均拒绝置评。\n\n听取了简报的人士称，在特朗普5月访华前，鲁比奥的备忘录被分发给了拥有高级别安全权限的政府官员。因讨论敏感材料，这些人士要求匿名。\n\n尽管是人工智能领域的先驱，也是全球最具价值公司之一的掌门人，但黄仁勋最初并未被列入受邀陪同特朗普访华的主要商业和科技高管名单中。目前尚不清楚这一决定是否与该备忘录有关。听取了简报的人士表示，那时政府内部已有一些人对 黄仁勋影响政策的能力感到担忧—— 总统对人工智能仅实施了轻度的监管 。\n\n看到媒体关于黄仁勋 缺席代表团的报道后，特朗普总统要求他在阿拉斯加中转期间与“空军一号”会合， 以此加入此次行程 。总统起草了一篇社交媒体帖子，称很荣幸能有“伟大的黄仁勋”和其他商业领袖“前往伟大的中国，在那里我将请求杰出非凡的领导人习近平主席‘开放’中国，以便这些才华横溢的人能够施展他们的魔力。”\n\n《纽约时报》 上个月报道 称，特朗普在大约一年前曾听取简报，得知美国情报界对黄女士进行了电子监控，并认为她是效力于中国情报机构的特工。监控显示黄女士与一名美国公民关系密切。 当官员们要求“揭示”该美国公民的姓名时（美国人的身份通常受到保护以免受涉外情报监控），结果显示此人正是英伟达首席执行官。\n\n总统当时选择不采取任何行动。他一直将英伟达的芯片视为美国在人工智能领域对华竞争中不可或缺的一部分，并认为英伟达的成功是维持股市强劲势头的关键。\n\n曾与黄乐会面的人士透露，她英语流利，并与人工智能芯片行业的最高层高管保持着关系，其中包括黄仁勋以及英伟达超级计算机顶级组装商之一技嘉的领导人。\n\n目前尚不清楚黄乐是何时结识这位英伟达领导人的。2024年，大约在他们两人与其他行业高管在台北一家酒吧被拍到合影的同时，她的公司 Megaspeed开始了价值数十亿美元的 先进人工智能微芯片采购计划。\n\n英伟达高管表示，黄仁勋与黄女士的互动“并不反常或出人意料”，且与他同英伟达众多客户中任何一位会面的情况一致。该公司还表示，像Megaspeed这样的客户不会接触到机密商业信息。\n\n近年来，Megaspeed尽管实质上只有一个门面办公室，在当地几乎没有业务足迹，却采购了价值20亿美元的英伟达产品。Megaspeed在东南亚建设数据中心，将其算力出租给中国互联网巨头阿里巴巴。美国官员怀疑，Megaspeed一直在协助将受限的先进英伟达芯片走私至中国。", "body": "多位听取了相关简报的人士表示，今年春天，国务卿马尔科·鲁比奥 监督起草了 一份高度机密的备忘录 ，向特朗普政府高层发出警告，指出英伟达首席执行官黄仁勋与一名中国间谍关系密切。\n\n该文件基于对中国公民黄乐（音，英文名Alice Huang)进行电子监控所获取的机密情报。她是一家新加坡公司高管，该公司当时正采购英伟达的先进人工智能芯片，并因涉嫌将这些芯片非法走私至中国而接受调查。美国官员已得出结论，黄女士与这位英伟达掌门人（两人无亲属关系）关系密切，且她已被中国最高情报机构国家安全部招募为间谍。\n\n鲁比奥参与向政府官员通报情况一事此前未被报道。这凸显出高级官员已经知晓这段关系及对间谍活动的担忧，尽管黄仁勋作为AI爆炸性增长的一个关键人物，在相关政策上至今仍能对特朗普施加重要影响力。\n\n黄仁勋一直反对对最先进人工智能芯片出口实施更严格监管，并积极推动将除最新研发技术以外的所有技术出售给中国。在全球争夺人工智能主导权的角逐中，中国是美国的主要竞争对手。\n\n周日，英伟达表示，在黄仁勋 承认曾与黄女士有亲密关系后，公司正对他 展开调查 ，不过该公司也表示“没有理由相信国家安全或英伟达的机密遭到了泄露”。\n\n“我对妻子不忠，”他说，“我的行为伤害了她和我们的孩子。我的所作所为没有任何借口。我深表歉意。”\n\n美国国务院发言人及白宫女发言人均拒绝置评。\n\n听取了简报的人士称，在特朗普5月访华前，鲁比奥的备忘录被分发给了拥有高级别安全权限的政府官员。因讨论敏感材料，这些人士要求匿名。\n\n尽管是人工智能领域的先驱，也是全球最具价值公司之一的掌门人，但黄仁勋最初并未被列入受邀陪同特朗普访华的主要商业和科技高管名单中。目前尚不清楚这一决定是否与该备忘录有关。听取了简报的人士表示，那时政府内部已有一些人对 黄仁勋影响政策的能力感到担忧—— 总统对人工智能仅实施了轻度的监管 。\n\n看到媒体关于黄仁勋 缺席代表团的报道后，特朗普总统要求他在阿拉斯加中转期间与“空军一号”会合， 以此加入此次行程 。总统起草了一篇社交媒体帖子，称很荣幸能有“伟大的黄仁勋”和其他商业领袖“前往伟大的中国，在那里我将请求杰出非凡的领导人习近平主席‘开放’中国，以便这些才华横溢的人能够施展他们的魔力。”\n\n《纽约时报》 上个月报道 称，特朗普在大约一年前
