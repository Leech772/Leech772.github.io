th “dignity and respect” as the company moves ahead with layoff notifications beginning in December.\n\nBoeing executives had previously signaled slower plans to raise plane output, saying in a late October conference call the company would no longer meet its target for 2026 deliveries and that it had pushed back the timeframe for lifting 737 Max production to 52 from 47 until the second half of 2027.\n\nRaising 737 Max output has been viewed by investors as central to revenue and profit growth after a long period of financial losses due to safety problems, including two deadly Max crashes in 2018 and 2019.\n\n“We’re making progress, but we still have more work to do, and I’m expecting it’ll take us into next year to get fully stable at this rate,” CEO Kelly Ortberg said in October.\n\nOrtberg cited the need for greater predictability in wing production and with the production of fuselages at its Kansas operation.", "body_zh": "公司将通过裁员和自然减员来削减工作岗位，因为它缓解了增加喷气式飞机生产的步伐\n\n波音周一表示，该公司将削减约5 ％的商用飞机员工，因为它放缓了增加喷气式飞机生产的步伐。\n\n该公司将通过裁员和减员相结合的方式来消除这些职位，因为增加速度较慢，以“为我们的工厂和供应链合作伙伴提供额外的时间来实现稳定”，这是波音商务总监斯蒂芬妮·波普（ Stephanie Pope ）发给员工的一封信。\n\n她补充说： “调整我们的生产计划和减少飞机产量使我们处于超员状态。”\n\nPope称赞该团队改进了今年美国737 Max 7和737 Max 10认证的运营。\n\n“虽然我们取得了重大进展，但我们还没有完全恢复，”教皇说，他承诺以“尊严和尊重”，因为该公司从12月开始进行裁员通知。\n\n波音高管此前曾表示，提高飞机产量的计划将放缓，并在10月下旬的电话会议上表示，该公司将不再达到2026年交付的目标，并将将737 Max产量从47架提高到52架的时间表推迟到2027年下半年。\n\n提高737最大产量被投资者视为核心由于安全问题（包括2018年和2019年两次致命的Max崩溃）造成的长期财务损失后，收入和利润增长。\n\n首席执行官凯利·奥特伯格（ Kelly Ortberg ）在10月份表示： “我们正在取得进展，但我们还有更多的工作要做，预计明年我们将以这种速度完全稳定下来。”\n\nOrtberg提到需要提高机翼生产的可预测性，并在其堪萨斯州的运营中生产机身开", "body": "公司将通过裁员和自然减员来削减工作岗位，因为它缓解了增加喷气式飞机生产的步伐\n\n波音周一表示，该公司将削减约5 ％的商用飞机员工，因为它放缓了增加喷气式飞机生产的步伐。\n\n该公司将通过裁员和减员相结合的方式来消除这些职位，因为增加速度较慢，以“为我们的工厂和供应链合作伙伴提供额外的时间来实现稳定”，这是波音商务总监斯蒂芬妮·波普（ Stephanie Pope ）发给员工的一封信。\n\n她补充说： “调整我们的生产计划和减少飞机产量使我们处于超员状态。”\n\nPope称赞该团队改进了今年美国737 Max 7和737 Max 10认证的运营。\n\n“虽然我们取得了重大进展，但我们还没有完全恢复，”教皇说，他承诺以“尊严和尊重”，因为该公司从12月开始进行裁员通知。\n\n波音高管此前曾表示，提高飞机产量的计划将放缓，并在10月下旬的电话会议上表示，该公司将不再达到2026年交付的目标，并将将737 Max产量从47架提高到52架的时间表推迟到2027年下半年。\n\n提高737最大产量被投资者视为核心由于安全问题（包括2018年和2019年两次致命的Max崩溃）造成的长期财务损失后，收入和利润增长。\n\n首席执行官凯利·奥特伯格（ Kelly Ortberg ）在10月份表示： “我们正在取得进展，但我们还有更多的工作要做，预计明年我们将以这种速度完全稳定下来。”\n\nOrtberg提到需要提高机翼生产的可预测性，并在其堪萨斯州的运营中生产机身开", "link": "https://www.theguardian.com/business/2026/nov/09/boeing-to-cut-commercial-plane-workforce", "time": "11月10日 03:11", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "EU sues IBM and two European firms over troubled entry/exit border system", "title_zh": "欧盟起诉IBM和两家欧洲公司陷入困境的出入境边境系统", "summary_orig": "Lawsuit filed last year against IBM, Atos and Leonardo after delays to delivery to troubled new system The EU has filed a lawsuit against IBM and two other companies involved in its troubled border-management system, an internal document has revealed. The bloc’s IT agency, EU-Lisa, filed a case last year against IBM, the French IT company Atos and Italian defence contractor Leonardo, the three members of a consortium to implement and maintain the EU’s entry/exit system , which was launched in October 2025. Continue reading...", "summary_zh": "一份内部文件显示，欧盟去年对IBM、Atos和莱昂纳多提起诉讼，此前他们推迟了向陷入困境的新系统的交付。欧盟已经对IBM和另外两家涉及其陷入困境的边境管理系统的公司提起诉讼。该集团的IT机构EU-Lisa去年对IBM、法国IT公司Atos和意大利国防承包商Leonardo提起诉讼，后者是一个财团的三名成员，负责实施和维护欧盟的入境/出境系统，于2025年10月启动。继续阅读...", "body_orig": "Lawsuit filed last year against IBM, Atos and Leonardo after delays to delivery to troubled new system\n\nThe EU has filed a lawsuit against IBM and two other companies involved in its troubled border-management system, an internal document has revealed.\n\nThe bloc’s IT agency, EU-Lisa, filed a case last year against IBM, the French IT company Atos and Italian defence contractor Leonardo, the three members of a consortium to implement and maintain the EU’s entry/exit system, which was launched in October 2025.\n\nThe rollout has faced significant difficulties: some passengers at peak times have missed their flights as a result of delays blamed on the new technology and a lack of staff at the border.\n\nThe agency’s decision to sue the companies was revealed in its latest annual accounts, which stated that “following the various delays in the delivery of the EES by a contracting consortium the agency activated the available contractual and legal remedies to protect its financial interest”.\n\nSince its launch the system has been beset by problems. Airports have complained of malfunctioning EES kiosks to regular outages of the system, which have led to waiting times of three hours at peak periods.\n\nEU-Lisa said a claim had been submitted on 22 December 2025 to a court in Estonia, where it has its headquarters.\n\nThe agency declined to comment on the details of the case, but said the proceedings concerned “the system’s development phase and have no impact on its current operation” adding that “EES is fully operational”.\n\nThe lawsuit was first reported by the Financial Times.\n\nThe European Commission said it was not a party to the case, while noting it concerned “delays in the delivery of the EES at the time of system development” and was “not related to the operation of the EES”.\n\nThe system increased security checks on passengers travelling into the EU from outside its border-free travel zone. Travellers’ faces have to be photographed and fingerprints scanned before they are allowed into the Schengen area, which comprises 25 of the 27 EU member states as well as Iceland, Liechtenstein, Norway and Switzerland.\n\nThe checks apply to people who are not citizens of one of the 29 Schengen countries, Ireland or Cyprus.\n\nThe system is managed by EU-Lisa, the bloc’s agency for large-scale IT systems in the domain of justice and security.\n\nThe Guardian has contacted IBM and Leonardo. Atos declined to comment.", "body_zh": "去年， IBM、Atos和Leonardo因延迟交付陷入困境的新系统而提起诉讼\n\n一份内部文件显示，欧盟已对IBM和另外两家涉及其陷入困境的边境管理系统的公司提起诉讼。\n\n该集团的IT机构EU-Lisa去年对IBM、法国IT公司Atos和意大利国防承包商Leonardo提起诉讼，后者是一个财团的三名成员，负责实施和维护2025年10月推出的欧盟入境/出境系统。\n\n推出面临重大困难：由于新技术的延误和边境工作人员的缺乏，一些乘客在高峰时段错过了航班。\n\n该机构在其最新的年度账目中披露了起诉这些公司的决定，该账目称“在承包财团交付EES的各种延误之后，gency激活了可用的合同和法律补救措施，以保护其经济利益”。\n\n自推出以来，该系统一直受到问题的困扰。 机场抱怨EES信息亭故障导致系统定期停机，导致高峰期等待时间为3小时。\n\nEU-Lisa表示，已于2025年12月22日向其总部所在地爱沙尼亚的一家法院提出索赔。\n\n该机构拒绝沟通关于案件的细节，但表示诉讼涉及“系统的开发阶段，对其当前的运营没有影响” ，并补充说“EES已全面投入运营”。\n\n该诉讼最初由英国《金融时报》报道。\n\n欧盟委员会表示，它不是此案的当事方，同时指出它涉及“系统开发时EES的交付延迟” ，并且“与EES的运行无关”。\n\nT该系统加强了对从无边界旅行区以外进入欧盟的乘客的安全检查。 在允许旅行者进入申根区之前，必须对旅行者的面部进行拍照和指纹扫描，申根区包括27个欧盟成员国中的25个以及冰岛、列支敦士登、挪威和瑞士。\n\n这些支票适用于非29个申根国家（爱尔兰或塞浦路斯）之一的公民。\n\nTHE SYSTEm由欧盟司法和安全领域大型IT系统机构EU-Lisa管理。\n\n《卫报》已联系IBM和Leona", "body": "去年， IBM、Atos和Leonardo因延迟交付陷入困境的新系统而提起诉讼\n\n一份内部文件显示，欧盟已对IBM和另外两家涉及其陷入困境的边境管理系统的公司提起诉讼。\n\n该集团的IT机构EU-Lisa去年对IBM、法国IT公司Atos和意大利国防承包商Leonardo提起诉讼，后者是一个财团的三名成员，负责实施和维护2025年10月推出的欧盟入境/出境系统。\n\n推出面临重大困难：由于新技术的延误和边境工作人员的缺乏，一些乘客在高峰时段错过了航班。\n\n该机构在其最新的年度账目中披露了起诉这些公司的决定，该账目称“在承包财团交付EES的各种延误之后，gency激活了可用的合同和法律补救措施，以保护其经济利益”。\n\n自推出以来，该系统一直受到问题的困扰。 机场抱怨EES信息亭故障导致系统定期停机，导致高峰期等待时间为3小时。\n\nEU-Lisa表示，已于2025年12月22日向其总部所在地爱沙尼亚的一家法院提出索赔。\n\n该机构拒绝沟通关于案件的细节，但表示诉讼涉及“系统的开发阶段，对其当前的运营没有影响” ，并补充说“EES已全面投入运营”。\n\n该诉讼最初由英国《金融时报》报道。\n\n欧盟委员会表示，它不是此案的当事方，同时指出它涉及“系统开发时EES的交付延迟” ，并且“与EES的运行无关”。\n\nT该系统加强了对从无边界旅行区以外进入欧盟的乘客的安全检查。 在允许旅行者进入申根区之前，必须对旅行者的面部进行拍照和指纹扫描，申根区包括27个欧盟成员国中的25个以及冰岛、列支敦士登、挪威和瑞士。\n\n这些支票适用于非29个申根国家（爱尔兰或塞浦路斯）之一的公民。\n\nTHE SYSTEm由欧盟司法和安全领域大型IT系统机构EU-Lisa管理。\n\n《卫报》已联系IBM和Leona", "link": "https://www.theguardian.com/world/2026/nov/09/eu-lawsuit-ibm-atos-leonardo-entry-exit-border-system", "time": "11月09日 22:24", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Thames Water asks creditors for more time to help repay £20bn debt pile", "title_zh": "泰晤士水务公司要求债权人有更多时间帮助偿还200亿英镑的债务", "summary_orig": "Troubled utility lobbies for deadline on part of the debt to be extended to March 2028 Thames Water has asked creditors for more time to pay back billions of pounds in debt, as the water company scrambles to keep itself afloat. The UK’s largest water company said it had proposed an “interim” deal under which the deadline to pay off an unspecified portion of the £20bn of debt on its balance sheet would be extended from 2027 to March 2028. Continue reading...", "summary_zh": "陷入困境的公用事业游说将部分债务的截止日期延长至2028年3月泰晤士水务公司要求债权人有更多时间偿还数十亿英镑的债务，因为这家水务公司争先恐后地维持生计。这家英国最大的水务公司表示，它已提出一项“临时”协议，根据该协议，偿还其资产负债表上200亿英镑债务中未指明的部分的截止日期将从2027年延长至2028年3月。继续正在读取...", "body_orig": "Troubled utility lobbies for deadline on part of the debt to be extended to March 2028\n\nThames Water has asked creditors for more time to pay back billions of pounds in debt, as the water company scrambles to keep itself afloat.\n\nThe UK’s largest water company said it had proposed an “interim” deal under which the deadline to pay off an unspecified portion of the £20bn of debt on its balance sheet would be extended from 2027 to March 2028.\n\nThe company, which serves 16 million customers across London and the Thames Valley, has been on the brink of collapse for several years after it became overwhelmed by debt. Its shareholders walked away in 2024, which in effect left the company under the control of its creditors, who are working out a deal to avoid bankruptcy.\n\nThe creditors gave Thames Water a separate £3bn lifeline in February last year to try to see it through negotiations on a deal to reduce its debts and inject more money. The creditors, collectively called the London & Valley Water company, are led by a group of US hedge funds, including Elliott Management and Silver Point Capital, and institutional investors, including BlackRock and M&G.\n\nLast month, Thames Water asked creditors for a further £2.4bn emergency loan, as it warned it would be unable to reach a longer-term deal to sort out its debt before running out of cash by “the end of 2026 or the start of 2027”. The company on Monday said it had started the process of raising the first £600m of that funding.\n\nThe prime minister, Andy Burnham, faces a decision on whether to allow a takeover deal by the water company’s creditors, which would involve writing off fines and reducing the company’s environmental commitments. He is also considering whether to nationalise Thames Water or approve another form of state control.\n\nLabour politicians and environmental campaigners have said Burham should instead put Thames Water into special administration, a form of temporary government control while a new buyer is sought.\n\nOn Monday, the Liberal Democrats called on Burnham to tell parliament what he is doing to fix the water industry if he does not publish a full plan by the end of the year.\n\nThe party’s environment spokesperson, Tim Farron, said Burnham had “talked up water in his conference speech earlier this year, but speeches don’t stop sewage, and families paying every higher bills can’t wait years for a 10-year plan to start”.\n\nThe industry regulator, Ofwat, recently announced that water companies could increase annual tariffs by an extra £3.4bn, on top of the 36% average rise agreed over five years to 2030. Customer bills are rising to pay for long-overdue investments to fix leaking pipes and treatment works, as well as new assets, such as reservoirs.", "body_zh": "陷入困境的公用事业游说将部分债务的截止日期延长至2028年3月\n\n泰晤士水务公司（ Thames Water ）已要求债权人有更多时间偿还数十亿英镑的债务，因为这家水务公司争先恐后地维持生计。\n\n这家英国最大的水务公司表示，它已提出一项“临时”协议，根据该协议，偿还其资产负债表上200亿英镑债务中未指明的部分的截止日期将从2027年延长至2028年3月。\n\nThe company为伦敦和泰晤士河谷的1600万客户提供服务，在被债务淹没后，多年来一直处于崩溃的边缘。 其股东于2024年离开，这实际上使该公司处于债权人的控制之下，债权人正在制定一项避免破产的交易。\n\n去年2月，债权人向泰晤士水务公司单独提供了30亿英镑的生命线，试图通过谈判达成协议以减少其债务并注入更多资金。 债权人统称为London & Valley Water公司，由一组美国对冲基金（包括Elliott Management和Silver Point Capital ）以及机构投资者（包括BlackRock和M&G ）领导。\n\n上个月，泰晤士水务公司要求债权人再提供24亿英镑的紧急贷款，因为它警告说，在CAS用完之前，它将无法达成一项长期协议来解决债务问题h “2026年底或2027年初”。 该公司周一表示，已开始筹集第一笔6亿英镑的资金。\n\n总理安迪·伯纳姆（ Andy Burnham ）面临着是否允许水务公司债权人进行收购的决定，这将涉及注销罚款和减少公司对环境的承诺。 他还在考虑是将泰晤士水务公司国有化，还是批准另一种形式的州。ontrol.\n\n工党政界人士和环保活动人士表示，伯勒姆应该将泰晤士水务公司置于特别管理之下，这是政府在寻找新买家时暂时控制的一种形式。\n\n周一，自由民主党呼吁伯纳姆告诉议会，如果他在年底之前没有公布完整的计划，他将采取什么措施来修复水务行业。\n\n该党的环境发言人蒂姆·法伦（ Tim Farron ）说，伯纳姆“谈到了在今年早些时候的会议演讲中节省了水，但演讲并没有阻止污水，支付更高账单的家庭不能等待多年", "body": "陷入困境的公用事业游说将部分债务的截止日期延长至2028年3月\n\n泰晤士水务公司（ Thames Water ）已要求债权人有更多时间偿还数十亿英镑的债务，因为这家水务公司争先恐后地维持生计。\n\n这家英国最大的水务公司表示，它已提出一项“临时”协议，根据该协议，偿还其资产负债表上200亿英镑债务中未指明的部分的截止日期将从2027年延长至2028年3月。\n\nThe company为伦敦和泰晤士河谷的1600万客户提供服务，在被债务淹没后，多年来一直处于崩溃的边缘。 其股东于2024年离开，这实际上使该公司处于债权人的控制之下，债权人正在制定一项避免破产的交易。\n\n去年2月，债权人向泰晤士水务公司单独提供了30亿英镑的生命线，试图通过谈判达成协议以减少其债务并注入更多资金。 债权人统称为London & Valley Water公司，由一组美国对冲基金（包括Elliott Management和Silver Point Capital ）以及机构投资者（包括BlackRock和M&G ）领导。\n\n上个月，泰晤士水务公司要求债权人再提供24亿英镑的紧急贷款，因为它警告说，在CAS用完之前，它将无法达成一项长期协议来解决债务问题h “2026年底或2027年初”。 该公司周一表示，已开始筹集第一笔6亿英镑的资金。\n\n总理安迪·伯纳姆（ Andy Burnham ）面临着是否允许水务公司债权人进行收购的决定，这将涉及注销罚款和减少公司对环境的承诺。 他还在考虑是将泰晤士水务公司国有化，还是批准另一种形式的州。ontrol.\n\n工党政界人士和环保活动人士表示，伯勒姆应该将泰晤士水务公司置于特别管理之下，这是政府在寻找新买家时暂时控制的一种形式。\n\n周一，自由民主党呼吁伯纳姆告诉议会，如果他在年底之前没有公布完整的计划，他将采取什么措施来修复水务行业。\n\n该党的环境发言人蒂姆·法伦（ Tim Farron ）说，伯纳姆“谈到了在今年早些时候的会议演讲中节省了水，但演讲并没有阻止污水，支付更高账单的家庭不能等待多年", "link": "https://www.theguardian.com/business/2026/nov/09/thames-water-asks-creditors-more-time-repay-debt-pile", "time": "11月09日 22:08", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "High fossil fuel prices spread inflation ‘like a cancer’, UN climate chief tells Cop31", "title_zh": "高化石燃料价格“像癌症一样”传播通货膨胀，联合国气候主管告诉COP31", "summary_orig": "Simon Stiell makes opening address at summit in Turkey, where talks are under way about speeding up shift to electrification A global fossil fuel price crisis is “spreading inflation like a cancer” around the planet, the UN’s climate chief, Simon Stiell, told the opening plenary of critical UN climate talks in Turkey. Stiell joined Cop31 hosts Turkey and Australia, which is leading the negotiations, in promoting renewable energy and a new electrification goal as an optimistic alternative to a planet still tied to oil, coal and gas. Continue reading...", "summary_zh": "Simon Stiell makes opening address at summit in Turkey, where talks are under way about speeding up shift to electrification A global fossil fuel price crisis is “spreading inflation like a cancer” around the planet, the UN’s climate chief, Simon Stiell, told the opening plenary of critical UN climate talks in Turkey. Stiell joined Cop31 hosts Turkey and Australia, which is leading the negotiations, in promoting renewable energy and a new electrification goal as an optimistic alternative to a planet still tied to oil, coal and gas. Continue reading...", "body_orig": "Simon Stiell makes opening address at summit in Turkey, where talks are under way about speeding up shift to electrification\n\nA global fossil fuel price crisis is “spreading inflation like a cancer” around the planet, the UN’s climate chief, Simon Stiell, told the opening plenary of critical UN climate talks in Turkey.\n\nStiell joined Cop31 hosts Turkey and Australia, which is leading the negotiations, in promoting renewable energy and a new electrification goal as an optimistic alternative to a planet still tied to oil, coal and gas.\n\nInside the tight security of the opening plenary on Monday, delegates from almost 200 countries watched a stirring short film with scenes of fire, flood and storms that proclaimed: “It’s time to reconnect with the planet we have grown apart from.”\n\nTurkey said it expected 100,000 visitors, including national delegations, to attend the two-week talks, including at least 95 heads of state. A global leaders summit is scheduled for Wednesday and Thursday. But the talks are under increased pressure to deliver, after growing dissatisfaction with the snail’s pace of results.\n\nThe talks are opening as a historic El Niño builds in the tropical Pacific and months after a glacier collapse set off catastrophic flooding in Nepal and Tibet, wiping away villages and killing at least 1,459 people, with thousands more still missing. Climate scientists confirmed this year that global heating would reach at least 1.8C – beyond the 1.5C temperature goal that countries promised to aim for at talks in Paris in 2015.\n\nLast week Johan Rockström, the director of the Potsdam Institute for Climate Impact Research, told the Guardian that although he still had faith in the negotiating process, “the fact that global warming is accelerating, that we inevitably will be breaching the 1.5C limit within three to five years, that tipping points are coming closer fast … and that this is allowed to happen within the framework of the Paris agreement, cannot be considered as anything but a global failure.”\n\nAnd in a statement the UN secretary general, António Guterres, urged leaders to “get serious by cutting emissions faster, accelerating a just transition from fossil fuels and delivering the finance and protection vulnerable countries need”.\n\nStiell also said: “The urgency of this moment must drive us forward. Global heating is already costing the Earth,” adding that it was vulnerable communities paying the price and frustration at a lack of fairness was palpable.\n\nUS president Donald Trump’s war with Iran and the disruption of the key strait of Hormuz supply route for oil pushed up petrol prices around the world by 50%, raising inflation and slowing economic growth.\n\nStiell told delegates this “fossil fuel cost chaos” had “delivered a global shock wave, hitting households hard and spreading inflation like a cancer”.\n\nAustralia’s climate change minister, Chris Bowen, the president of the negotiations, said in a speech that will set the tone for the talks that although the 1.5C Paris target will be overshot “we can return … if we work together and act with urgency, solidarity and resolve”.\n\nWith fists clenched in the final moments of a speech, Bowen urged delegates to show future generations that this generation was “equal to the challenge” and to “rise to this moment together”.\n\nThe countries pushing for the greatest action at Cop31 have stressed the 1.5C temperature rise limit can’t be abandoned and called for accelerated steps to provide finance to the places most vulnerable to climate impacts. The so-called high-ambition coalition said it has 20 country members pushing for major progress in Antalya. “That limit is in serious danger but overshoot should never become an excuse for inaction, every fraction of a degree matters,” said Jess Gasper, an environmental official for the Marshall Islands.\n\n“We must limit overshoot and return to a safe temperature as quickly as possible.” Gasper said it took eight years to get international finance to build a single sea wall to help protect the Marshall Islands, a Pacific island nation acutely threatened by sea level rise.\n\n“That example shows we need that money to adapt,” he said. “I refuse to accept that we experience displacement because the world fails to act.”\n\nThe talks began without a fight over the agenda, which was considered by many to be a good sign. There was confidence among delegates that a final decision from Cop31 would include reference to a new voluntary electrification goal being championed by the host, Turkey, and the president of the negotiations, Australia.\n\nBowen said he had spoken to countries around the globe that were represented at the talks and there was “enormous momentum” among them for electrification.\n\nThe goal, he said, was to raise the percentage of final energy consumption coming from electricity from the current one-fifth to one-third in the next ten years.\n\nDr Fatih Birol, the executive director of the International Energy Agency, said: “I have talked with many governments and I see there is a great appetite for many countries to be part of this historic decision [in Antalya].”\n\nHe told the Guardian: “The important thing is that we are entering the age of electricity and this [electrification goal] would give an extra boost to that movement.”\n\nCountries agreed at the 2023 climate summit to triple renewable energy capacity by 2030. Birol said if countries endorsed the 2035 electrification target it would give an “unmistakable signal to markets” and a chance to increase both renewable and nuclear electricity.", "body_zh": "西蒙·斯蒂尔（ Simon Stiell ）在土耳其峰会上致开幕词，正在就加快向电气化转型进行谈判\n\n联合国气候事务主管西蒙·斯蒂尔（ Simon Stiell ）在土耳其举行的关键联合国气候谈判开幕全体会议上表示，全球化石燃料价格危机正在“像癌症一样蔓延通货膨胀”。\n\nStiell加入了COP31东道主土耳其和澳大利亚，后者正在领导谈判，以促进可再生能源和新当选者作为一个仍然与石油、煤炭和天然气相关的星球的乐观替代方案。\n\n在周一开幕式全体会议的严密保安中，来自近200个国家的代表观看了一部激动人心的短片，其中包括火灾、洪水和风暴的场景，宣称： “现在是时候重新与我们已经成长起来的星球建立联系了。”\n\n土耳其表示，预计包括国家代表团在内的10万名参观者将参加为期两周的会谈，至少95位国家元首。 全球领导人峰会定于周三和周四举行。 但是，在对蜗牛的结果步伐越来越不满之后，谈判面临着越来越大的压力。\n\n会谈的开始是热带太平洋历史性的厄尔尼诺现象，几个月后，一场冰川崩塌在尼泊尔和西藏引发了灾难性的洪水，摧毁了村庄，造成至少1,459人死亡，数千米矿石仍然缺失。气候科学家今年证实，全球供暖将至少达到1.8摄氏度，超过各国承诺于2015年在巴黎举行谈判的1.5摄氏度温度目标。\n\n上周，波茨坦气候影响研究所所长Johan Rockström告诉《卫报》，尽管他仍然对谈判进程充满信心，但“全球变暖正在加速，我们将不可避免地在三到五年内达到1.5摄氏度的上限，临界点正在迅速接近……在巴黎协定的框架内允许发生这种情况，不能被认为是全球性的失败。”\n\n联合国秘书长安东尼奥·古特雷斯（ António Guterres ）在一份声明中敦促领导人“通过更快地减少排放，加快从化石燃料的公正过渡，并提供金融和保护来认真对待”。nerable国家需要”。\n\n斯蒂尔还说： “这一刻的紧迫性必须推动我们前进。 全球供暖已经让地球付出了代价。”", "body": "西蒙·斯蒂尔（ Simon Stiell ）在土耳其峰会上致开幕词，正在就加快向电气化转型进行谈判\n\n联合国气候事务主管西蒙·斯蒂尔（ Simon Stiell ）在土耳其举行的关键联合国气候谈判开幕全体会议上表示，全球化石燃料价格危机正在“像癌症一样蔓延通货膨胀”。\n\nStiell加入了COP31东道主土耳其和澳大利亚，后者正在领导谈判，以促进可再生能源和新当选者作为一个仍然与石油、煤炭和天然气相关的星球的乐观替代方案。\n\n在周一开幕式全体会议的严密保安中，来自近200个国家的代表观看了一部激动人心的短片，其中包括火灾、洪水和风暴的场景，宣称： “现在是时候重新与我们已经成长起来的星球建立联系了。”\n\n土耳其表示，预计包括国家代表团在内的10万名参观者将参加为期两周的会谈，至少95位国家元首。 全球领导人峰会定于周三和周四举行。 但是，在对蜗牛的结果步伐越来越不满之后，谈判面临着越来越大的压力。\n\n会谈的开始是热带太平洋历史性的厄尔尼诺现象，几个月后，一场冰川崩塌在尼泊尔和西藏引发了灾难性的洪水，摧毁了村庄，造成至少1,459人死亡，数千米矿石仍然缺失。气候科学家今年证实，全球供暖将至少达到1.8摄氏度，超过各国承诺于2015年在巴黎举行谈判的1.5摄氏度温度目标。\n\n上周，波茨坦气候影响研究所所长Johan Rockström告诉《卫报》，尽管他仍然对谈判进程充满信心，但“全球变暖正在加速，我们将不可避免地在三到五年内达到1.5摄氏度的上限，临界点正在迅速接近……在巴黎协定的框架内允许发生这种情况，不能被认为是全球性的失败。”\n\n联合国秘书长安东尼奥·古特雷斯（ António Guterres ）在一份声明中敦促领导人“通过更快地减少排放，加快从化石燃料的公正过渡，并提供金融和保护来认真对待”。nerable国家需要”。\n\n斯蒂尔还说： “这一刻的紧迫性必须推动我们前进。 全球供暖已经让地球付出了代价。”", "link": "https://www.theguardian.com/environment/2026/nov/09/high-fossil-fuel-prices-spread-inflation-like-cancer-cop31egotiator-tells-cop31", "time": "11月10日 01:47", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "‘Obvious risk of further tragedy’ at rail crossing type at which Amazon driver died, inquiry finds", "title_zh": "调查发现，亚马逊司机死亡的铁路过境类型存在“进一步悲剧的明显风险”", "summary_orig": "Call for overhaul of manually operated level crossings after delivery worker was killed by passenger train in Kent An Amazon delivery driver was killed by a train after he drove his van on to railway tracks at a manually operated level crossing, apparently without realising he needed to open the exit gate first, an official investigation has reported. Safety inspectors said there was “an obvious risk of further tragedy”, with a second similar fatal event still being investigated, and called for an overhaul of this type of crossing. Continue reading...", "summary_zh": "据官方调查报告，在肯特郡，一名亚马逊送货司机在手动操作的平交道口将面包车开到铁轨上后，被火车撞死，显然没有意识到他需要先打开出口大门。安全检查员表示， “有进一步悲剧的明显风险” ，第二个类似的脂肪事件仍在调查中，并呼吁对这种类型的过境点进行大修。继续阅读...", "body_orig": "Call for overhaul of manually operated level crossings after delivery worker was killed by passenger train in Kent\n\nAn Amazon delivery driver was killed by a train after he drove his van on to railway tracks at a manually operated level crossing, apparently without realising he needed to open the exit gate first, an official investigation has reported.\n\nSafety inspectors said there was “an obvious risk of further tragedy”, with a second similar fatal event still being investigated, and called for an overhaul of this type of crossing.\n\nThe van driver, Brandon Hatcher, 23, of Ashford, Kent, died at the Bax crossing near Teynham after being hit by a passenger train from Ramsgate to London in July last year.\n\nWhile signs at the crossing told road users to check for a green light before opening both gates, and again before closing both gates, the Rail Accident Investigation Branch report found that the traffic light system “almost certainly led [the driver] to believe that it was safe to enter the crossing once the entry gate had been opened, despite the exit gate still being closed”.\n\nHatcher drove his van across most of the track and was parked when the lights turned red and alarms sounded to indicate an approaching train. He opened the exit gate but not sufficiently to pass at the first attempt, tried again and was returning to the door of his van when the Southeastern train, travelling at 90mph, came within view 300 metres away.\n\nThe train driver applied the emergency brake but could not avoid the fatal collision. Three train passengers reported minor injuries.\n\nThe signage had been redesigned in recent years but the RAIB found that it “did not sufficiently consider how diverse information sources may influence crossing user behaviour”.\n\nIt said the training and guidance provided to the delivery driver, who was self-employed but working on behalf of a logistics company, GG Logistix, delivering Amazon parcels, “had not prepared him to use the crossing safely”. It called for Network Rail and the Department for Transport (DfT) to review the design, laws and guidance around this type of level crossing to reduce the risk.\n\nAnother delivery driver was also killed when hit by a Northern train at a manual crossing in Lancashire in August. The circumstances of the death of Simon Gettings, 55, remain under investigation.\n\nAndrew Hall, the chief inspector of rail accidents, said: “These deaths are a tragedy, but as a train can be derailed by striking a delivery van, both accidents could also have had serious consequences for the people on board.\n\n“Private user worked crossings are a 19th-century concept operating in a 21st century world of more dense, faster rail services, more rural housing and abundant home deliveries. Most road users are unfamiliar with this type of crossing and with how to use them safely.”\n\nHe urged the rail industry and the DfT “to find effective ways to mitigate this obvious risk before there is further tragedy”.\n\nThe rail regulator, ORR, said it would “ensure lessons are learned and improvements made to protect crossing users, passengers and railway staff”.\n\nDavid Davidson, the chief operating officer for South Eastern Railway, said: “Our thoughts remain with the family and loved ones of Brandon Hatcher who tragically lost his life following a collision with one of our trains.”\n\nHe said they would study the report’s recommendations closely, adding: “We have already made changes to the layout of the site and we have published a toolkit with guidance on this type of crossing for professional road drivers. We will continue working with the industry and all our partners to help prevent accidents like this from happening again.”", "body_zh": "在肯特郡，送货工人被客运列车杀害后，要求对手动操作的平交道口进行大修\n\n据官方调查报告，一名亚马逊送货司机在手动操作的平交道口驾驶面包车驶入铁轨后被火车撞死，显然没有意识到他需要先打开出口大门。\n\n安全检查员表示，存在“进一步悲剧的明显风险” ，第二个类似的事件仍在调查中，并呼吁对这种类型的过境点进行大修。\n\n来自肯特郡阿什福德的23岁面包车司机布兰登·哈彻（ Brandon Hatcher ）去年7月在泰纳姆（ Teynham ）附近的巴克斯（ Bax ）过境点被从拉姆斯盖特（ Ramsgate ）到伦敦的客运列车撞死。\n\n虽然十字路口的标志告诉道路使用者在打开两个大门之前以及在关闭两个大门之前检查绿灯，但铁路事故调查处报告d交通信号灯系统“几乎可以肯定地导致[驾驶员]相信，一旦入口大门打开，进入过境点是安全的，尽管出口大门仍然关闭”。\n\nHatcher驾驶他的面包车穿过大部分轨道，当灯变红时停了下来，警报响起，表明火车正在接近。 他打开了出口大门，但第一次尝试不足以通过，再次尝试并返回当以90英里/小时的速度行驶的东南火车进入300米外的视野时，他的面包车门。\n\n列车司机施加了紧急制动，但无法避免致命的碰撞。 三名火车乘客报告了轻伤。\n\n该标牌近年来进行了重新设计，但RAIB发现它“没有充分考虑到多样化的信息来源可能对交叉用户行为产生多大影响”。\n\n它说培训和指导提供给自雇但代表物流公司GG Logistix交付亚马逊包裹的送货司机， “没有让他做好安全使用过境点的准备”。 它呼吁网络铁路和运输部（ DfT ）审查围绕此类水平交叉口的设计、法律和指导，以减少风险。\n\n另一名送货司机也在洛杉矶人工过境点被北方火车撞死8月， ncashire。55岁的Simon Gettings的死亡情况仍在调查中。\n\n铁路ACCIDE首席检查员Andrew Hall", "body": "在肯特郡，送货工人被客运列车杀害后，要求对手动操作的平交道口进行大修\n\n据官方调查报告，一名亚马逊送货司机在手动操作的平交道口驾驶面包车驶入铁轨后被火车撞死，显然没有意识到他需要先打开出口大门。\n\n安全检查员表示，存在“进一步悲剧的明显风险” ，第二个类似的事件仍在调查中，并呼吁对这种类型的过境点进行大修。\n\n来自肯特郡阿什福德的23岁面包车司机布兰登·哈彻（ Brandon Hatcher ）去年7月在泰纳姆（ Teynham ）附近的巴克斯（ Bax ）过境点被从拉姆斯盖特（ Ramsgate ）到伦敦的客运列车撞死。\n\n虽然十字路口的标志告诉道路使用者在打开两个大门之前以及在关闭两个大门之前检查绿灯，但铁路事故调查处报告d交通信号灯系统“几乎可以肯定地导致[驾驶员]相信，一旦入口大门打开，进入过境点是安全的，尽管出口大门仍然关闭”。\n\nHatcher驾驶他的面包车穿过大部分轨道，当灯变红时停了下来，警报响起，表明火车正在接近。 他打开了出口大门，但第一次尝试不足以通过，再次尝试并返回当以90英里/小时的速度行驶的东南火车进入300米外的视野时，他的面包车门。\n\n列车司机施加了紧急制动，但无法避免致命的碰撞。 三名火车乘客报告了轻伤。\n\n该标牌近年来进行了重新设计，但RAIB发现它“没有充分考虑到多样化的信息来源可能对交叉用户行为产生多大影响”。\n\n它说培训和指导提供给自雇但代表物流公司GG Logistix交付亚马逊包裹的送货司机， “没有让他做好安全使用过境点的准备”。 它呼吁网络铁路和运输部（ DfT ）审查围绕此类水平交叉口的设计、法律和指导，以减少风险。\n\n另一名送货司机也在洛杉矶人工过境点被北方火车撞死8月， ncashire。55岁的Simon Gettings的死亡情况仍在调查中。\n\n铁路ACCIDE首席检查员Andrew Hall", "link": "https://www.theguardian.com/business/2026/nov/09/amazon-driver-died-inquiry-manually-operated-level-crossing-kent", "time": "11月09日 21:43", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "UK households face rush to find green energy installer to beat April VAT hike", "title_zh": "英国家庭急于寻找绿色能源安装商以击败4月增值税上调", "summary_orig": "Ministers pushed to reverse ‘policy madness’ of scrapping exemption on 5% tax rise for heat pumps, solar panels and batteries Households planning to invest in green energy upgrades, including heat pumps and solar panels, risk a nationwide rush to find an installer or face hundreds of pounds in unexpected costs unless the government abandons its looming VAT increase. Ministers are under growing pressure to reverse plans to scrap the 5% VAT exemption on home heat pumps, solar panels and batteries from 1 April which could add up to £1,530 on to the cost of a smart home energy system amid record demand for fossil fuel alternatives. Continue reading...", "summary_zh": "部长们推动扭转取消对热泵、太阳能电池板和电池5%增税豁免的“政策疯狂”家庭计划投资绿色能源升级，包括热泵和太阳能电池板，冒着在全国范围内急于寻找安装商的风险，或者面临数百英镑的意外费用，除非政府放弃其迫在眉睫的增值税增加。部长们面临着越来越大的压力，要求撤销取消5%增值税豁免的计划从4月1日起，在家用热泵、太阳能电池板和电池方面，在化石燃料替代品需求创纪录的情况下，智能家居能源系统的成本可能会增加1,530 £。继续阅读...", "body_orig": "Ministers pushed to reverse ‘policy madness’ of scrapping exemption on 5% tax rise for heat pumps, solar panels and batteries\n\nHouseholds planning to invest in green energy upgrades, including heat pumps and solar panels, risk a nationwide rush to find an installer or face hundreds of pounds in unexpected costs unless the government abandons its looming VAT increase.\n\nMinisters are under growing pressure to reverse plans to scrap the 5% VAT exemption on home heat pumps, solar panels and batteries from 1 April which could add up to £1,530 on to the cost of a smart home energy system amid record demand for fossil fuel alternatives.\n\nIndustry groups have warned that the VAT cliff-edge could trigger a surge in demand for installations before the deadline, creating a “feast and famine” upheaval for the country’s nascent network of home energy installers after years of tepid interest from households.\n\nDemand for home energy upgrades has reached record highs across the UK since the Middle East war caused gas market prices to double across Europe, pushing home energy bills to near four-year highs.\n\nBut the chancellor’s budget statement has signalled plans to shrink the total amount for heat pump grants over the coming financial year, while cutting the extra grant funding offered to heating oil users at the same time as VAT is reinstated.\n\nCharlotte Lee, the chief executive of Heat Pump Association UK, said the abrupt change risks “creating a rush of applications ahead of April, disrupting the supply chain and making the process less predictable for consumers.\n\n“The savings to government must be weighed against the risk of disrupting consumers, undermining industry confidence and stalling an emerging market,” she said.\n\nThe trade association is seeking clarity from the government over how the reintroduction of VAT will be applied so households can avoid an unexpected bill if their pre-booked installation is delayed until after the VAT exemption deadline.\n\nMeanwhile, the decision to remove the VAT relief has been criticised as “inconsistent” with the government’s focus on helping to protect bill payers from the surging cost of fossil fuels, and “total policy madness” after ministers cut VAT on electricity bills in part to encourage electric alternatives to fossil fuels.\n\nThe Liberal Democrats said the rollback of the tax exemption could mean a household planning to fit an air-source heat pump, a 4KW solar installation, and a home battery would face an extra £1,530 cost unless it is able to undertake the work before April.\n\nPippa Heylings, the Liberal Democrat’s spokesperson for Energy Security and Net Zero, said: “It is total policy madness for the government to strip VAT from electricity bills with one hand, only to slap it straight back on to heat pumps with the other. They are telling families to switch to clean electricity, while simultaneously punishing them with a £1,530 tax hike for buying the very kit needed to do so.”\n\nHeylings called on ministers to “urgently reverse this shortsighted heat pump tax”, a demand echoed by energy industry leaders who fear the rise may undermine government schemes to support the industry, which includes the launch of state-backed low-interest loans.\n\nChris Hewett, the chief executive of Solar Energy UK, said the rise would “raise the cost of the loans scheme that has only just been launched” and would be “inconsistent with the government’s intention for more people to enjoy the benefits of home solar and battery systems”.\n\n“With domestic electricity bills now zero-rated until July next year, saving energy will be taxed more heavily than consuming it – a perverse incentive. We will be urging the government to reverse course,” he said.\n\nA Department for Energy Security and Net Zero spokesperson said: “More and more families are switching to clean energy technology, with record numbers of people applying for heat pumps and receiving grants through the Boiler Upgrade Scheme in September.\n\n“We are driving forward electrification and the clean tech market, protecting support for low-income families and launching our new warm homes loan scheme so households can purchase heat pumps, solar panels and batteries at no upfront cost.”", "body_zh": "部长们推动扭转废除热泵、太阳能电池板和电池5 ％增税豁免的“政策疯狂”\n\n计划投资绿色能源升级的家庭，包括热泵和太阳能电池板，冒着在全国范围内急于寻找安装人员的风险，或者面临数百英镑的意外成本，除非政府放弃其迫在眉睫的增值税增加。\n\n部长们面临着越来越大的压力，要求撤销取消5%增值税豁免的计划从4月1日起，在家用热泵、太阳能电池板和电池方面，在化石燃料替代品需求创纪录的情况下，智能家居能源系统的成本可能会增加1,530 £。\n\n行业组织警告说，增值税悬崖边缘可能会在截止日期前引发对安装的需求激增，为该国新兴的家庭能源安装商网络带来“盛宴和饥荒”的动荡。eholds.\n\n自中东战争导致整个欧洲的天然气市场价格翻番以来，英国各地的家庭能源升级需求已达到创纪录的高位，将家庭能源账单推至接近四年高位。\n\n但财政大臣的预算声明已暗示计划在下一个财政年度缩减热泵拨款的总金额，同时在恢复增值税的同时削减向取暖油用户提供的额外拨款资金.\n\n英国热泵协会（ Heat Pump Association UK ）首席执行官夏洛特·李（ Charlotte Lee ）表示，突然的变革风险“在4月份之前创造了大量的应用程序，扰乱了供应链，并使消费者无法预测这一过程。\n\n她说： “必须权衡政府节省的资金与扰乱消费者、破坏行业信心和拖延新兴市场的风险。”\n\n行业协会正在寻求政府官员的澄清考虑如何重新引入增值税，以便在预先预订的安装延迟到增值税免税截止日期后，家庭可以避免意外账单。\n\n与此同时，取消增值税减免的决定被批评为“不符合”政府关注帮助保护账单支付者免受化石燃料成本飙升的影响，以及在部长们部分削减电费增加税后“完全政策疯狂”o鼓励化石燃料的电力替代品。\n\n自由民主党人表示，免税的回滚可能意味着家庭计划", "body": "部长们推动扭转废除热泵、太阳能电池板和电池5 ％增税豁免的“政策疯狂”\n\n计划投资绿色能源升级的家庭，包括热泵和太阳能电池板，冒着在全国范围内急于寻找安装人员的风险，或者面临数百英镑的意外成本，除非政府放弃其迫在眉睫的增值税增加。\n\n部长们面临着越来越大的压力，要求撤销取消5%增值税豁免的计划从4月1日起，在家用热泵、太阳能电池板和电池方面，在化石燃料替代品需求创纪录的情况下，智能家居能源系统的成本可能会增加1,530 £。\n\n行业组织警告说，增值税悬崖边缘可能会在截止日期前引发对安装的需求激增，为该国新兴的家庭能源安装商网络带来“盛宴和饥荒”的动荡。eholds.\n\n自中东战争导致整个欧洲的天然气市场价格翻番以来，英国各地的家庭能源升级需求已达到创纪录的高位，将家庭能源账单推至接近四年高位。\n\n但财政大臣的预算声明已暗示计划在下一个财政年度缩减热泵拨款的总金额，同时在恢复增值税的同时削减向取暖油用户提供的额外拨款资金.\n\n英国热泵协会（ Heat Pump Association UK ）首席执行官夏洛特·李（ Charlotte Lee ）表示，突然的变革风险“在4月份之前创造了大量的应用程序，扰乱了供应链，并使消费者无法预测这一过程。\n\n她说： “必须权衡政府节省的资金与扰乱消费者、破坏行业信心和拖延新兴市场的风险。”\n\n行业协会正在寻求政府官员的澄清考虑如何重新引入增值税，以便在预先预订的安装延迟到增值税免税截止日期后，家庭可以避免意外账单。\n\n与此同时，取消增值税减免的决定被批评为“不符合”政府关注帮助保护账单支付者免受化石燃料成本飙升的影响，以及在部长们部分削减电费增加税后“完全政策疯狂”o鼓励化石燃料的电力替代品。\n\n自由民主党人表示，免税的回滚可能意味着家庭计划", "link": "https://www.theguardian.com/environment/2026/nov/09/uk-households-green-energy-installer-rush-april-vat-hike", "time": "11月09日 17:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Labour’s Brexit red lines ready for ‘dignified retirement’, says their co-author", "title_zh": "他们的合著者说，工党的英国退欧红线已准备好“有尊严的退休”", "summary_orig": "Exclusive: MP Chris Ward believes ditching pledges and forming closer ties with EU would protect it from global threats One of the architects of Keir Stamer’s Brexit red lines has called for Andy Burnham to abandon them at the next election, saying a new relationship with the EU would protect the UK from global threats. The call is the latest voice from a prominent figure in Starmer’s administration for a faster transition to a far closer European relationship, after the former chancellor Rachel Reeves said it was right for Burnham to consider rejoining . Continue reading...", "summary_zh": "独家：国会议员克里斯·沃德（ Chris Ward ）认为，放弃承诺并与欧盟建立更紧密的联系将保护其免受全球威胁。基尔·斯塔默（ Keir Stamer ）的英国退欧红线的建筑师之一呼吁安迪·伯纳姆（ Andy Burnham ）在下次选举中放弃这些承诺，并表示与欧盟的新关系将保护英国免受全球威胁。这通电话是Starmer政府中一位知名人士的最新声音，旨在更快地过渡到更紧密的欧洲。在前总理雷切尔·里夫斯（ Rachel Reeves ）表示伯纳姆考虑重新加入是正确的关系之后。继续阅读...", "body_orig": "Exclusive: MP Chris Ward believes ditching pledges and forming closer ties with EU would protect it from global threats\n\nOne of the architects of Keir Stamer’s Brexit red lines has called for Andy Burnham to abandon them at the next election, saying a new relationship with the EU would protect the UK from global threats.\n\nThe call is the latest voice from a prominent figure in Starmer’s administration for a faster transition to a far closer European relationship, after the former chancellor Rachel Reeves said it was right for Burnham to consider rejoining.\n\nChris Ward, one of Starmer’s closest confidants in politics and one of the ministers who worked on the EU reset, said that it was the security relationship that meant a change was now imperative.\n\nThe Labour MP for Brighton Kemptown and Peacehaven said it was now time to give a “a dignified retirement” to the red lines, which rule out rejoining the EU, the single market, the customs union and restoring freedom of movement.\n\nWard also suggested there was little compelling argument for rejoining the single market without full EU membership, saying he had “never understood the argument for the latter without the former”.\n\nBut he said the main reason for abandoning the red lines was that the UK “could no longer rely on the Americans” which was a major geopolitical shift that merited an entire reappraisal of Britain’s diplomatic relationships. “That question was unthinkable in 2016, but it is unavoidable in 2026,” he wrote in an article for the Guardian.\n\nWard, who was Starmer’s chief adviser as shadow Brexit secretary and who co-authored the red lines in Labour’s manifesto in 2024, said that they had now outlived their usefulness and should no longer be part of Labour’s future thinking.\n\nHe remains close to the former prime minister and said that the drive to renew the relationship with the EU may prove the defining political moment of this autumn.\n\nHe said the party had agreed upon the red lines in the manifesto because they were “designed precisely to close down the debate and to narrow the target that Brexit had become for Labour”.\n\n“I still believe that strategically this was the right course for Labour, and the reset deal that – touch wood – will get over the line at next month’s UK-EU summit will demonstrate that real benefits can be delivered within those red lines, whether cheaper prices for businesses, a youth mobility scheme or the return of the Erasmus+ scheme.\n\n“By the next general election, however, those red lines will have served their purpose. They should be given a well-earned and dignified retirement. Frankly, they no longer speak to the world as it is in 2026, let alone as it may be over the years to come.”\n\nWard said it was well known that rejoining the EU or single market would have economic benefits but said supporters of rejoining should make a different argument.\n\n“Pinning the case for a new relationship on old arguments risks both the same result and missing what’s really changed,” he wrote.\n\n“Instead, its the huge geopolitical shifts and, above all, the new security and cyber threats the UK and Europe now face day in, day out that demand we now reassess the depth and nature of relationship.”\n\nHe said Starmer had twice had to scramble alliances together – on Ukraine and on the strait of Hormuz – because “we could no longer rely on the Americans”.\n\n“It would now be brave in the extreme to continue to pin our future security – and that of Europe – on the outcome of US elections, or the false hope that whoever is in the White House we can still bank on the US as we did in 2016, let alone 1945.”\n\nWard said there should be public debate on whether the UK should formally rejoin or seek a form of associate membership like Canada.\n\nBut he said the prime minister will “need to be clear as to why now is the right time to reopen the Brexit debate, what we are seeking, and why it is so important to our national interest. A re-run of the tired arguments of 2016 won’t do that. Defending red lines designed for 2020 won’t do that either. But appreciating the urgent strategic challenges of the decades to come just might.”\n\nBurnham will attend the European Political Community summit in Dublin on Thursday, expected to be used to see Labour’s reset deal over the line and to meet many European leaders for the first time.\n\nBurnham will also meet European leaders on the sidelines to set out his ambitions for further integration after he announced his intention to seek a closer and more permanent relationship – including potentially rejoining the bloc.\n\nAt a Brexit reset meeting on 20 November in Brussels, the UK will sign new agreements on agriculture and food, emissions trading and a youth mobility scheme.\n\nThe prime minister is then expected to give a speech after the summit on options for the future relationship. Burnham has said previously an option to rejoin the single market could be offered in a Labour manifesto but fully rejoining would need a referendum.", "body_zh": "独家：国会议员克里斯·沃德（ Chris Ward ）认为，放弃承诺并与欧盟建立更紧密的联系将保护其免受全球威胁\n\n基尔·斯塔默（ Keir Stamer ）的英国退欧红线的建筑师之一呼吁安迪·伯纳姆（ Andy Burnham ）在下次选举中放弃他们，称与欧盟的新关系将保护英国免受全球威胁。\n\n这通电话是Starmer政府中一位知名人士的最新声音，旨在更快地过渡到更接近的欧洲前总理雷切尔·里夫斯（ Rachel Reeves ）表示，伯纳姆考虑重新加入是正确的。\n\n克里斯·沃德（ Chris Ward ）是斯塔默最亲密的政治知己之一，也是负责欧盟重置的部长之一，他说，安全关系意味着现在必须改变。\n\n布莱顿肯普敦和Peacehaven的工党议员表示，现在是时候让红线“有尊严地退休”了，这排除了重新加入欧盟、单一市场、关税同盟并恢复行动自由。\n\n沃德还表示，在没有正式欧盟成员资格的情况下重新加入单一市场几乎没有什么令人信服的理由，称他“从来没有理解过没有前者的后者的论点”。\n\n但他说，放弃红线的主要原因是英国“不能再依赖美国人” ，这是一个重大的地缘政治转变，对英国的外交关系进行了全面的重新评估。 “这个问题在2016年是不可想象的，但在2026年是不可避免的，”他在《卫报》的一篇文章中写道。\n\nWard是Starmer的首席顾问，曾担任影子英国退欧大臣，并于2024年与他人共同撰写了工党宣言中的红线，他说，这些红线现在已经失去了用途，不应该再成为工党未来思维的一部分。\n\n他仍然与前公关关系密切并表示，恢复与欧盟关系的动力可能证明是今年秋季的决定性政治时刻。\n\n他说，该党已同意宣言中的红线，因为它们“正是为了结束辩论并缩小英国脱欧已成为工党的目标”。\n\n“我仍然相信，从战略上讲，这对工党来说是正确的道路，而重置协议–触及木材–将克服在下个月的英欧峰会上排队将证明，在这些红线范围内可以带来真正的好处，无论是企业更便宜的价格还是", "body": "独家：国会议员克里斯·沃德（ Chris Ward ）认为，放弃承诺并与欧盟建立更紧密的联系将保护其免受全球威胁\n\n基尔·斯塔默（ Keir Stamer ）的英国退欧红线的建筑师之一呼吁安迪·伯纳姆（ Andy Burnham ）在下次选举中放弃他们，称与欧盟的新关系将保护英国免受全球威胁。\n\n这通电话是Starmer政府中一位知名人士的最新声音，旨在更快地过渡到更接近的欧洲前总理雷切尔·里夫斯（ Rachel Reeves ）表示，伯纳姆考虑重新加入是正确的。\n\n克里斯·沃德（ Chris Ward ）是斯塔默最亲密的政治知己之一，也是负责欧盟重置的部长之一，他说，安全关系意味着现在必须改变。\n\n布莱顿肯普敦和Peacehaven的工党议员表示，现在是时候让红线“有尊严地退休”了，这排除了重新加入欧盟、单一市场、关税同盟并恢复行动自由。\n\n沃德还表示，在没有正式欧盟成员资格的情况下重新加入单一市场几乎没有什么令人信服的理由，称他“从来没有理解过没有前者的后者的论点”。\n\n但他说，放弃红线的主要原因是英国“不能再依赖美国人” ，这是一个重大的地缘政治转变，对英国的外交关系进行了全面的重新评估。 “这个问题在2016年是不可想象的，但在2026年是不可避免的，”他在《卫报》的一篇文章中写道。\n\nWard是Starmer的首席顾问，曾担任影子英国退欧大臣，并于2024年与他人共同撰写了工党宣言中的红线，他说，这些红线现在已经失去了用途，不应该再成为工党未来思维的一部分。\n\n他仍然与前公关关系密切并表示，恢复与欧盟关系的动力可能证明是今年秋季的决定性政治时刻。\n\n他说，该党已同意宣言中的红线，因为它们“正是为了结束辩论并缩小英国脱欧已成为工党的目标”。\n\n“我仍然相信，从战略上讲，这对工党来说是正确的道路，而重置协议–触及木材–将克服在下个月的英欧峰会上排队将证明，在这些红线范围内可以带来真正的好处，无论是企业更便宜的价格还是", "link": "https://www.theguardian.com/politics/2026/nov/09/labour-mp-brexit-red-lines-dignified-retirement", "time": "11月10日 01:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}]}, {"key": "npr_biz", "name": "美国公共广播财经节目", "lang": "英文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读，含中文对照）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "Nvidia shares tumble as the company says it's investigating CEO Jensen Huang", "title_zh": "英伟达(Nvidia)股价暴跌，该公司表示正在调查首席执行官黄延森(Jensen Huang)", "summary_orig": "Nvidia's share price falls after the company begins an investigation into CEO Jensen Huang's alleged relationship with a woman accused of being a Chinese spy.", "summary_zh": "英伟达(Nvidia)的股价在公司开始调查首席执行官黄延森(Jensen Huang)涉嫌与一名被指控为中国间谍的女性的关系后下跌。", "body_orig": "Nvidia's share price falls after the company begins an investigation into CEO Jensen Huang's alleged relationship with a woman accused of being a Chinese spy.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "英伟达(Nvidia)的股价在公司开始调查首席执行官黄延森(Jensen Huang)涉嫌与一名被指控为中国间谍的女性的关系后下跌。\n\nNPR不为报道或采访提供或接受报酬。 提出此类要约或要求的任何人都不是NPR员工，也不代表NPR。", "body": "英伟达(Nvidia)的股价在公司开始调查首席执行官黄延森(Jensen Huang)涉嫌与一名被指控为中国间谍的女性的关系后下跌。\n\nNPR不为报道或采访提供或接受报酬。 提出此类要约或要求的任何人都不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/09/nx-s1-6034478/nvidia-shares-tumble-as-the-company-says-its-investigating-ceo-jensen-huang", "time": "11月10日 06:01", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "The business of El Niño", "title_zh": "厄尔尼诺现象的业务", "summary_orig": "El Niño is expected to bring wild weather, but it's also business opportunity for some. Contractors are booked up as homeowners prepare for heavy rains and ski resorts gear up to cash in on snow.", "summary_zh": "预计厄尔尼诺现象会带来恶劣的天气，但对一些人来说，这也是一个商机。随着业主为暴雨做准备，以及滑雪胜地在雪地上兑现，承包商被预订。", "body_orig": "El Niño is expected to bring wild weather, but it's also business opportunity for some. Contractors are booked up as homeowners prepare for heavy rains and ski resorts gear up to cash in on snow.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "预计厄尔尼诺现象会带来恶劣的天气，但对一些人来说，这也是一个商机。 随着业主为暴雨做准备，以及滑雪胜地在雪地上兑现，承包商被预订。\n\nNPR不为报道或采访提供或接受报酬。 提出此类要约或要求的任何人都不是NPR员工，也不代表NPR。", "body": "预计厄尔尼诺现象会带来恶劣的天气，但对一些人来说，这也是一个商机。 随着业主为暴雨做准备，以及滑雪胜地在雪地上兑现，承包商被预订。\n\nNPR不为报道或采访提供或接受报酬。 提出此类要约或要求的任何人都不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/09/nx-s1-6022405/the-business-of-el-nino", "time": "11月10日 05:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Democrats won big. Can they lower your grocery bill?", "title_zh": "民主党大获全胜。他们能降低你的杂货账单吗？", "summary_orig": "Affordability concerns were top of mind for voters heading into the midterms, as tariffs and the war in Iran drove up prices, including food costs. Now, Americans are expecting relief from Washington.", "summary_zh": "由于关税和伊朗战争推高了价格（包括食品成本） ，对于即将进入中期的选民来说，负担能力问题是他们最关心的问题。现在，美国人期待着华盛顿的救济。", "body_orig": "A supporter holds a sign during a campaign rally for Democratic Senate candidate Dr. Annie Andrews in Myrtle Beach, S.C., on Nov. 1. Andrews defeated her Republican opponent, Sen. Darline Graham. Bill Clark/CQ-Roll Call, Inc via Getty Images hide caption\n\nIt's been a feature of campaign ads and stump speeches for months: grocery prices are out of control.\n\nAffordability concerns, including high food costs, were top of mind for voters heading into the midterms, as the Trump administration's tariffs and the war in Iran continued to drive up prices. That economic strain helped Democrats win control of both houses of Congress on Tuesday.\n\nHouse Democratic Leader Hakeem Jeffries said the incoming majority would make tackling high prices a priority come January. \"It was a tremendous victory for the American people and a strong rebuke of MAGA extremism, which has made life more expensive for everyday Americans despite their promises to lower the high cost of living on day one,\" he told NPR on Friday.\n\nThe question is how Democrats will do that with President Trump still in the Oval Office, willing to wield his veto pen. Senate Democrats won't have a filibuster-proof majority, and Trump may have little appetite to roll back his signature tariffs or reverse course on the Iran war, two of the main causes of high food prices.\n\nLael Brainard, who leads a public policy group called The Kitchen Table Project, said Americans are nevertheless expecting relief from Washington — and quickly.\n\n\"They are feeling like they are getting squeezed by high prices that don't need to be that high,\" she said.\n\nDespite the political hurdles, Democrats said they intend to move ahead with plans to cut grocery bills, including by rolling back Trump's tariffs. Those tariffs have not only raised the cost of certain foods and drinks imported to the U.S., but also created other pressures on the food industry by making it more expensive to import things like machine parts and packaging.\n\nThe Iran war has led to a surge in energy prices, which has made it more expensive to transport just about everything. Fertilizer costs also grew when the closure of the Strait of Hormuz cut off a significant portion of the global fertilizer trade.\n\nBut getting Trump to backtrack on tariffs or the Iran war — or his immigration crackdown, which has led to labor shortages on U.S. farms — could prove tricky for Democrats.\n\n\"I think the president would certainly want to find ways to reduce the cost of groceries. Democrats [also] see that in their interest,\" said Lehigh University political science professor Chris Borick. \"The mechanisms, the tools, the levers that would be most readily available to do that — there's quite a bit of distance between the president and Democrats that'll be taking over both the House and the Senate.\"\n\nSeveral incoming Democratic senators also floated other proposals during their campaigns that aim to make groceries more affordable.\n\nJames Talarico of Texas said he would push back against \"attacks\" on the federal food assistance programs WIC and SNAP, the latter of which is undergoing a major overhaul by the Trump administration and has seen a precipitous drop in participation since last summer. Kansas' Adam Hamilton announced his support for a national ban on \"dynamic pricing\" in grocery stores. And multiple candidates, including Roy Cooper of North Carolina, vowed to block food industry mergers they say would raise consumer prices.\n\nBeyond the blue wave in Congress, Democrats also made gains in state capitals across the U.S. on Tuesday. At least 28 states will have Democratic governors beginning next year, and ten state legislative chambers flipped to Democrats, according to the National Conference of State Legislatures.\n\nIncoming state governors have floated their own ideas for how to give residents relief in the grocery aisle.\n\nKeisha Lance Bottoms proposed allowing municipalities in Georgia to suspend or fully eliminate their local sales tax on groceries, baby formula, diapers and more. Gina Hinojosa, the governor-elect of Texas, promised to outlaw \"predatory surveillance pricing\" and price gouging in grocery stores. In New Mexico, Deb Haaland said the state would explore a policy similar to one in Albuquerque that temporarily waives permitting fees for markets that sell healthy and affordable food in so-called \"food deserts,\" the Albuquerque Journal reported.\n\nHowever state and federal officials decide to go about lowering prices, Americans say they want to see cheaper groceries soon. According to a poll released by the Kitchen Table Project and Global Strategy Group in September, nearly half of respondents said their most important goal was seeing their grocery bills lowered within six months.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "11月1日，一名支持者在南卡罗来纳州默特尔比奇的民主党参议员候选人安妮·安德鲁斯博士的竞选集会上举着一个标志。 安德鲁斯击败了她的共和党对手，参议员达琳·格雷厄姆。 Bill Clark/CQ-Roll Call, Inc通过Getty Images隐藏标题\n\n几个月来，它一直是广告系列广告和树桩演讲的特色：生鲜杂货价格失控。\n\n负担能力问题，包括高昂的食品成本，是选民前往中期，特朗普政府的关税和伊朗战争继续推高价格。 周二，这种经济压力帮助民主党赢得了国会两院的控制权。\n\n众议院民主党领袖哈基姆·杰弗里斯（ Hakeem Jeffries ）表示，即将上任的大多数人将把在明年1月解决高 “这对美国人民来说是一个巨大的胜利，也是对MAGA极端主义的强烈谴责，这使得生活变得更加昂贵。尽管他们承诺在第一天降低高生活成本，但今天的美国人， “他周五告诉NPR。\n\n问题在于，如果特朗普总统仍在椭圆形办公室，愿意使用否决权，民主党将如何做到这一点。 参议院民主党人不会拥有不受阻挠的多数席位，特朗普可能没有兴趣撤回他的签名关税或扭转伊朗战争的路线，这是高粮价的两个主要原因。\n\nLael Brainard领导着一个名为“厨房餐桌项目”的公共政策组织，他说，尽管如此，美国人仍然期待着华盛顿的救济--而且很快。\n\n“他们觉得自己受到了不必那么高的高价的挤压，”她说。\n\n尽管存在政治障碍，但民主党人表示，他们打算推进削减杂货账单的计划，包括降低特朗普的关税。 这些关税不仅提高了成本进口到美国的某些食品和饮料，但也给食品行业带来了其他压力，使进口机器零件和包装等物品变得更加昂贵。\n\n伊朗战争导致能源价格飙升，这使得运输几乎所有东西都变得更加昂贵。 当霍尔木兹海峡的关闭切断了全球肥料贸易的很大一部分时，肥料成本也在上升。\n\n但得到TRU国会议员回溯关税或伊朗战争—或他的移民镇压，导致美国农场劳动力短缺—可能对Dem来说是棘手的", "body": "11月1日，一名支持者在南卡罗来纳州默特尔比奇的民主党参议员候选人安妮·安德鲁斯博士的竞选集会上举着一个标志。 安德鲁斯击败了她的共和党对手，参议员达琳·格雷厄姆。 Bill Clark/CQ-Roll Call, Inc通过Getty Images隐藏标题\n\n几个月来，它一直是广告系列广告和树桩演讲的特色：生鲜杂货价格失控。\n\n负担能力问题，包括高昂的食品成本，是选民前往中期，特朗普政府的关税和伊朗战争继续推高价格。 周二，这种经济压力帮助民主党赢得了国会两院的控制权。\n\n众议院民主党领袖哈基姆·杰弗里斯（ Hakeem Jeffries ）表示，即将上任的大多数人将把在明年1月解决高 “这对美国人民来说是一个巨大的胜利，也是对MAGA极端主义的强烈谴责，这使得生活变得更加昂贵。尽管他们承诺在第一天降低高生活成本，但今天的美国人， “他周五告诉NPR。\n\n问题在于，如果特朗普总统仍在椭圆形办公室，愿意使用否决权，民主党将如何做到这一点。 参议院民主党人不会拥有不受阻挠的多数席位，特朗普可能没有兴趣撤回他的签名关税或扭转伊朗战争的路线，这是高粮价的两个主要原因。\n\nLael Brainard领导着一个名为“厨房餐桌项目”的公共政策组织，他说，尽管如此，美国人仍然期待着华盛顿的救济--而且很快。\n\n“他们觉得自己受到了不必那么高的高价的挤压，”她说。\n\n尽管存在政治障碍，但民主党人表示，他们打算推进削减杂货账单的计划，包括降低特朗普的关税。 这些关税不仅提高了成本进口到美国的某些食品和饮料，但也给食品行业带来了其他压力，使进口机器零件和包装等物品变得更加昂贵。\n\n伊朗战争导致能源价格飙升，这使得运输几乎所有东西都变得更加昂贵。 当霍尔木兹海峡的关闭切断了全球肥料贸易的很大一部分时，肥料成本也在上升。\n\n但得到TRU国会议员回溯关税或伊朗战争—或他的移民镇压，导致美国农场劳动力短缺—可能对Dem来说是棘手的", "link": "https://www.npr.org/2026/11/09/nx-s1-6030830/democrats-grocery-bill-affordability", "time": "11月09日 18:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "The Cybertruck's 'cause of death?' Insufficient demand", "title_zh": "赛博卡车的“死因？”需求不足", "summary_orig": "One of the most polarizing vehicles to hit the road will soon be a thing of history. Tesla will wind down manufacturing of its Cybertruck at the company's Gigafactory Texas mid-next year.", "summary_zh": "上路的最两极分化的车辆之一将很快成为历史。明年年中，特斯拉将在德克萨斯州的Gigafactory工厂停产Cybertruck。", "body_orig": "One of the most polarizing vehicles to hit the road will soon be a thing of "title_orig": "Hiring jumps: The economy added 165,000 jobs last month", "title_zh": "招聘人数激增：上个月经济增加了165,000个工作岗位", "summary_orig": "The U.S. job market improved last month, according to a report from the Labor Department Friday. Employers added more jobs than forecasters had expected and the unemployment rate dipped to 4.1%.", "summary_zh": "根据劳工部周五的一份报告，美国就业市场上个月有所改善。雇主增加的工作岗位比预测者预期的要多，失业率降至4.1%。", "body_orig": "U.S. employers added 165,000 jobs in October as the unemployment rate fell to 4.1%. The warehouse and transportation industry added 25,000 jobs during the month. Scott Olson/Getty Images North America hide caption\n\nThe U.S. job market picked up steam last month.\n\nEmployers added 165,000 jobs in October, according to a report Friday from the Labor Department. The unemployment rate dipped to 4.1%, from 4.2% the previous month.\n\nEmployment gains for August and September were revised up by a total of 84,000 jobs.\n\nIndustries adding jobs last month include health care, manufacturing, and business services. Meanwhile, restaurants and construction companies cut jobs during the month.\n\nOne sign of the strengthening job market was slightly larger wage gains. Average wages in October were up 3.1% from a year ago. That's a bigger annual increase than the previous month, but still probably not enough to keep pace with rising prices.\n\nInflation climbed to 3.7% in September. The cost of living has been going up faster than wages for much of this year, since the war with Iran triggered a sharp jump in energy prices.\n\n\"Workers are losing ground right now,\" says Cory Stahle, an economist with the Indeed job-search website. \"The longer it wears on, the more and more they're going to feel that.\"\n\nVoters' frustration with high prices was a big factor in the midterm elections, which cost Republicans their majorities in both the House and Senate.\n\nThe unemployment rate remains historically low, which has allowed the Federal Reserve to focus its attention on fighting inflation. The central bank held its benchmark interest rate steady last week, but investors expect the Fed to raise rates when policymakers meet in December.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "body": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/06/nx-s1-6030867/jobs-labor-market-economy-wages-inflation", "time": "11月06日 21:49", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Why gold prices are surprisingly low", "title_zh": "为什么黄金价格出人意料地低", "summary_orig": "Gold tends to go up when there's uncertainty in the economy. For a while, the price reflected that. But this week, it dropped from a nearly $5,600 in January to below $4,000. What's going on?", "summary_zh": "当经济存在不确定性时，黄金往往会上涨。有一段时间，价格反映了这一点。但本周，它从1月份的近5,600 $跌至4,000 $以下。怎么回事？", "body_orig": "Scammers can even make money off of people starved for FAN fiction. That's my takeaway from a fake website popping up that tried to sell computer-generated audiobooks of fan fiction, which is content created by ANYONE based off of existing works. \"Fifty Shades of Grey\" started as a fanfic of Twilight, for example.\n\nThis scam website popped up in the wake of the uber-popular fan fiction website AO3, Archive of our Own, going down for an estimated two to four weeks after a \"security incident.\" People are starved for their stories and apparently will click on anything. Lucky for the world, the scam website has been taken down.\n\nWhat to know: North Korea just loves stealing crypto. They love it! It's become a major part of their economy. Last week, a state-sponsored hacking group called \"TraderTraitor\" executed the largest crypto theft in history, stealing $6.43 billion from Binance, a massive cryptocurrency exchange. $2.85 billion has been frozen or seized, according to Elliptic, a crypto analytics & compliance firm. But $3.35 billion is still linked to the group. \"TraderTraitor\" is actively trying to launder this money (yes, crypto is surprisingly traceable). A huge part of the stolen funds are in stablecoin, which can be frozen. Whatever isn't already frozen, the hacking group is trying to launder it and FAST. So how are they doing it?\n\n\"TraderTraitor\" is trying to quickly turn Stablecoin into Ether, a harder to freeze crypto PETER PARKS/AFP via Getty Images/AFP hide caption\n\nHow are the criminals laundering these assets?: Laundering this much crypto is NOT simple. The intelligence firm Elliptic broke down how \"TraderTraitor\" is trying to quickly protect its newfound loot. First of all, they want to turn any Stablecoin into assets that cannot be frozen, like Ether (ETH). From there, the group is using automation to create LOTS of new wallets to filter small amounts of crypto, so as not to trigger alarms for moving assets worth a bazillion dollars. From there, launderers want to move the money across networks like Ethereum to Bitcoin then pull it from a mixed pool with a bunch of other people's assets. The goal: make the crypto's origins hazy. \"TraderTraitor\" is moving fast. On Tuesday, Elliptic reported the group has made more than 40,000 transactions, creating a new wallet every 25 seconds.\n\nOne interesting detail: Binance has promised to make customers whole, but investors have already pulled billions from the exchange.\n\nWhat to know: This week, gold fell below $4,000 per ounce after hitting nearly $5,600 per ounce in January. It's typically seen as a safe-haven asset, which is why investors were shoveling money into it earlier this year. As you know, things have been a bit volatile from the Iran War to the criminal probe into the Federal Reserve chair. But today, there's still economic uncertainty, no? The war with Iran rages on. So why are gold prices falling? I took my question to Planet Money co-host Jeff Guo to find out. I asked him: could gold be going down because Treasury bond yields are up? That could mean there are MORE reliable ways to make money.\n\nWhy is gold going down?: Our answer, courtesy of Jeff Guo!\n\nJeff: I think you are right that rising Treasury yields are the story. As you know, gold tends to be seen as a \"safe\" asset and an inflation hedge; but the problem is that gold doesn't earn any income/interest on its own. Meanwhile, you could buy a 10 year TIPS (Treasury Inflation-Protected Securities) bond right now that does earn income, above and beyond inflation. Sure, the Iran war is a source of political instability that might drive investors toward gold. But the main effect of the war so far seems to be raising the price of oil. And higher oil prices are one of the factors pushing interest rates up, making bonds more attractive relative to gold.\n\nWhat to know: People do not want data centers and the election left us with numbers to prove it. Apparently voters either BANNED or placed restrictions on data centers in at least 38 jurisdictions across the country. The numbers within the ballot measures were fascinating. It's also notable that Texas' new governor, Democrat Gina Hinojosa, ran on a platform of reining in data centers. She called for a moratorium on new projects and pushing for more aggressive protections on both ratepayers and the environment. A Democrat hasn't been governor in Texas in more than 30 years.\n\nWhy it matters: All this local opposition could actually make an impact on what big tech wants to do. Local opposition has already made a difference in data center world. S&P Global has tracked projects nationwide and found more than 146 were delayed or canceled through early August. 75% of those were tied to local opposition. Several big tech companies are dropping contract provisions that have drawn the public's ire – one that keeps early phases of data center projects a secret, for example. We will be keeping an eye on this.\n\nIf you're buying a house, you have a choice on what kind of mortgage to get. The \"fixed-rate\" mortgage has become dominant in the U.S. The \"adjustable-rate\" mortgage (ARM) makes up only five percent of mortgages here. They used to be much more popular until the 2008 financial crisis showed adjustable rates can be risky! In 2008, a man in Colorado saw his interest rate rise to NINE percent. He and his wife owed more than the house was worth.\n\n\" I am on the Titanic, watching it sink I don't even have a lifeboat,\" he told NPR at the time.\n\nBut now, the adjustable-rate mortgage is rising in popularity again. They represented 11% of new mortgage applications, the highest in more than a year. What's going on?\n\nThe origins of this story: The show Planet Money was actually born out of a collaborative story between NPR and This American Life called The Giant Pool of Money explaining the 2008 financial crisis. The episode moves through the housing crash by following a chain of people relevant to the market collapsing. It includes a guy (not the Colorado guy) who took out an adjustable-rate mortgage and things did NOT end well for him. His mortgage rate adjusted upwards by more than $2,000 per month due to his adjustable rate.\n\nRest of the WeekWhy is Pakistan cozying up to the crypto industry?\n\nCan Anthropic make enough money to justify its value?\n\nProducer Angel Carreras is reading DC's Absolute Martian Manhunter\n\nI swear I read real books and NBER [National Bureau of Economic Research] papers, but I must recommend another comic: DC's Absolute Martian Manhunter.\n\nInstead of the cartoon alien who loves Oreos and beats up other alien bad guys, this run turns John Jones (FKA J'onn J'onnz) into an FBI agent who survives a suicide bombing and merges with an alien entity. What follows is a psychedelic, politically charged comic, one that's deeply attuned to modern anxieties from the police state and climate dread to the slow erosion of the social contract and xenophobia.\n\nSounds heavy, but it's so wildly inventive with the medium (hold this page up to the sun! cut these bits out of the next page!) that you won't be able to put it down.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "诈骗者甚至可以从那些渴望粉丝小说的人身上赚钱。 这是我从一个假网站上得到的结论，该网站试图出售计算机生成的粉丝小说有声读物，这些内容是任何人根据现有作品创作的。 例如，《五十度灰》就是从《暮光之城》开始的。\n\n这个诈骗网站是在超级受欢迎的粉丝小说网站AO3 ，我们自己的档案之后出现的，估计“安全事件”发生后两到四周。 人们渴望他们的故事，显然会点击任何东西。 幸运的是，诈骗网站已被删除。\n\n要知道：朝鲜只是喜欢窃取加密货币。 他们喜欢它！它已成为他们经济的重要组成部分。 上周，一个名为“TraderTraitor”的国家资助的黑客组织执行了历史上最大的加密货币盗窃案，从Binance窃取了64.3亿美元$ ，加密货币交易所。根据加密分析与合规公司Elliptic的数据， 28.5亿美元已被冻结或扣押。但仍有33.5亿美元与该集团有关。“TraderTraitor”正在积极尝试洗钱（是的，加密货币令人惊讶地可追踪）。被盗资金的很大一部分 rig": "Stocks sank as investors fear an incoming Democratic Congress — and states across the country — could crack down on the AI industry and data centers. Timothy A. Clary/AFP via Getty Images hide caption\n\nTwo days after Democrats won overwhelmingly in the national midterm elections — and in state races across the country — investors started to come to terms with the potential consequences.\n\nFears that an incoming Democratic Congress would crack down on AI sent the tech-heavy Nasdaq down more than 5% and wiped out more than $2 trillion in market value. The Dow Jones and S&P also sank.\n\nThe losses were a stark reversal from Wednesday, when investors had initially sent shares higher across the board, relieved that the midterms did not end with the fate of Congress undecided.\n\nThe sobering-up seen across markets on Thursday reflected investors' concern about a big signal sent by voters: They revolted against AI data centers, which many people worry will gobble up water and energy resources. Those voters supported Democrats who have vowed to push back against the proliferation of these projects.\n\nBut many AI companies — including Meta and Alphabet, the parent company of Google — need to keep building out these data centers to continue developing the technology.\n\nThe Nasdaq's decline comes after what has already been a rough year of technology shares on Wall Street, with investors starting to question whether the massive investments companies have plowed into AI will pay off anytime soon.\n\n\"There is some concern regarding AI regulation, and fears that there could be far more regulations coming to AI technology, as well as a pushback on the buildout of data centers across the country,\" says David Busch, chief investment officer of Trajan Wealth.\n\nAI-related or AI-dependent stocks of all kinds were among the biggest decliners on Thursday, with Tesla and SpaceX — both controlled by billionaire Elon Musk — falling particularly sharply. Musk spent hundreds of millions of dollars in an unsuccessful attempt to elect more Republicans, and investors fear he and his companies could also come under Democratic scrutiny when the new Congress is seated in January.\n\nIt's not only Congress, however. Democrats who vowed to slow down AI development also won at the state level, most prominently Gina Hinojosa, who won the Texas governor's race in stunning fashion.\n\nIt's unclear whether the AI stock rout will continue — or spread beyond tech stocks. AI has become a big driver of the U.S. economy, helping it post a solid annual growth of 3.4% in the July-September quarter.\n\nAnd sophisticated Wall Street investors are not the only ones who own a lot of shares in AI companies. Average Americans also own them through their retirement investment portfolios — such as 401(k)s or pension funds — leaving them also vulnerable to a prolonged AI rout.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民主党在全国中期选举和全国各州竞选中以压倒性优势获胜两天后，投资者开始接受潜在的后果。\n\n担心即将到来的民主党国会会受到打击让科技巨头纳斯达克下跌逾5% ，市值蒸发了逾2万$。 道琼斯指数和标准普尔指数也下跌。\n\n从周三开始，亏损出现了明显逆转，当时投资者最初将股价全面上涨，这让人松了一口气，因为中期选举并没有随着国会的命运而结束。\n\n周四市场的清醒反映出投资者对选民发出的一个大信号的担忧：许多人担心会吞噬水和能源资源的人工智能数据中心。 这些选民支持民主党人，他们发誓要抵制这些项目的扩散。\n\n但许多人工智能公司--包括谷歌的母公司Meta和Alphabet--需要继续建设这些数据中心，以继续开发这项技术。\n\n纳斯达克指数的下跌发生在科技股经历了艰难的一年之后华尔街的nology股票，投资者开始质疑公司对AI的大规模投资是否会很快得到回报。\n\nTrajan Wealth首席投资官David Busch表示： “人们对人工智能监管存在一些担忧，并担心人工智能技术可能会受到更多监管，以及对全国数据中心建设的抵制。”\n\n与人工智能相关或依赖于人工智能的股票各类股票周四下跌幅度最大，特斯拉和SpaceX （均由亿万富翁埃隆·马斯克（ Elon Musk ）控制）下跌幅度特别大。 马斯克花费数亿美元试图选出更多的共和党人，但没有成功，投资者担心，在明年1月新一届国会就职时，他和他的公司也可能受到民主党的审查。\n\n然而，这不仅仅是国会。 发誓要放慢人工智能速度的民主党人发展也赢得了州一级的胜利，最突出的是Gina Hinojosa ，她以惊人的方式赢得了德克萨斯州州长的竞选。\n\n目前尚不清楚", "body": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民主党在全国中期选举和全国各州竞选中以压倒性优势获胜两天后 CNN）电话采访时说，是否再次打击伊朗，取决于双方会否签署一份“非常强有力的协议”。“重启打击恐怕没必要了。”\n\n不过他接着说", "body_orig": "", "body_zh": "（华盛顿/德黑兰/迪拜综合电）美国总统特朗普说，只要当前谈判取得进展，他就极不可能对伊朗发动新的攻势；即使必须重启打击行动，美方也已锁定潜在的基础设施目标，且“可在一小时内摧毁”。\n\n特朗普星期天（11月8日）接受美国有线电视新闻网（CNN）电话采访时说，是否再次打击伊朗，取决于双方会否签署一份“非常强有力的协议”。“重启打击恐怕没必要了。”\n\n不过他接着说：“如果有必要我会打。但我们已经狠狠地打过他们。我重重地出手。你们根本不知道我把他们打得有多重。之前已狠狠地给过他们沉重打击。”\n\n他也强调，即使需要再次攻击伊朗，美国也已经确认潜在的基础设施目标，包括38座桥梁。“我们真的可以在短短一小时内将他们打垮。”\n\n特朗普曾暗示，美国会在中期选举结束后对伊朗发动新一轮大规模打击，但目前尚无任何这方面的迹象。伊朗方面则表明，一旦遭到攻击，势必对美国和以色列的目标还击。\n\n共和党中期选举惨败，丢掉国会参众两院控制权。特朗普随后承认，美伊冲突推高石油和汽油价格，是让共和党在选举中遭遇重挫的部分原因。不过他仍坚称，美国已成功阻止伊朗拥有核武器，且美国的海上封锁成功“扼制”伊朗。\n\n自2月底战争爆发迄今，美国对伊朗的海上封锁已持续了好几个月；近日进一步扩大施压范围，组建“铁门特遣部队”，打击伊朗通过陆路边界及里海运输先进武器和其他受制裁物资的行为。\n\n特朗普星期天较迟时候在自己的社媒平台“真相社交”发文说，这支特遣部队已全面投入运作。\n\n与此同时，美伊谈判进程再次陷入停滞。伊朗外交部长阿拉格齐说，美国中期选举引发的震荡，使致力促成美伊和平协议的斡旋方完全停止往来。“我们现在须观察各调解方还需要多久才能消化这些选举结果，从而确定接下来该如何推进。”\n\n美国国务卿鲁比奥同日也表明，尽管特朗普始终倾向于通过外交途径解决问题，但这种努力成效甚微，“因为伊朗提出的要求不仅不可接受，甚至在某些情况下离谱、荒谬且完全不切实际”。\n\n卡塔尔在美伊之间发挥核心调解作用，负责传达各项提议，并试图弥合双方在伊核计划和结束冲突等条件上的分歧。\n\n根据白宫日程安排，特朗普会在当地时间星期一，与卡塔尔首相兼外长穆罕默德在白宫闭门会晤。消息人士称，美国副总统万斯也计划与穆罕默德会晤。", "body": "（华盛顿/德黑兰/迪拜综合电）美国总统特朗普说，只要当前谈判取得进展，他就极不可能对伊朗发动新的攻势；即使必须重启打击行动，美方也已锁定潜在的基础设施目标，且“可在一小时内摧毁”。\n\n特朗普星期天（11月8日）接受美国有线电视新闻网（CNN）电话采访时说，是否再次打击伊朗，取决于双方会否签署一份“非常强有力的协议”。“重启打击恐怕没必要了。”\n\n不过他接着说：“如果有必要我会打。但我们已经狠狠地打过他们。我重重地出手。你们根本不知道我把他们打得有多重。之前已狠狠地给过他们沉重打击。”\n\n他也强调，即使需要再次攻击伊朗，美国也已经确认潜在的基础设施目标，包括38座桥梁。“我们真的可以在短短一小时内将他们打垮。”\n\n特朗普曾暗示，美国会在中期选举结束后对伊朗发动新一轮大规模打击，但目前尚无任何这方面的迹象。伊朗方面则表明，一旦遭到攻击，势必对美国和以色列的目标还击。\n\n共和党中期选举惨败，丢掉国会参众两院控制权。特朗普随后承认，美伊冲突推高石油和汽油价格，是让共和党在选举中遭遇重挫的部分原因。不过他仍坚称，美国已成功阻止伊朗拥有核武器，且美国的海上封锁成功“扼制”伊朗。\n\n自2月底战争爆发迄今，美国对伊朗的海上封锁已持续了好几个月；近日进一步扩大施压范围，组建“铁门特遣部队”，打击伊朗通过陆路边界及里海运输先进武器和其他受制裁物资的行为。\n\n特朗普星期天较迟时候在自己的社媒平台“真相社交”发文说，这支特遣部队已全面投入运作。\n\n与此同时，美伊谈判进程再次陷入停滞。伊朗外交部长阿拉格齐说，美国中期选举引发的震荡，使致力促成美伊和平协议的斡旋方完全停止往来。“我们现在须观察各调解方还需要多久才能消化这些选举结果，从而确定接下来该如何推进。”\n\n美国国务卿鲁比奥同日也表明，尽管特朗普始终倾向于通过外交途径解决问题，但这种努力成效甚微，“因为伊朗提出的要求不仅不可接受，甚至在某些情况下离谱、荒谬且完全不切实际”。\n\n卡塔尔在美伊之间发挥核心调解作用，负责传达各项提议，并试图弥合双方在伊核计划和结束冲突等条件上的分歧。\n\n根据白宫日程安排，特朗普会在当地时间星期一，与卡塔尔首相兼外长穆罕默德在白宫闭门会晤 总统特朗普的否定，更是对他一手打造的“让美国再次伟大”运动的一场“公投”；狂热支持者对特朗普深感愤怒，质疑运动的成效，这场运动的未来走向面临重大考验。\n\n上周二（11月3日）的中期选举中，民主党掀起“蓝潮”强势席卷全美，从共和党手中夺取国会参众两院控制权。“让美国再次伟大”（Make America Gre", "body_orig": "", "body_zh": "（达拉斯路透电）共和党中期选举惨败，不但是美国选民对总统特朗普的否定，更是对他一手打造的“让美国再次伟大”运动的一场“公投”；狂热支持者对特朗普深感愤怒，质疑运动的成效，这场运动的未来走向面临重大考验。\n\n上周二（11月3日）的中期选举中，民主党掀起“蓝潮”强势席卷全美，从共和党手中夺取国会参众两院控制权。“让美国再次伟大”（Make America Great Again，简称MAGA）运动的支持者埋怨特朗普造成这次失败，让支持者付出代价。\n\n路透社采访十几名MAGA运动积极分子、意见领袖、党内战略家、基督教民族主义领袖，以及专门研究右翼政治的研究人员，采访调查发现，“让美国再次伟大”的拥护者也已对这场运动产生不满和质疑。\n\n同时，阵营内部对于未来走向的意见也不统一，有的主张回归民粹主义和民族主义本源，有的则希望MAGA能减少对单一领导人的依赖，还有小部分人甚至断言，MAGA运动已经终结。\n\n数据情报公司PeakMetrics的社媒流量分析显示，支持特朗普的网络论坛对选举结果的讨论，超过20%自称是MAGA忠实支持者的人，对MAGA领导层及发展方向提出质疑。另有约半数虽然仍支持MAGA运动，但不再认可特朗普为运动领导者；另半数则对特朗普虽有批评，却依然保持忠诚。\n\nMAGA运动重要支持者、特朗普白宫前顾问班农表明，这场“让美国再次伟大”运动必须重建。他促内部阵营推动更为激进的民粹主义和民族主义议程，并对特朗普重用强硬派心腹米勒表示赞赏。\n\n与往年情况不同的是，自选举结果公布以来，美国右翼意见领袖几乎不再讨论“选举舞弊”，而是将败选归咎于共和党自身在经济与战争问题上不得人心。MAGA意见领袖奥汉德利（Rogan O’Handley）在社媒X平台上说：“我们之所以失败，在于没能解决选民委托我们处理的问题。”\n\n近10年来，MAGA运动重塑共和党，并改变美国在贸易、移民、种族和性别等议题上的全国讨论。然而中期选举失利后，MAGA热潮也随之迅速减退。\n\n马里兰大学教授戈尔贝克指出，自1月以来，特朗普最忠实支持者在右翼网络论坛的活跃度持续下降。“即便是最核心的支持者，热情和激情也已不复存在。他们现在认为‘MAGA已经过时’，不再像过去那样充满新鲜感、令人兴奋。”\n\n不过，MAGA意见领袖卢默认为，此次失利并不意味着MAGA运动已终结；任何人想要争取2028年共和党总统候选人提名，都离不开特朗普的支持者基础。\n\n“共和党属于特朗普总统。MAGA运动仍是共和党基本盘绝大多数选民的信念。任何人想要在2028年代表共和党竞选总统，却对特朗普总统全然不屑一顾，那是非常不明智的。”", "body": "（达拉斯路透电）共和党中期选举惨败，不但是美国选民对总统特朗普的否定，更是对他一手打造的“让美国再次伟大”运动的一场“公投”；狂热支持者对特朗普深感愤怒，质疑运动的成效，这场运动的未来走向面临重大考验。\n\n上周二（11月3日）的中期选举中，民主党掀起“蓝潮”强势席卷全美，从共和党手中夺取国会参众两院控制权。“让美国再次伟大”（Make America Great Again，简称MAGA）运动的支持者埋怨特朗普造成这次失败，让支持者付出代价。\n\n路透社采访十几名MAGA运动积极分子、意见领袖、党内战略家、基督教民族主义领袖，以及专门研究右翼政治的研究人员，采访调查发现，“让美国再次伟大”的拥护者也已对这场运动产生不满和质疑。\n\n同时，阵营内部对于未来走向的意见也不统一，有的主张回归民粹主义和民族主义本源，有的则希望MAGA能减少对单一领导人的依赖，还有小部分人甚至断言，MAGA运动已经终结。\n\n数据情报公司PeakMetrics的社媒流量分析显示，支持特朗普的网络论坛对选举结果的讨论，超过20%自称是MAGA忠实支持者的人，对MAGA领导层及发展方向提出质疑。另有约半数虽然仍支持MAGA运动，但不再认可特朗普为运动领导者；另半数则对特朗普虽有批评，却依然保持忠诚。\n\nMAGA运动重要支持者、特朗普白宫前顾问班农表明，这场“让美国再次伟大”运动必须重建。他促内部阵营推动更为激进的民粹主义和民族主义议程，并对特朗普重用强硬派心腹米勒表示赞赏。\n\n与往年情况不同的是，自选举结果公布以来，美国右翼意见领袖几乎不再讨论“选举 function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortTime(s){
  const m = String(s||'').match(/(\d{1,2})[月日:].*?(\d{1,2}):(\d{2})/);
  if(m) return m[2]+':'+m[3];
  const m2 = String(s||'').match(/(\d{1,2}):(\d{2})/);
  return m2 ? m2[1]+':'+m2[2] : (s||'—').slice(-5);
}

  tabs.innerHTML = DATA.papers.map((p,i)=>{
    const n = (p.items||[]).length;
    return `<button type="button" class="${i===cur?'on':''}" data-i="${i}">${esc(p.name)}（${n}）</button>`;
  }).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i; render();});
}
function blockFor(it){
  const tZh = it.title_zh || it.title_orig || '';
  const tOrig = it.title_orig || '';
  const sZh = it.summary_zh || '';
  const sOrig = it.summary_orig || '';
  const bZh = it.body_zh || it.body || '';
  const bOrig = it.body_orig || '';
  const showZh = mode==='zh' || mode==='bi';
  const showOrig = mode==='orig' || mode==='bi';
  const needOrigTitle = tOrig && tOrig !== tZh;
  let html = '<div class="badges">';
  html += `<span class="badge ${esc(it.badge_cls||'warn')}">${esc(it.badge||'未验证')}</span>`;
  if(it.note) html += `<span class="badge">${esc(it.note)}</span>`;
  html += '</div>';
  if(showZh) html += `<h2 class="zh">${esc(tZh)}</h2>`;
  if(showOrig && needOrigTitle) html += `<h2 class="orig">${esc(tOrig)}</h2>`;
  if(showOrig && !needOrigTitle && mode==='orig') html += `<h2 class="orig">${esc(tOrig||tZh)}</h2>`;
  if(showZh && sZh) html += `<p class="summary zh">${esc(sZh)}</p>`;
  if(showOrig && sOrig && sOrig !== sZh) html += `<p class="summary orig">${esc(sOrig)}</p>`;
  if(mode==='bi' && (bZh || bOrig)) html += `<div class="bi-sep"></div>`;
  if(showZh && bZh){
    html += `<div class="body zh">${esc(bZh)}</div>`;
    if(mode==='zh' && bOrig && bOrig.length > Math.max(500, bZh.length + 200)){
      html += `<p class="summary">（以上为译文节选；以下为原文全文）</p>`;
      html += `<div class="body orig">${esc(bOrig)}</div>`;
    }
  }
  if(showOrig && bOrig) html += `<div class="body orig">${esc(bOrig)}</div>`;
  if(showOrig && !bOrig && mode==='orig' && bZh) html += `<div class="body">${esc(bZh)}</div>`;
  return html;
}
function render(){
  renderTabs();
  document.querySelectorAll('.langbar .pill').forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===mode);
  });
  const p = DATA.papers[cur];
  const n = (p.items||[]).length;
  meta.textContent = `《${p.name}》· ${p.lang} · ${p.tab_note} · 本栏 ${n} 条 · 数据时间 ${DATA.updated}`;
  if(p.error){ list.innerHTML = `<div class="empty">${esc(p.error)}</div>`; return; }
  if(!n){ list.innerHTML = `<div class="empty">暂无条目</div>`; return; }
  list.innerHTML = p.items.map(it=>`<article class="card">${blockFor(it)}
    <div class="row"><span>${esc(it.time||'')}</span><a href="${esc(it.link)}" target="_blank" rel="noopener">打开原文</a></div>
  </article>`).join('');
}
document.querySelectorAll('.langbar .pill').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; render(); };
});

/* 全屏：真全屏优先，不行则沉浸模式 */
const FS_IMM_KEY='newsapp4_imm_v1';
function $(id){return document.getElementById(id);}
function realFs(){const d=document;return !!(d.fullscreenElement||d.webkitFullscreenElement);}
function immOn(){return document.documentElement.classList.contains('immersive');}
function fsLabel(){const b=$('btnFs');if(!b)return;b.textContent=(realFs()||immOn())?'退出全屏':'全屏';}
function fsTip(t){const el=$('fsTip');if(!el)return;$('fsTipTxt').textContent=t;el.classList.add('show');clearTimeout(fsTip._t);fsTip._t=setTimeout(()=>el.classList.remove('show'),9000);}
function setImm(on){document.documentElement.classList.toggle('immersive',!!on);try{sessionStorage.setItem(FS_IMM_KEY,on?'1':'0');}catch(e){}fsLabel();try{window.scrollTo(0,on?1:0);}catch(e){}}
function toggleFs(){
  const d=document,el=d.documentElement;
  if(realFs()||immOn()){try{if(realFs())(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}setImm(false);return;}
  setImm(true);
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
  if(standalone){return;}
  let ok=false;
  if(fn&&!ios){try{const p=fn.call(el);if(p&&p.then){p.then(()=>{},()=>{fsTip('这个浏览器不让网页进入真全屏，已切到沉浸模式。想去掉地址栏：用浏览器打开后「添加到主屏幕」，再从桌面图标打开。');});}ok=true;}catch(e){}}
  if(!ok){fsTip(ios?'苹果手机的浏览器不允许网页真全屏，已切到沉浸模式。想彻底没有地址栏：点分享 → 添加到主屏幕，以后从桌面图标打开。':'这个浏览器不支持网页真全屏，已切到沉浸模式。想更全屏：用浏览器打开后「添加到主屏幕」。');}
}
$('btnFs').onclick=toggleFs;
$('fsTipOk').onclick=()=>$('fsTip').classList.remove('show');
document.addEventListener('fullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('webkitfullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&immOn()&&!realFs()){setImm(false);}});
try{if(sessionStorage.getItem(FS_IMM_KEY)==='1')setImm(true);}catch(e){}
fsLabel();

fillCounts();
render();
</script>
</body>
</html>
