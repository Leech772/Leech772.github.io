<script>/* FULL_OXFORD_WEEKLY_V1 · 只保留单词：牛津 Oxford 3000 A1–B1 全部词，按主题分组，每周 300 词 */
"use strict";
const $=id=>document.getElementById(id);
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const LV=["","A1","A2","B1"];
/* ---------- 词表 ---------- */
const W=WD.map((a,i)=>({id:i,en:a[0],pos:a[1],zh:a[2],ph:a[3],exEn:a[4],exZh:a[5],lv:LV[a[6]],tp:a[7],wk:a[8],dy:a[9],fam:a[10]||[],scene:a[11]||""}));
const WEEKS=[];W.forEach(w=>{(WEEKS[w.wk]=WEEKS[w.wk]||[]).push(w.id);});
const NWEEK=WEEKS.length-1;
function weekDays(wk){const s=new Set();(WEEKS[wk]||[]).forEach(i=>s.add(W[i].dy));return [...s].sort((a,b)=>a-b);}
function dayIds(wk,dy){return (WEEKS[wk]||[]).filter(i=>W[i].dy===dy);}
function topicsOf(ids){const c={};ids.forEach(i=>{c[W[i].tp]=(c[W[i].tp]||0)+1;});return Object.keys(c).map(Number).sort((a,b)=>a-b).map(t=>[t,c[t]]);}
function tpName(t){const x=TOPICS[t];return x?x[1]+" "+x[2]:"";}

/* ---------- 状态（沿用原 key：oxford100_v1，旧进度按词 id 保留：原 200 词仍是 id 0–199） ---------- */
const KEY="oxford100_v1",SKEY="oxford100_sentences_v1",EKEY="oxford100_essays_v1",MKEY="oxford100_modules_v1",DRAFT_KEY="oxford100_sent_draft_v1";
const REP_FUZZY=1,REP_NO=2;
const TABS=[["words","① 学单词"],["plan","② 每周计划"],["mem","③ 进度与同步"]];
function defState(){return {v:1,theme:"全部",tab:"words",introHidden:true,voice:"",auto:false,reps:{},known:[],missed:[],queue:[],round:"first",revealed:false,pending:null,sentOn:false,hint:false,lastFb:null,log:[],srs:{},srsDay:"",updated:0,wk:1,dy:1,sess:"day",mode:"spell"};}
let ST=defState();
function mergeState(o){const d=defState();if(!o||typeof o!=="object")return d;const r=Object.assign(d,o);
 const ok=i=>Number.isInteger(i)&&i>=0&&i<W.length;const arr=x=>Array.isArray(x)?x:[];
 r.known=[...new Set(arr(r.known).filter(ok))];r.missed=[...new Set(arr(r.missed).filter(ok))];r.queue=arr(r.queue).filter(ok);
 const reps={};Object.keys(r.reps||{}).forEach(k=>{const n=+r.reps[k];if(ok(+k)&&n>0)reps[k]=n;});r.reps=reps;
 if(!TABS.some(t=>t[0]===r.tab))r.tab="words";
 if(!Array.isArray(r.log))r.log=[];if(r.log.length>500)r.log=r.log.slice(-500);
 if(!(r.wk>=1&&r.wk<=NWEEK))r.wk=1;if(!weekDays(r.wk).includes(r.dy))r.dy=weekDays(r.wk)[0]||1;
 if(!["day","week","review","retest"].includes(r.sess))r.sess="day";
 if(r.mode!=="recog")r.mode="spell";
 if(!r.srs||typeof r.srs!=="object")r.srs={};
 if(!Array.isArray(r.navHist))r.navHist=[];
 r.theme="全部";

function flashSaved(){const el=$("save");if(!el)return;el.classList.add("show");clearTimeout(flashSaved.t);flashSaved.t=setTimeout(()=>el.classList.remove("show"),1200);}
function save(opt){opt=opt||{};ST.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}if(!opt.silent)flashSaved();try{syncSchedulePush();}catch(e){}}
function load(){let o=null;try{const a=localStorage.getItem(KEY);if(a)o=JSON.parse(a);}catch(e){}
 const fresh=!o||o.planV!==1;ST=mergeState(o);
 if(fresh){ST.planV=1;ST.wk=1;ST.dy=1;ST.sess="day";ST.tab="words";ST.queue=[];ST.revealed=false;ST.navHist=[];}
 if(!ST.queue.length)buildQueue();
 return !!o;}

/* ---------- SRS（结构与旧版相同：ST.srs[id]） ---------- */
const DAY=864e5;
function srsDef(){return {status:"new",ease:2.5,intervalDays:0,nextDue:0,lapses:0,wrongStreak:0,okStreak:0,lastResult:"",lastAt:0,reviews:0,spellWrong:0,speakPct:null};}
function srsApply(id,res){const k=String(id);const r=Object.assign(srsDef(),ST.srs[k]||{});const now=Date.now();r.lastResult=res;r.lastAt=now;r.reviews=(r.reviews||0)+1;
 if(res==="ok"){r.wrongStreak=0;r.okStreak=(r.okStreak||0)+1;
  if(r.status==="new"||r.status==="fuzzy"){r.status="learning";r.intervalDays=1;r.nextDue=now+DAY;}
  else if(r.status==="learning"){if(r.okStreak>=2){r.status="mastered";r.intervalDays=3;r.ease=Math.min(2.8,(r.ease||2.5)+0.1);r.nextDue=now+3*DAY;}else{r.intervalDays=1;r.nextDue=now+DAY;}}
  else{let iv=Math.min(30,Math.max(2,(r.intervalDays||3)*(r.ease||2.5)));r.intervalDays=Math.round(iv*10)/10;r.ease=Math.min(2.8,(r.ease||2.5)+0.1);r.nextDue=now+r.intervalDays*DAY;}}
 else if(res==="fuzzy"){r.okStreak=0;r.wrongStreak=(r.wrongStreak||0)+1;r.lapses=(r.lapses||0)+1;r.status="fuzzy";r.ease=Math.max(1.3,(r.ease||2.5)-0.15);r.intervalDays=0.25;r.nextDue=now+6*36e5;}
 else{r.okStreak=0;r.wrongStreak=(r.wrongStreak||0)+1;r.lapses=(r.lapses||0)+1;r.spellWrong=(r.spellWrong||0)+1;r.status="fuzzy";r.ease=Math.max(1.3,(r.ease||2.5)-0.2);const h=r.wrongStreak>=2?1:2;r.intervalDays=h/24;r.nextDue=now+h*36e5;}
 ST.srs[k]=r;}
function srsDueIds(){const now=Date.now();return Object.keys(ST.srs).map(Number).filter(i=>i>=0&&i<W.length).filter(i=>{const r=ST.srs[i];return r&&r.reviews&&r.nextDue&&r.nextDue<=now;}).sort((a,b)=>(ST.srs[a].nextDue||0)-(ST.srs[b].nextDue||0));}

/* ---------- 队列 ---------- */
function sessIds(){if(ST.sess==="review")return srsDueIds().slice(0,50);if(ST.sess==="week")return WEEKS[ST.wk].slice();if(ST.sess==="retest")return dayIds(ST.wk,ST.dy).filter(i=>ST.missed.includes(i));return dayIds(ST.wk,ST.dy);}
function buildQueue(){const ids=ST.sess==="review"?sessIds():sessIds().filter(i=>!ST.known.includes(i));
 const by={};ids.forEach(i=>{(by[W[i].tp]=by[W[i].tp]||[]).push(i);});
 ST.queue=ST.sess==="review"?ids:Object.keys(by).map(Number).sort((a,b)=>a-b).flatMap(t=>shuffle(by[t]));
 ST.sessTotal=ids.length;ST.round="first";ST.revealed=false;ST.pending=null;ST.hint=false;ST.lastFb=null;ST.navHist=[];}
function startDay(wk,dy){ST.wk=wk;ST.dy=dy;ST.sess="day";buildQueue();ST.tab="words";save();renderAll();window.scrollTo(0,0);}
function startReview(){ST.sess="review";buildQueue();ST.tab="words";save();renderAll();window.scrollTo(0,0);}
function cur(){return W[ST.queue[0]];}

/* ---------- 发音：原 200 词用 Jessica；其余单词用有道真人发音，失败时用系统朗读 ---------- */
let _au=null,voice=null;
function pickVoice(){try{if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang||""));voice=vs.find(v=>/samantha|karen|daniel|serena|female|google us english|google uk english female/i.test(v.name||""))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;}catch(e){}}
try{if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function tts(t,slow){if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==="undefined"){aMsg("这个浏览器不能朗读");return;}
 try{const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=(voice&&voice.lang)||"en-US";u.rate=slow?0.7:0.92;speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}}
function stopAudio(){try{if(_au){_au.pause();_au.src="";_au=null;}}catch(e){}try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function playUrl(src,slow,fallback,ms,onOk){stopAudio();const a=new Audio();_au=a;let done=false;const fb=()=>{if(done||_au!==a)return;done=true;try{a.pause();}catch(e){}if(fallback)fallback();};
 const tm=setTimeout(fb,ms||3500);a.addEventListener("playing",()=>{done=true;clearTimeout(tm);if(onOk)onOk();});a.addEventListener("error",()=>{clearTimeout(tm);fb();});
 a.src=src;try{a.playbackRate=slow?0.72:1;}catch(e){}const p=a.play();if(p&&p.catch)p.catch(err=>{clearTimeout(tm);if(err&&err.name==="NotAllowedError"){done=true;aMsg("请再点一下 🔊");}else fb();});}
function speakWord(t,slow){t=String(t||"").trim();if(!t)return;const pack=window.JESSICA_AUDIO;
 if(pack&&(pack[t]||pack[t.toLowerCase()])){playUrl(pack[t]||pack[t.toLowerCase()],slow,()=>tts(t,slow));return;}
 if(/[.?!,]/.test(t)||t.split(/\s+/).length>3){stopAudio();tts(t,slow);return;}
 const k=t.toLowerCase(),url=ydUrl(t);
 /* OFFLINE_SW_V1：离线时，没听过（没缓存）的词直接用系统朗读，不等待 */
 if(isOffline()&&!HEARD.has(k)){stopAudio();tts(t,slow);return;}
 playUrl(url,slow,()=>tts(t,slow),isOffline()?1500:3500,()=>{if(!HEARD.has(k)){HEARD.add(k);swCacheAudio(url);}});}
function ydUrl(t){return "https://dict.youdao.com/dictvoice?type=2&audio="+encodeURIComponent(String(t).toLowerCase());}
function isOffline(){return typeof navigator!=="undefined"&&navigator.onLine===false;}
const HEARD=new Set();
function swCacheAudio(url){try{const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(c)c.postMessage({type:"cacheAudio",url:url});}catch(e){}}
function loadHeard(){try{if(!window.caches)return;caches.open("oxford100-yd-audio-v1").then(c=>c.keys()).then(ks=>{ks.forEach(r=>{try{const w=new URL(r.url).searchParams.get("audio");if(w)HEARD.add(w.toLowerCase());}catch(e){}});}).catch(()=>{});}catch(e){}}
function speakSent(t,slow){stopAudio();tts(String(t||""),slow);}
function aMsg(t){const a=$("audioStatus");if(a){a.textContent=t;clearTimeout(aMsg.t);aMsg.t=setTimeout(()=>{a.textContent="";},2500);}}
function spk(t,sent){const e=esc(t);return sent?' <button type="button" class="mini" data-sent="'+e+'">🔊</button>':' <button type="button" class="mini" data-say="'+e+'">🔊</button>';}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-say],[data-sent],[data-slow]");if(!b)return;if(b.dataset.say)speakWord(b.dataset.say);else if(b.dataset.slow)speakWord(b.dataset.slow,true);else speakSent(b.dataset.sent);});

function posTip(pos){const p=String(pos||"");const m={"名词":"名词：作主语/宾语，前面常加 a / the / my","动词":"动词：表示动作，he/she/it 后一般现在时加 -s","形容词":"形容词：放在 be 动词后或名词前","副词":"副词：修饰动词/形容词，说明程度、方式、时间","介词":"介词：后面接名词或代词","连词":"连词：连接词语或句子","代词":"代词：代替名词","限定词":"限定词：放在名词前，限定范围（this / some / every…）","数词":"数词：表示数量或顺序","感叹词":"感叹词：单独用来表达情绪或打招呼","情态动词":"情态动词：后面接动词原形（can go / must stop）","词组":"词组：整组一起记、一起用"};
 const parts=p.split("/").filter(Boolean);return "💡 "+parts.map(x=>m[x]||x).join("；");}
const norm=s=>String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim();
const normLoose=s=>norm(s).replace(/['\-\s]/g,"");
function maskWord(en){return en.split("").map((c,i)=>/[a-z]/i.test(c)?(i===0||en[i-1]===" "||en[i-1]==="-"?c:"_"):c).join(" ");}

function sessLabel(){if(ST.sess==="review")return "🔁 到期复习";if(ST.sess==="retest")return "🔁 第"+ST.wk+"周 · 第"+ST.dy+"天 · 复测错词";if(ST.sess==="week")return "📅 第"+ST.wk+"周 · 全部";return "📅 第"+ST.wk+"周 · 第"+ST.dy+"天";}

 const db=$("dyChips");const ds=weekDays(ST.wk);db.innerHTML=ds.map(d=>{const ids=dayIds(ST.wk,d);const kn=ids.filter(i=>ST.known.includes(i)).length;return '<button type="button" class="chip day'+(ST.dy===d&&ST.sess==="day"?" on":"")+'" data-dy="'+d+'">第'+d+'天 <span class="cn">'+kn+"/"+ids.length+"</span></button>";}).join("")+(srsDueIds().length?'<button type="button" class="chip rev'+(ST.sess==="review"?" on":"")+'" id="revChip">🔁 复习 <span class="cn">'+srsDueIds().length+"</span></button>":"");
 db.querySelectorAll("[data-dy]").forEach(b=>b.onclick=()=>startDay(ST.wk,+b.dataset.dy));const rc=$("revChip");if(rc)rc.onclick=startReview;

 const w=cur();const ids=sessIds();const kn=ST.sess==="review"?(ST.sessTotal||0)-new Set(ST.queue).size:ids.filter(i=>ST.known.includes(i)).length;const tot=ST.sess==="review"?(ST.sessTotal||0):ids.length;
 $("cLeft").textContent=new Set(ST.queue).size;$("cDone").textContent=kn+"/"+tot;$("cRep").textContent=srsDueIds().length;
 $("bar").style.width=(tot?kn/tot*100:0)+"%";$("phase").textContent=sessLabel()+" · "+(ST.mode==="recog"?"👀 看英文认中文":"✍️ 看中文拼英文");

 const n=ST.reps[w.id]||0;$("repTag").style.display=n?"":"none";$("repTag").textContent="还需答对 "+n+" 次";

 $("bHint").style.display=ST.hint?"none":"";
 $("card").classList.toggle("rev",rev||rec);$("hintBox").classList.toggle("dim",rev);
 $("exEn").textContent=w.exEn||"";$("exZh").textContent=w.exZh||"";$("ex").style.display=rev&&w.exEn?"":"none";$("ex").classList.toggle("show",rev&&!!w.exEn);
 $("inputArea").style.display=(!rec&&!rev)?"":"none";$("recogArea").style.display=(rec&&!rev)?"":"none";
 $("bNext").style.display=rev?"":"none";
 if(rev&&ST.lastFb){$("fb").textContent=ST.lastFb[0];$("fb").className="fb "+ST.lastFb[1];}else{$("fb").textContent="";$("fb").className="fb";}
 renderFam(w,rev);navSync();}
function renderFam(w,rev){const box=$("famBox");if(!rev){box.style.display="none";box.innerHTML="";return;}
 const rf=(typeof ROOTFAM!=="undefined"&&ROOTFAM[w.en])||null;let h="";
 if(rf&&rf.f&&rf.f.length){h+='<div class="fam-h">🌱 词根记忆：'+esc(rf.h||rf.r)+"</div>"+rf.f.map(f=>'<span class="fam-i"><b>'+esc(f[0])+"</b> "+esc(f[1])+" "+esc(f[2])+"</span>").join("");}
 if(w.fam.length){h+='<div class="fam-h">🔗 同词族（本词表里也有）</div>'+w.fam.map(i=>'<span class="fam-i"><b>'+esc(W[i].en)+"</b> "+esc(W[i].zh.split("；")[0])+spk(W[i].en)+"</span>").join("");}

function renderDone(){const ids=sessIds();const missT=ST.missed.filter(i=>ids.includes(i));
 let title=sessLabel()+" 完成 🎉";if(ST.sess==="review")title="🔁 到期复习完成 🎉";
 $("doneTitle").textContent=title;$("doneSub").textContent=ST.sess==="review"?"今天到期的词都复习过了，明天再来。":(missT.length?"这一组有 "+missT.length+" 个词曾经错过/模糊，建议复测一遍。":"一次都没错，太棒了！");
 $("bRetest").style.display=(missT.length&&ST.sess!=="review")?"":"none";
 const nx=nextDay();$("bNextDay").style.display=nx?"":"none";if(nx)$("bNextDay").textContent="下一组：第"+nx[0]+"周 · 第"+nx[1]+"天 →";
 $("bRestart").style.display=ST.sess==="review"?"none":"";}
function nextDay(){for(let k=ST.wk;k<=NWEEK;k++){for(const d of weekDays(k)){if(k===ST.wk&&d<=ST.dy&&ST.sess!=="review")continue;if(dayIds(k,d).some(i=>!ST.known.includes(i)))return [k,d];}}for(let k=1;k<ST.wk;k++){for(const d of weekDays(k)){if(dayIds(k,d).some(i=>!ST.known.includes(i)))return [k,d];}}return null;}
function reveal(msg,cls){ST.revealed=true;ST.lastFb=[msg,cls];save();renderWords();const w=cur();if(w)speakWord(w.en);try{$("bNext").scrollIntoView({block:"nearest"});}catch(e){}}
function markMiss(id,need){ST.reps[id]=Math.max(ST.reps[id]||0,need);if(!ST.missed.includes(id))ST.missed.push(id);ST.known=ST.known.filter(x=>x!==id);ST.pending="later";}
function logIt(en,r){ST.log.push([Date.now(),en,r]);if(ST.log.length>500)ST.log=ST.log.slice(-500);}
function gotRight(w,extra){const n=ST.reps[w.id]||0;if(n>1){ST.reps[w.id]=n-1;ST.pending="later";reveal("✅ 对了！还要再答对 "+(n-1)+" 次，稍后再出现"+(extra||""),"ok");}else{delete ST.reps[w.id];ST.pending="done";reveal("✅ 正确！已掌握"+(extra||""),"ok");}srsApply(w.id,"ok");logIt(w.en,"ok");}
function doSubmit(){const w=cur();if(!w||ST.revealed)return;const raw=$("ans").value;const v=norm(raw);if(!v){$("ans").focus();return;}
 const right=v===norm(w.en)||normLoose(raw)===normLoose(w.en);
 if(right)gotRight(w,/'/.test(w.en)&&!/'/.test(norm(raw))?"（注意「"+w.en+"」带撇号）":"");
 else{markMiss(w.id,REP_NO);srsApply(w.id,"wrong");logIt(w.en,"wrong");reveal("❌ 拼错了，正确是 "+w.en+"（你写的："+raw+"），稍后要再拼对 "+REP_NO+" 次","bad");}}
function doFuzzy(){const w=cur();if(!w||ST.revealed)return;markMiss(w.id,REP_FUZZY);srsApply(w.id,"fuzzy");logIt(w.en,"fuzzy");reveal("🟡 模糊：看清 "+w.en+"，跟读一遍，稍后再答对 "+REP_FUZZY+" 次","mid");}
function doNo(){const w=cur();if(!w||ST.revealed)return;markMiss(w.id,REP_NO);srsApply(w.id,"wrong");logIt(w.en,"no");reveal("🔴 不会：记住 "+w.en+" = "+w.zh+"，稍后再答对 "+REP_NO+" 次","bad");}
function doKnow(){const w=cur();if(!w||ST.revealed)return;gotRight(w,"");}
function insertLater(id){const q=ST.queue;q.shift();const off=3+Math.floor(Math.random()*5);q.splice(Math.min(q.length,off),0,id);}
function navSnap(){return JSON.parse(JSON.stringify({queue:ST.queue,known:ST.known,reps:ST.reps,missed:ST.missed,pending:ST.pending,revealed:ST.revealed,hint:ST.hint,lastFb:ST.lastFb,sess:ST.sess,wk:ST.wk,dy:ST.dy}));}
function navHas(){const h=ST.navHist;return Array.isArray(h)&&h.length>0&&h[h.length-1].sess===ST.sess&&h[h.length-1].wk===ST.wk&&h[h.length-1].dy===ST.dy;}
function navSync(){const b=$("bPrev");const ok=navHas();b.disabled=!ok;b.textContent=ok?"⬅ 上一词":"⬅ 已经是第一个词";}
function next(){const w=cur();if(!w||!ST.revealed)return;if(!Array.isArray(ST.navHist))ST.navHist=[];ST.navHist.push(navSnap());if(ST.navHist.length>40)ST.navHist=ST.navHist.slice(-40);
 if(ST.pending==="later")insertLater(w.id);else{ST.queue.shift();if(!ST.known.includes(w.id))ST.known.push(w.id);ST.queue=ST.queue.filter(x=>x!==w.id||(ST.reps[x]||0)>0);}
 ST.pending=null;ST.revealed=false;ST.hint=false;ST.lastFb=null;$("ans").value="";stopAudio();save();renderAll();
 const nw=cur();if(nw&&(ST.mode==="recog"||ST.auto))speakWord(nw.en);focusCard();}
function prev(){if(!navHas())return;const s=ST.navHist.pop();Object.assign(ST,s);$("ans").value="";save();renderAll();focusCard();}
function focusCard(){try{const c=$("card");const y=Math.max(0,c.getBoundingClientRect().top+window.pageYOffset-70);window.scrollTo(0,y);}catch(e){}
 try{if(ST.mode==="spell"&&$("inputArea").style.display!=="none"&&!/iPhone|iPad|Android/i.test(navigator.userAgent))$("ans").focus({preventScroll:true});}catch(e){}}

  let last=-1;box.innerHTML=dayIds(k,d).map(i=>{const w=W[i];let s="";if(w.tp!==last){last=w.tp;s+='<div class="dy-tp">'+esc(tpName(w.tp))+'</div>';}return s+'<div class="wl"><div class="sent">'+(ST.known.includes(i)?"✅":"▫️")+' <b>'+esc(w.en)+'</b> <span class="ph">'+esc(w.ph)+'</span> <span class="lvb">'+w.lv+'</span> '+esc(w.pos)+' · '+esc(w.zh)+spk(w.en)+'</div>'+(w.exEn?'<div class="wex">'+esc(w.exEn)+spk(w.exEn,1)+'<br><span class="zhl">'+esc(w.exZh)+'</span></div>':'')+'</div>';}).join("");}));}

$("sp").onclick=()=>{const w=cur();if(w)speakWord(w.en);};$("spSlow").onclick=()=>{const w=cur();if(w)speakWord(w.en,true);};
$("spEx").onclick=()=>{const w=cur();if(w&&w.exEn)speakSent(w.exEn);};$("spExS").onclick=()=>{const w=cur();if(w&&w.exEn)speakSent(w.exEn,true);};
$("bRetest").onclick=()=>{ST.sess="retest";buildQueue();save();renderAll();};
$("bNextDay").onclick=()=>{const nx=nextDay();if(nx)startDay(nx[0],nx[1]);};
$("bRestart").onclick=()=>{const ids=sessIds();ST.known=ST.known.filter(i=>!ids.includes(i));buildQueue();save();renderAll();};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{if(ST.mode===b.dataset.mode)return;ST.mode=b.dataset.mode;ST.revealed=false;ST.lastFb=null;ST.hint=false;save({silent:true});renderAll();const w=cur();if(w&&ST.mode==="recog")speakWord(w.en);});

/* ---------- OFFLINE_SW_V1：离线模式 ---------- */
let SW_STATE="init";
function offText(){const net=isOffline()?"（现在是离线状态）":"";
 if(SW_STATE==="ready")return "✅ 离线可用"+net+" · 没网也能学，联网时自动更新";
 if(SW_STATE==="nosupport")return "这个浏览器不支持离线缓存，需要联网使用。"+net;
 if(SW_STATE==="error")return "离线缓存暂时没准备好，联网刷新一次再试。"+net;
 return "⏳ 正在准备离线缓存…"+net;}
function offRender(){const el=$("offStatus");if(el)el.textContent=offText();}
function swInit(){
 if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol)){SW_STATE="nosupport";offRender();return;}
 try{navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"}).catch(()=>{SW_STATE="error";offRender();});
  navigator.serviceWorker.ready.then(()=>{SW_STATE="ready";offRender();loadHeard();}).catch(()=>{});}catch(e){SW_STATE="error";offRender();}}
window.addEventListener("online",offRender);window.addEventListener("offline",offRender);
</script>
<script>/* SYNC_CROSS_DEVICE_V1（保留）：手机电脑云同步，JSONBlob 优先，失败则 ExtendsClass。同步码 key 不变。 */
var SYNC_ID_KEY="oxford100_sync_id_v1",SYNC_AUTO_KEY="oxford100_sync_auto_v1",SYNC_META_KEY="oxford100_sync_meta_v1";
function syncGetId(){try{return localStorage.getItem(SYNC_ID_KEY)||"";}catch(e){return "";}}
function syncSetId(id){try{if(id)localStorage.setItem(SYNC_ID_KEY,id);else localStorage.removeItem(SYNC_ID_KEY);}catch(e){}}
function syncAutoOn(){try{return localStorage.getItem(SYNC_AUTO_KEY)==="1";}catch(e){return false;}}
function syncSetAuto(on){try{localStorage.setItem(SYNC_AUTO_KEY,on?"1":"0");}catch(e){}}
function syncMeta(){try{return JSON.parse(localStorage.getItem(SYNC_META_KEY)||"{}")||{};}catch(e){return {};}}
function syncSetMeta(o){try{localStorage.setItem(SYNC_META_KEY,JSON.stringify(o||{}));}catch(e){}}
function syncMsg(t,ok){var el=$("syncMsg");if(!el){var r=$("restore");if(r)r.textContent=t;return;}el.textContent=t;el.style.color=ok===false?"#b33":(ok?"#2a7":"");}
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
function syncPack(){var meta={};try{var dr=jget(DRAFT_KEY,null);if(dr)meta.draft=dr;}catch(e){}
 ["oxford100_sr_lang_v1","oxford100_strict_v1","oxford100_imm_v1"].forEach(function(k){try{var v=localStorage.getItem(k);if(v!=null)meta[k]=v;}catch(e){}});
 try{if(meta["oxford100_sr_lang_v1"])meta.sr_lang=meta["oxford100_sr_lang_v1"];if(meta["oxford100_strict_v1"]!=null)meta.strict=meta["oxford100_strict_v1"];if(meta["oxford100_imm_v1"]!=null)meta.imm=meta["oxford100_imm_v1"];}catch(e){}
 return {app:"oxford100_v1",v:3,plan:"FULL_OXFORD_WEEKLY_V1",updated:Date.now(),state:ST,modules:jget(MKEY,{}),sentences:jget(SKEY,{}),essays:jget(EKEY,{}),meta:meta};}
function syncUnionArr(a,b){var s={},i,out=[];a=a||[];b=b||[];for(i=0;i<a.length;i++)s[a[i]]=1;for(i=0;i<b.length;i++)s[b[i]]=1;for(i in s)if(s.hasOwnProperty(i))out.push(isNaN(+i)?i:+i);return out;}
function syncMaxReps(a,b){var o={},k;a=a||{};b=b||{};for(k in a)if(a.hasOwnProperty(k))o[k]=a[k];for(k in b)if(b.hasOwnProperty(k))o[k]=Math.max(+o[k]||0,+b[k]||0);return o;}
function syncMergeSrs(a,b){var o={},k;a=a||{};b=b||{};for(k in a)if(a.hasOwnProperty(k))o[k]=a[k];for(k in b)if(b.hasOwnProperty(k)){if(!o[k]||((b[k]&&b[k].lastAt)||0)>((o[k]&&o[k].lastAt)||0))o[k]=b[k];}return o;}
function syncMergeRecords(L,C){var o={},k;L=L||{};C=C||{};for(k in L)if(L.hasOwnProperty(k))o[k]=L[k];for(k in C)if(C.hasOwnProperty(k)){if(!o[k])o[k]=C[k];else if(C[k]&&((C[k].t||0)>=(o[k].t||0)))o[k]=C[k];}return o;}
function syncMergeModules(L,C){/* 旧版听力/口语/语法记录：原样保留合并，新版不使用 */var o={},k;L=L||{};C=C||{};for(k in C)if(C.hasOwnProperty(k))o[k]=C[k];for(k in L)if(L.hasOwnProperty(k)){if(L[k]&&typeof L[k]==="object"&&!Array.isArray(L[k])&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=Object.assign({},o[k],L[k]);else o[k]=L[k];}return o;}
function syncApplyPack(pack,opt){opt=opt||{};
 if(!pack||pack.app!=="oxford100_v1")throw new Error("同步包无效（不是本应用的进度）");
 var c=pack.state||{};var lu=ST.updated||0,cu=pack.updated||c.updated||0;
 var known=syncUnionArr(ST.known,c.known);
 ST.known=known;ST.missed=syncUnionArr(ST.missed,c.missed).filter(function(i){return known.indexOf(i)<0;});
 ST.reps=syncMaxReps(ST.reps,c.reps);ST.srs=syncMergeSrs(ST.srs,c.srs);
 if(cu>lu&&c.planV===1){["wk","dy","sess","mode"].forEach(function(k){if(c[k]!=null)ST[k]=c[k];});if(c.queue&&c.queue.length)ST.queue=c.queue.slice();}
 ST=mergeState(ST);ST.planV=1;
 try{localStorage.setItem(MKEY,JSON.stringify(syncMergeModules(jget(MKEY,{}),pack.modules)));}catch(e){}
 try{localStorage.setItem(SKEY,JSON.stringify(syncMergeRecords(jget(SKEY,{}),pack.sentences)));}catch(e){}
 try{localStorage.setItem(EKEY,JSON.stringify(syncMergeRecords(jget(EKEY,{}),pack.essays)));}catch(e){}
 ST.queue=ST.queue.filter(function(i){return ST.sess==="review"||ST.known.indexOf(i)<0||(ST.reps[i]||0)>0;});
 if(!ST.queue.length)buildQueue();
 ST.updated=Math.max(lu,cu,Date.now());try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}
 syncSetMeta(Object.assign(syncMeta(),{lastPull:Date.now(),cloudUpdated:cu}));
 if(!opt.silent){try{renderAll();}catch(e){}}
 return {known:ST.known.length,cloudUpdated:cu};}
function syncFriendlyErr(e,status){var m=String((e&&e.message)||e||"");
 if(status===404||/404|not found|无效/i.test(m))return "同步码无效或已过期，请重新生成。";
 if(/Failed to fetch|NetworkError|network|CORS|TypeError|Load failed/i.test(m))return "网络不通或云端暂不可用，请稍后再试（也可先用导出/导入）。";
 if(/quota|too large|413/i.test(m))return "进度包太大，云端放不下。请先导出备份。";return m||"同步失败";}
function syncParseId(id){id=String(id||"").trim();if(!id)return null;
 if(/^jb[:_/]/i.test(id))return {be:"jsonblob",id:id.replace(/^jb[:_/]/i,"")};
 if(/^ec[:_/]/i.test(id))return {be:"extendsclass",id:id.replace(/^ec[:_/]/i,"")};
 if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))return {be:"jsonblob",id:id};
 if(/^[0-9a-f]{7,32}$/i.test(id))return {be:"extendsclass",id:id};return {be:"jsonblob",id:id};}
function syncFmtId(be,id){return (be==="extendsclass"?"ec:":"jb:")+id;}
function syncFetch(url,opt){return fetch(url,opt||{}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}return {ok:r.ok,status:r.status,headers:r.headers,text:t,json:j};});});}
function syncJB_create(pack){return syncFetch("https://jsonblob.com/api/jsonBlob",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(pack)}).then(function(r){if(!r.ok)throw new Error("JSONBlob 创建失败 HTTP "+r.status);var loc=r.headers.get("Location")||"";var id=r.headers.get("X-jsonblob-id")||"";if(!id&&loc){var m=loc.match(/jsonBlob\/([^\/\?#]+)/i);if(m)id=m[1];}if(!id&&r.json&&r.json.id)id=r.json.id;if(!id)throw new Error("JSONBlob 未返回同步码");return syncFmtId("jsonblob",id);});}
function syncJB_put(id,pack){return syncFetch("https://jsonblob.com/api/jsonBlob/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(pack)}).then(function(r){if(!r.ok)throw new Error("JSONBlob 上传失败 HTTP "+r.status);return syncFmtId("jsonblob",id);});}
function syncJB_get(id){return syncFetch("https://jsonblob.com/api/jsonBlob/"+encodeURIComponent(id),{method:"GET",headers:{"Accept":"application/json"}}).then(function(r){if(r.status===404)throw new Error("同步码无效");if(!r.ok)throw new Error("JSONBlob 拉取失败 HTTP "+r.status);if(!r.json)throw new Error("同步包损坏");return r.json;});}
function syncEC_create(pack){return syncFetch("https://extendsclass.com/api/json-storage/bin",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(pack)}).then(function(r){if(!r.ok)throw new Error("云端创建失败 HTTP "+r.status);var id=(r.json&&r.json.id)||"";if(!id)throw new Error("云端未返回同步码");return syncFmtId("extendsclass",id);});}
function syncEC_put(id,pack){return syncFetch("https://extendsclass.com/api/json-storage/bin/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"text/plain"},body:JSON.stringify(pack)}).then(function(r){if(r.ok)return syncFmtId("extendsclass",id);return syncEC_create(pack);}).catch(function(){return syncEC_create(pack);});}
function syncEC_get(id){return syncFetch("https://extendsclass.com/api/json-storage/bin/"+encodeURIComponent(id),{method:"GET"}).then(function(r){if(r.status===404)throw new Error("同步码无效");if(!r.ok)throw new Error("云端拉取失败 HTTP "+r.status);if(!r.json)throw new Error("同步包损坏");return r.json;});}
function syncCreate(pack){return syncJB_create(pack).catch(function(e1){return syncEC_create(pack).catch(function(e2){throw new Error(syncFriendlyErr(e1)||syncFriendlyErr(e2));});});}
function syncPut(fullId,pack){var p=syncParseId(fullId);if(!p)return syncCreate(pack);if(p.be==="jsonblob")return syncJB_put(p.id,pack).catch(function(){return syncEC_create(pack);});return syncEC_put(p.id,pack);}
function syncGet(fullId){var p=syncParseId(fullId);if(!p)return Promise.reject(new Error("请输入同步码"));if(p.be==="jsonblob")return syncJB_get(p.id).catch(function(e){if(/^[0-9a-f]{7,32}$/i.test(p.id))return syncEC_get(p.id);throw e;});return syncEC_get(p.id);}
var _syncUpTimer=null,_syncBusy=false;
function syncPushNow(opt){opt=opt||{};if(_syncBusy)return Promise.resolve();if(syncOffline()){_syncPendingOffline=true;syncMsg("📴 现在离线，进度已存在本机；联网后会自动上传。",false);return Promise.resolve();}_syncBusy=true;var pack=syncPack();var id=syncGetId();syncMsg(opt.creating?"正在生成同步码…":"正在上传进度…");
 var op=id?syncPut(id,pack):syncCreate(pack);
 return op.then(function(newId){var changed=id&&newId&&newId!==id;syncSetId(newId);syncSetMeta(Object.assign(syncMeta(),{lastPush:Date.now(),be:syncParseId(newId).be,updated:pack.updated}));
  var tip="✅ 已上传"+(changed?"（同步码已更新，请复制到另一台）":"");if(opt.creating)tip="✅ 已生成同步码，复制到另一台设备即可拉取";try{syncBindMem();}catch(e){}syncMsg(tip,true);return newId;})
 .catch(function(e){syncMsg("❌ "+syncFriendlyErr(e),false);throw e;}).then(function(v){_syncBusy=false;return v;},function(e){_syncBusy=false;return Promise.reject(e);});}
function syncPullNow(code){var id=(code!=null&&String(code).trim())?String(code).trim():syncGetId();if(!id)return Promise.reject(new Error("还没有同步码"));if(syncOffline()){syncMsg("📴 现在离线，联网后再拉取。",false);return Promise.reject(new Error("offline"));}syncMsg("正在拉取云端进度…");
 return syncGet(id).then(function(pack){var info=syncApplyPack(pack,{});var p=syncParseId(id);syncSetId(syncFmtId(p.be,p.id));try{syncBindMem();}catch(e){}syncMsg("✅ 已合并云端进度（掌握 "+info.known+" 词）",true);return info;})
 .catch(function(e){syncMsg("❌ "+syncFriendlyErr(e),false);throw e;});}
var _syncPendingOffline=false;
function syncOffline(){return navigator.onLine===false;}
function syncSchedulePush(){if(!syncAutoOn()||!syncGetId())return;if(syncOffline()){_syncPendingOffline=true;return;}clearTimeout(_syncUpTimer);_syncUpTimer=setTimeout(function(){syncPushNow({}).catch(function(){});},2500);}
function syncBootPull(){if(!syncAutoOn()||syncOffline())return;var id=syncGetId();if(!id)return;syncGet(id).then(function(pack){var cu=pack.updated||(pack.state&&pack.state.updated)||0;var lu=Math.max(ST.updated||0,(syncMeta().updated)||0);if(cu>lu+500){syncApplyPack(pack,{});syncMsg("☁️ 已自动合并云端更新",true);}}).catch(function(){});}
function syncBindMem(){var id=syncGetId();var idEl=$("syncIdView");if(idEl)idEl.textContent=id||"（尚未生成）";var autoEl=$("syncAuto");if(autoEl)autoEl.checked=syncAutoOn();
 var b;
 if((b=$("syncCopy")))b.onclick=function(){var v=syncGetId();if(!v){syncMsg("还没有同步码，请先生成",false);return;}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(function(){syncMsg("已复制同步码",true);}).catch(function(){prompt("复制同步码：",v);});else prompt("复制同步码：",v);};
 if((b=$("syncGen")))b.onclick=function(){if(syncGetId()&&!confirm("将上传本机全部进度并生成/刷新同步码。继续？"))return;syncPushNow({creating:true}).catch(function(){});};
 if((b=$("syncUp")))b.onclick=function(){if(!syncGetId()){syncMsg("请先「生成本机同步码」",false);return;}syncPushNow({}).catch(function(){});};
 if((b=$("syncPull")))b.onclick=function(){var box=$("syncPullBox");if(box)box.style.display=box.style.display==="none"?"block":"none";};
 if((b=$("syncDoPull")))b.onclick=function(){var inp=$("syncIn");var code=inp?inp.value.trim():"";if(!code){syncMsg("请粘贴同步码",false);return;}syncPullNow(code).then(function(){if(inp)inp.value="";}).catch(function(){});};
 if((b=$("syncAuto")))b.onchange=function(){syncSetAuto(b.checked);syncMsg(b.checked?"已开启自动同步":"已关闭自动同步",true);if(b.checked){if(syncGetId())syncBootPull();else syncMsg("开启后请先生成同步码",false);}};}

window.addEventListener("online",function(){setTimeout(function(){try{if(syncGetId()&&(_syncPendingOffline||syncAutoOn())){var was=_syncPendingOffline;_syncPendingOffline=false;if(syncAutoOn())syncBootPull();if(was||syncAutoOn())syncPushNow({}).catch(function(){});}}catch(e){}},1500);});
</script>
<script>try{load();}catch(e){console.error("load",e);ST=defState();ST.planV=1;buildQueue();}
try{renderAll();}catch(e){console.error(e);}
try{save({silent:true});}catch(e){}
setTimeout(function(){try{syncBootPull();}catch(e){}},1200);
window.addEventListener("pagehide",function(){save({silent:true});});
document.addEventListener("visibilitychange",function(){if(document.hidden)save({silent:true});});
/* iOS：第一次点屏幕时预热朗读，避免之后的系统朗读没声音 */
document.addEventListener("touchend",function warm(){document.removeEventListener("touchend",warm);try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}}catch(e){}},{passive:true});

try{swInit();}catch(e){}
</script>
